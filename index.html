function fmtNum(v){ const s=String(v).replace(/,/g,''); if(!/^-?\d+(\.\d+)?$/.test(s)) return v; const p=s.split('.'); return Number(p[0]).toLocaleString('en-US')+(p[1]?'.'+p[1]:''); }
// ===== 次回発火日時の計算 =====
// 頻度変更(条件日付)を考慮し、指定時点で有効な頻度定義を返す
// 現時点で適用される実行プロンプト(頻度変更で切り替わる)
function activePrompt(r, at){
  const now=at||new Date();
  let text=r.prompt||'', label='';
  (r.changes||[]).forEach((c,i)=>{
    const m=String(c.cond||'').match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
    if(!m) return;
    const d=new Date(+m[1], +m[2]-1, +m[3]);
    if(now>=d && c.prompt){ text=c.prompt; label='変更'+(i+1)+'適用中'; }
  });
  return {text, label};
}
function activeSchedule(r, at){
  let freq=r.freq, times=r.times||[];
  (r.changes||[]).forEach(c=>{
    const m=String(c.cond||'').match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
    if(!m) return;
    const d=new Date(+m[1], +m[2]-1, +m[3]);
    if(at>=d){ // 条件日を過ぎていれば適用(後の変更ほど優先)
      if(c.freq) freq=c.freq;
      if(c.times) times=String(c.times).split(',').map(x=>x.trim()).filter(Boolean);
    }
  });
  return {freq, times};
}
function matchFreq(freq, d){
  const w=d.getDay(); // 0=日
  if(/毎時間/.test(freq)) return true;
  if(/毎日/.test(freq)) return true;
  if(/平日/.test(freq)) return w>=1&&w<=5;
  if(/土日/.test(freq)) return w===0||w===6;
  if(/週次/.test(freq)){
    const m=String(freq).match(/[（(]([日月火水木金土])[）)]/);
    if(!m) return w===1; // 曜日指定なしは月曜
    return ['日','月','火','水','木','金','土'].indexOf(m[1])===w;
  }
  if(/月次/.test(freq)){
    const m=String(freq).match(/(\d{1,2})日/);
    return m ? d.getDate()===+m[1] : d.getDate()===1;
  }
  if(/単発/.test(freq)){
    const m=String(freq).match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
    if(!m) return false;
    return d.getFullYear()===+m[1] && d.getMonth()===+m[2]-1 && d.getDate()===+m[3];
  }
  return false;
}
// 現在時刻以降の最初の発火日時を返す(最大400日先まで探索)。開始日(startDate)前は発火しない。
function calcNextFire(r, from){
  const now=from||new Date();
  const st=r.startDate?parseD(r.startDate):null;
  const en=r.endDate?parseD(r.endDate):null;
  if(en && now>new Date(en.getFullYear(),en.getMonth(),en.getDate(),23,59)) return null;
  // 探索の起点は「今」と「開始日」の遅い方
  const base=(st&&st>now)?st:now;
  for(let i=0;i<400;i++){
    const d=new Date(base.getFullYear(), base.getMonth(), base.getDate()+i);
    if(st && d<new Date(st.getFullYear(),st.getMonth(),st.getDate())) continue;
    if(en && d>new Date(en.getFullYear(),en.getMonth(),en.getDate())) return null;
    const sch=activeSchedule(r, d);
    if(!matchFreq(sch.freq, d)) continue;
    let times=(sch.times&&sch.times.length?sch.times:['09:00']).slice().sort();
    if(/毎時間/.test(sch.freq)){
      // 「9:00-15:00」形式ならその時間帯、単一時刻なら以降その日の終わりまで、指定なしは9-15時
      const rg=String(sch.times&&sch.times[0]||'').match(/(\d{1,2}):(\d{2})\s*[-〜~]\s*(\d{1,2}):(\d{2})/);
      const sH=rg?+rg[1]:9, eH=rg?+rg[3]:15, mn=rg?rg[2]:'00';
      times=[]; for(let hh=sH; hh<=eH; hh++) times.push(String(hh).padStart(2,'0')+':'+mn);
    }
    for(const tm of times){
      const mm=String(tm).match(/(\d{1,2}):(\d{2})/); if(!mm) continue;
      const cand=new Date(d.getFullYear(), d.getMonth(), d.getDate(), +mm[1], +mm[2]);
      if(cand>now && (!st || cand>=st)) return cand;
    }
  }
  return null;
}
function fmtFire(d){
  if(!d) return '—';
  const wd=['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}(${wd}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function refreshFires(){ (DB.reminders||[]).forEach(r=>{ if(r.paused){ r.nextFire=null; return; } const d=calcNextFire(r); r.nextFire = d? fmtFire(d) : null; }); }
function toISO(s){ const d=parseD(s); if(!d) return ''; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fromISO(s){ const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return ''; return `${+m[1]}/${+m[2]}/${+m[3]}`; }
function fmtToday(){ const d=today(); return `2026/${d.getMonth()+1}/${d.getDate()}`; }

//////////////////// HYPO ////////////////////
// 注目ポイントに紐づくリマインダー
function remindersOf(hid){ return (DB.reminders||[]).filter(r=>(r.hypoIds||[]).includes(hid)); }
// 日付候補を持つのにリマインダー未登録の注目ポイント(＝まだ予定になっていないもの)
function pendingHints(){
  return (DB.hypotheses||[]).filter(h=>h.kind==='watch' && h.remindHint && h.remindHint.date && !remindersOf(h.id).length)
    .sort((a,b)=>(parseD(a.remindHint.date)||0)-(parseD(b.remindHint.date)||0));
}
function hypoMiniCard(hh){
  const isMemo=hh.kind==='memo';
  const rms=remindersOf(hh.id);
  const hint=(!isMemo && !rms.length && hh.remindHint && hh.remindHint.date)?hh.remindHint:null;
  // 日付の扱いはリマインダーに一本化しているので、ここでは「登録済みか/未登録か」だけを見せる。
  // 「リマインド未登録」とだけ書くと、日付候補が無いだけの注目ポイント(バッジ無し)との違いが
  // 伝わらない(「未登録」なのは全部同じでは、と読める)。候補日そのものを出し、
  // 「日付の候補があるのに登録していない」ことだと分かるようにする
  let status='';
  if(rms.length) status=`<span class="meta" style="color:var(--navy);font-weight:600">${bellIcon()} 次回 ${esc(fmtFire(calcNextFire(rms[0])))}${rms.length>1?` 他${rms.length-1}件`:''}</span>`;
  else if(hint) status=`<span class="chip amber">${bellIcon()} 候補 ${esc(hint.date)}(未登録)</span>`;
  return `<div class="swipe">
    <div class="list-row" style="align-items:flex-start" onclick="sheetEditHypo('${hh.id}')">
      <div class="lt">
        <div class="row" style="justify-content:flex-start;gap:8px">
          <span class="chip ${isMemo?'gray':'amber'}">${isMemo?'メモ':'注目'}</span>${status}
        </div>
        <div class="clip2" style="margin-top:4px;font-size:13px;white-space:pre-wrap">${esc(hh.text)}</div>
      </div>
    </div>
    <button class="del-btn" onclick="delHypo('${hh.id}')">削除</button>
  </div>`;
}
function addRemForHypo(hid){ const hh=DB.hypotheses.find(x=>x.id===hid); if(!hh)return; STATE._triageItems=null; STATE.remHypoIds=[hid]; STATE.remStockId=hh.stockId; STATE._remFromStock=true; closeSheet(); sheetAddReminder(hh.stockId, [hid]); }
// 取り込み直後に「イベント日つき注目ポイント」をまとめて確認する一覧シート。
// 同じイベント日(同じ決算など)のものは1グループにまとめ、1つのリマインダーで確認できるようにする。
function sheetReminderTriage(items, sid){
  STATE._triageItems=items; STATE._triageSid=sid;
  // 全件さばき終えた(またはすべて×で消した)らシートを閉じる。
  // 閉じずにreturnすると、消したはずの項目が残って見える
  if(!items || !items.length){ STATE._triageItems=null; closeSheet(); return; }
  const groups={};
  items.forEach(it=>{ (groups[it.eventDate]=groups[it.eventDate]||[]).push(it); });
  const days=Object.keys(groups).sort((a,b)=>(parseD(a)||0)-(parseD(b)||0));
  let h=`<h3>リマインダーを登録</h3>
    <div class="muted" style="margin-bottom:10px">日付つきの注目ポイントが取り込まれました。日付はリマインダーで管理します。同じ日のものは1つのリマインダーにまとめられます。</div>`;
  days.forEach(d=>{
    const g=groups[d];
    h+=`<div class="card" style="padding:10px 12px;margin-bottom:9px">
      <div class="row"><span class="chip navy">${esc(d)}</span><span class="muted" style="font-size:11px">${g.length}件</span></div>`;
    g.forEach(it=>{
      h+=`<div class="row" style="align-items:flex-start;gap:8px;margin-top:7px">
        <div class="clip3" style="flex:1;font-size:12px">${esc(it.text)}</div>
        <span class="del" onclick="triageRemove('${it.id}')">×</span>
      </div>`;
    });
    h+=`<button class="btn sm" style="margin-top:9px;width:auto" onclick="triageAddReminder('${escArg(d)}')">${g.length>1?`この日の${g.length}件をまとめてリマインダー登録`:'リマインダーを登録'}</button>
    </div>`;
  });
  h+=`<button class="btn ghost" style="margin-top:4px" onclick="STATE._triageItems=null;closeSheet();">あとで登録する</button>`;
  openSheet(h);
}
function triageRemove(id){
  STATE._triageItems=(STATE._triageItems||[]).filter(x=>x.id!==id);
  sheetReminderTriage(STATE._triageItems, STATE._triageSid);
}
// 同じイベント日の注目ポイントをまとめて1つのリマインダーに紐づける
function triageAddReminder(day){
  const g=(STATE._triageItems||[]).filter(x=>x.eventDate===day);
  if(!g.length) return;
  const ids=g.map(x=>x.id);
  STATE.remHypoIds=ids; STATE.remStockId=STATE._triageSid; STATE._remFromStock=true;
  closeSheet(); sheetAddReminder(STATE._triageSid, ids);
}
// kind/presetText を渡すと、種別セグメントで切り替えた直後の状態を再現する
// (入力途中の文章を保ったまま、メモ⇄注目ポイントを行き来できるようにするため)
function sheetEditHypo(hid, sid, kind, presetText){
  const hh=hid?DB.hypotheses.find(x=>x.id===hid):null;
  const s=stock(hh?hh.stockId:sid);
  // 新規作成時の既定は注目ポイント(メモより利用ニーズが高い想定)。既存項目の編集時はその項目のkindに従う
  const curKind=kind||(hh?hh.kind:'watch');
  const isMemo=curKind==='memo';
  const text=presetText!==undefined?presetText:(hh?hh.text:'');
  let h=`<h3>${hh?(isMemo?'メモを編集':'注目ポイントを編集'):(isMemo?'メモを作成':'注目ポイントを作成')}</h3>
    <div class="muted" style="margin-bottom:10px">${esc(s.name)}</div>
    <div class="seg" style="margin-bottom:12px">
      <button class="${isMemo?'':'on'}" onclick="switchHypoKind('${hid||''}','${s.id}','watch')">注目ポイント</button>
      <button class="${isMemo?'on':''}" onclick="switchHypoKind('${hid||''}','${s.id}','memo')">メモ</button>
    </div>
    <label class="fld"><span class="t">${isMemo?'メモ(気づき・違和感・自分の判断)':'注目ポイント(何がどうなったら良い/悪いか)'}</span><textarea id="hy_text" style="min-height:70px" placeholder="${isMemo?'例: DC向けの需給が本丸。古河電工とペアで見る。':'例: データセンター向け光ケーブル需要が続伸するか。DC事業者のCAPEXが鈍化したら要警戒。'}">${esc(text)}</textarea></label>`;
  // 日付欄はここには置かない。日付を持たせる＝リマインダー登録なので、保存後に登録シートへ誘導する
  const rms=hid?remindersOf(hid):[];
  if(!isMemo){
    h+=`<div class="muted" style="font-size:11px;margin:-4px 0 10px">日付で思い出したい場合は、保存後に「リマインダーを登録」してください。</div>`;
    // 登録済みのリマインダーはここから開けるようにする(一覧の行からボタンを外した分の受け皿)
    if(rms.length) h+='<div class="list">'+rms.map(r=>`<div class="list-row" onclick="openReminder('${r.id}')"><div class="lt"><div class="ttl">${bellIcon()} ${esc(r.title||'リマインダー')}</div><div class="meta">次回 ${esc(fmtFire(calcNextFire(r)))}</div></div><span class="rt"><span class="arrow">›</span></span></div>`).join('')+'</div>';
  }
  h+=`<button class="btn pri" onclick="saveHypo('${hh?hh.id:''}','${s.id}','${curKind}')">保存</button>
    ${isMemo?'':`<button class="btn" style="margin-top:8px" onclick="saveHypo('${hh?hh.id:''}','${s.id}','${curKind}',true)">保存して${rms.length?'リマインダーを追加':'リマインダーを登録'}</button>`}
    ${hid?`<button class="btn danger" style="margin-top:8px" onclick="delHypo('${hid}')">削除</button>`:''}
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet();openStock('${s.id}')">キャンセル</button>`;
  openSheet(h);
}
// セグメントで種別を切り替える。入力中の文章を読み取ってから同じシートを開き直す
function switchHypoKind(hid, sid, kind){
  const cur=$('#hy_text'); const text=cur?cur.value:undefined;
  sheetEditHypo(hid||null, sid, kind, text);
}
function saveHypo(hid, sid, kind, thenRemind){
  const text=$('#hy_text').value.trim();
  if(!text){ toast('内容を入力してください'); return; }
  let id=hid;
  if(hid){
    const hh=DB.hypotheses.find(x=>x.id===hid);
    hh.text=text;
    if(kind) hh.kind=kind; // 編集画面のセグメントでメモ⇄注目ポイントを切り替えた分を反映する
  } else {
    id='h'+Date.now();
    DB.hypotheses.push({id, stockId:sid, kind:kind||'watch', text});
  }
  if(thenRemind){ save(); closeSheet(); addRemForHypo(id); return; }
  // 保存したらシートを閉じる。閉じないと同じ画面のまま保存を再度押せてしまい、
  // 新規作成の場合は同じ内容が二重に登録されてしまう
  save(); closeSheet(); openStock(sid); toast('保存しました');
}
function delHypo(hid){
  const hh=DB.hypotheses.find(x=>x.id===hid); if(!hh) return;
  const rms=remindersOf(hid);
  // 紐づくリマインダーが無ければ、これまでどおり単純な確認で消す
  if(!rms.length){
    askConfirm({title:'削除', body:hh.text.slice(0,80)+(hh.text.length>80?'…':''), okLabel:'削除する', danger:true, onOk:()=>{
      const sid=hh.stockId; DB.hypotheses=DB.hypotheses.filter(x=>x.id!==hid); save(); openStock(sid); toast('削除しました');
    }});
    return;
  }
  // リマインダーが紐づく場合は「内容だけ消す/リマインダーだけ消す/両方消す」を選べるようにする。
  // 内容を消してもリマインダーは通知を続けたい、逆にリマインダーだけ止めて記録は残したい、両方あり得るため
  openSheet(`<h3>削除</h3>
    <div class="card" style="white-space:pre-wrap;font-size:13px;line-height:1.6;margin-bottom:10px">${esc(hh.text.slice(0,80)+(hh.text.length>80?'…':''))}</div>
    <div class="muted" style="font-size:11px;margin-bottom:12px">この${hh.kind==='memo'?'メモ':'注目ポイント'}には${rms.length}件のリマインダーが紐づいています。</div>
    <button class="btn danger" onclick="doDelHypoOnly('${hid}')">この内容だけ削除(リマインダーは残す)</button>
    <button class="btn" style="margin-top:8px" onclick="doDelRemindersOnly('${hid}')">リマインダーのみ削除(内容は残す)</button>
    <button class="btn danger" style="margin-top:8px" onclick="doDelHypoAndReminders('${hid}')">両方削除</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">キャンセル</button>`);
}
function doDelHypoOnly(hid){
  const hh=DB.hypotheses.find(x=>x.id===hid); if(!hh) return;
  const sid=hh.stockId; DB.hypotheses=DB.hypotheses.filter(x=>x.id!==hid); save(); closeSheet(); openStock(sid); toast('削除しました');
}
// このメモ/注目ポイントへの紐づけを外す。他の紐づけ先が無くなったリマインダーは削除する
// (取り込み直後の一括登録では1つのリマインダーが複数の注目ポイントに紐づくことがあるため、
//  無条件にリマインダーごと消すと、他の注目ポイントの通知まで一緒に止めてしまう)
function unlinkRemindersFromHypo(hid){
  remindersOf(hid).forEach(r=>{
    r.hypoIds=(r.hypoIds||[]).filter(x=>x!==hid);
    if(!r.hypoIds.length) DB.reminders=DB.reminders.filter(x=>x.id!==r.id);
  });
}
function doDelRemindersOnly(hid){
  const hh=DB.hypotheses.find(x=>x.id===hid); if(!hh) return;
  const sid=hh.stockId; unlinkRemindersFromHypo(hid); save(); closeSheet(); openStock(sid); toast('リマインダーを削除しました');
}
function doDelHypoAndReminders(hid){
  const hh=DB.hypotheses.find(x=>x.id===hid); if(!hh) return;
  const sid=hh.stockId; unlinkRemindersFromHypo(hid); DB.hypotheses=DB.hypotheses.filter(x=>x.id!==hid); save(); closeSheet(); openStock(sid); toast('削除しました');
}

// ブラウザのconfirm()はSafariの「今後表示しない」で無効化されるため、アプリ内シートで確認する
function askConfirm(opts){
  const o=Object.assign({title:'確認', body:'', okLabel:'OK', danger:false, onOk:null}, opts||{});
  window._confirmOk=o.onOk;
  openSheet(`<h3>${esc(o.title)}</h3>
    <div class="card" style="white-space:pre-wrap;font-size:13px;line-height:1.6">${esc(o.body)}</div>
    <button class="btn ${o.danger?'danger':'pri'}" style="margin-top:12px" onclick="runConfirm()">${esc(o.okLabel)}</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">キャンセル</button>`);
}
function runConfirm(){ const f=window._confirmOk; window._confirmOk=null; closeSheet(); if(typeof f==='function') setTimeout(f,60); }
// 全シート共通で右上に閉じるボタンを出す。背景タップに気づかない場合の逃げ道として、個々のシート側では実装しない
function openSheet(html){
  $('#sheet').innerHTML='<button class="sheet-close" onclick="requestCloseSheet()" aria-label="閉じる">✕</button>'+html;
  $('#sheet').style.transform='';
  $('#scrim').classList.add('show');
  $('#edgeSwipeZone').classList.add('show');
  STATE._sheetSnap=sheetSnapshot();
}
function closeSheet(){ $('#scrim').classList.remove('show'); $('#edgeSwipeZone').classList.remove('show'); $('#exitConfirm').classList.remove('show'); $('#sheet').style.transform=''; STATE._sheetSnap=undefined; }
// シート内の自由入力(テキスト)だけを対象に、開いた時点からの変更有無を見る。
// セレクト/チェックボックスだけの画面(メニューや確認ダイアログ)は対象にならず、常に即閉じでよい
function sheetSnapshot(){
  return [...document.querySelectorAll('#sheet textarea, #sheet input[type="text"], #sheet input:not([type])')].map(e=>e.value).join('␟');
}
function sheetDirty(){ return STATE._sheetSnap!==undefined && sheetSnapshot()!==STATE._sheetSnap; }
// ✕・背景タップ・エッジスワイプの3つの「閉じる」入口はすべてここを通す。
// save()後などアプリ側から明示的に閉じる場合はcloseSheet()を直接呼ぶので、この確認は挟まらない
function requestCloseSheet(){
  if(sheetDirty()){ $('#exitConfirm').classList.add('show'); }
  else { closeSheet(); }
}
function cancelCloseSheet(){ $('#exitConfirm').classList.remove('show'); $('#sheet').style.transform=''; }
function confirmCloseSheet(){ $('#exitConfirm').classList.remove('show'); closeSheet(); }
// 右エッジからのスワイプでシートを閉じる(ブラウザの戻るジェスチャーに合わせる)。
// 判定域(#edgeSwipeZone、左端30%)は広めなので、単なるタップやシートの縦スクロールを
// 巻き込まないよう、動き出しで「横方向のドラッグか」を見極めてから初めて介入する。
// タップ/縦スクロールと判定した場合は、帯の下にある本来の要素に処理を渡す
(function(){
  const THRESH=70, DECIDE=10;
  let sx=0, sy=0, lastY=0, state='idle'; // idle|pending|swipe|scroll
  let tapTarget=null;
  const zone=$('#edgeSwipeZone'), sheet=$('#sheet');
  function underneath(x,y){
    zone.style.pointerEvents='none';
    const el=document.elementFromPoint(x,y);
    zone.style.pointerEvents='';
    return el;
  }
  zone.addEventListener('touchstart', e=>{
    if($('#exitConfirm').classList.contains('show')) return;
    const t=e.touches[0];
    sx=t.clientX; sy=lastY=t.clientY; state='pending';
    tapTarget=underneath(sx, sy);
  }, {passive:true});
  zone.addEventListener('touchmove', e=>{
    if(state==='idle') return;
    const t=e.touches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
    if(state==='pending'){
      if(Math.abs(dx)<DECIDE && Math.abs(dy)<DECIDE) return; // タップかどうかまだ様子見
      state=(dx>0 && Math.abs(dx)>Math.abs(dy)) ? 'swipe' : 'scroll';
    }
    if(state==='swipe'){ sheet.style.transform=`translateX(${dx}px)`; if(e.cancelable) e.preventDefault(); }
    else if(state==='scroll'){ sheet.scrollTop-=(t.clientY-lastY); if(e.cancelable) e.preventDefault(); }
    lastY=t.clientY;
  }, {passive:false});
  zone.addEventListener('touchend', ()=>{
    if(state==='pending' && tapTarget) tapTarget.dispatchEvent(new MouseEvent('click', {bubbles:true, cancelable:true}));
    if(state==='swipe'){
      const m=sheet.style.transform.match(/translateX\(([\d.]+)px\)/); const dx=m?parseFloat(m[1]):0;
      sheet.style.transition='transform .15s ease-out'; sheet.style.transform='translateX(0)';
      setTimeout(()=>{ sheet.style.transition=''; }, 150);
      if(dx>THRESH) requestCloseSheet();
    }
    state='idle'; tapTarget=null;
  }, {passive:true});
})();
// 詳細画面(銘柄・市場)を、画面左側からの右スワイプで閉じて一覧に戻す。
// シートのエッジスワイプ(#edgeSwipeZone)と違い、こちらは帯を重ねず #view 上で直接判定する。
// 帯を重ねると、その下にあるメモ行・分析項目のタップや指標ページャーの横スワイプを奪ってしまうため
(function(){
  const THRESH=70, DECIDE=10, START_RATIO=.4;
  const view=$('#view');
  let sx=0, sy=0, state='idle'; // idle|pending|swipe
  view.addEventListener('touchstart', e=>{
    state='idle';
    if(!STATE.stockId) return;                                    // 詳細画面以外では効かせない
    if($('#scrim').classList.contains('show')) return;             // シートが開いている間はシート側の担当
    if(e.touches.length!==1) return;
    const t=e.touches[0];
    if(t.clientX > window.innerWidth*START_RATIO) return;          // 左40%から始まったものだけ拾う
    const xs=e.target.closest && e.target.closest('.pages,.xscroll');
    if(xs && xs.scrollWidth>xs.clientWidth+2) return;              // 実際に横スクロールする部品の中では譲る
    if(e.target.closest && e.target.closest('.list .swipe')) return; // メモ・注目ポイントの削除スワイプの中でも譲る
    sx=t.clientX; sy=t.clientY; state='pending';
  }, {passive:true});
  view.addEventListener('touchmove', e=>{
    if(state==='idle') return;
    const t=e.touches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
    if(state==='pending'){
      if(Math.abs(dx)<DECIDE && Math.abs(dy)<DECIDE) return;       // タップか縦スクロールかまだ様子見
      if(!(dx>0 && Math.abs(dx)>Math.abs(dy))){ state='idle'; return; } // 縦スクロールと左方向は邪魔しない
      state='swipe';
      showPrevUnder();
      view.style.boxShadow='-6px 0 18px rgba(20,30,40,.16)';
    }
    view.style.transform=`translateX(${Math.max(0,dx)}px)`;
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  function endSwipe(){
    if(state==='swipe'){
      const m=view.style.transform.match(/translateX\(([\d.]+)px\)/); const dx=m?parseFloat(m[1]):0;
      const back=dx>THRESH;
      view.style.transition='transform .15s ease-out';
      // 戻るときは画面の外まで送り出してから差し替える。途中で止めたときだけ元の位置に戻す
      view.style.transform=back?`translateX(${view.offsetWidth}px)`:'translateX(0)';
      setTimeout(()=>{
        view.style.transition=''; view.style.transform=''; view.style.boxShadow='';
        if(back) backFromDetail(); else hidePrevUnder();
      }, 150);
    }
    state='idle';
  }
  view.addEventListener('touchend', endSwipe, {passive:true});
  view.addEventListener('touchcancel', endSwipe, {passive:true});
})();
// メモ・注目ポイントの行を右→左スワイプで削除できるようにする。
// 上の詳細画面スワイプ(左端からの右スワイプ)とは方向が逆で、かつ画面のどこからでも
// 始められる(行自体をつまんで動かす感覚のため、開始位置を絞らない)。
// #view への委譲で、render()のたびに行が作り直されても付け外し不要にする
(function(){
  const THRESH=32, DECIDE=10, OPEN=64; // OPEN は .del-btn の幅(CSS側)と合わせる
  const view=$('#view');
  let sx=0, sy=0, state='idle', fg=null, startX=0, openRow=null; // idle|pending|swipe
  // setTimeout のコールバックは外側の可変変数(openRow/fg)ではなく、呼び出し時点の要素を
  // ローカル変数で捕まえて参照する。外側の変数は次の操作で null に戻ってしまうため
  function closeOpenRow(){ if(openRow){ const el=openRow; el.style.transition='transform .15s ease-out'; el.style.transform='translateX(0)'; setTimeout(()=>{ el.style.transition=''; },150); openRow=null; } }
  view.addEventListener('touchstart', e=>{
    state='idle'; fg=null;
    const row=e.target.closest && e.target.closest('.list .swipe');
    if(!row){ closeOpenRow(); return; }
    const rowFg=row.querySelector('.list-row'); if(!rowFg) return;
    if(openRow && openRow!==rowFg) closeOpenRow();
    const t=e.touches[0]; sx=t.clientX; sy=t.clientY; state='pending';
    fg=rowFg; startX=(openRow===rowFg)?-OPEN:0;
  }, {passive:true});
  view.addEventListener('touchmove', e=>{
    if(state==='idle'||!fg) return;
    const t=e.touches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
    if(state==='pending'){
      if(Math.abs(dx)<DECIDE && Math.abs(dy)<DECIDE) return;
      // 左スワイプ(開く)・右スワイプ(既に開いた行を閉じる)以外、つまり縦の動きは邪魔しない
      if(Math.abs(dy)>=Math.abs(dx)){ state='idle'; return; }
      state='swipe';
    }
    let x=startX+dx; x=Math.max(-OPEN, Math.min(0,x));
    fg.style.transform=`translateX(${x}px)`;
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  function endSwipe(){
    if(state==='swipe'){
      const el=fg;
      const m=el.style.transform.match(/translateX\((-?[\d.]+)px\)/); const x=m?parseFloat(m[1]):0;
      el.style.transition='transform .15s ease-out';
      if(x<-THRESH){ el.style.transform=`translateX(${-OPEN}px)`; openRow=el; }
      else { el.style.transform='translateX(0)'; if(openRow===el) openRow=null; }
      setTimeout(()=>{ el.style.transition=''; }, 150);
    }
    state='idle'; fg=null;
  }
  view.addEventListener('touchend', endSwipe, {passive:true});
  view.addEventListener('touchcancel', endSwipe, {passive:true});
})();

const _pagerState={}; const _pagerCap={};
function pagerBlock(id, pageHtmls, capFn, pageClass){
  const total=pageHtmls.length;
  _pagerCap[id]=capFn||null;
  const tight=/\btight\b/.test(pageClass||'');
  const cls='page'+(pageClass?' '+pageClass:'');
  const pagesHtml=pageHtmls.map(ph=>`<div class="${cls}">${ph}</div>`).join('');
  const dotsHtml=total>1?Array.from({length:total},(_,i)=>`<span class="dot${i===0?' on':''}"></span>`).join(''):'';
  // tight(指標グリッド・グラフ)は左右に余白が無く端のシェブロンが中身に重なるため出さない。
  // 下の矢印ボタンとドットで送れることは伝わる
  const edges=tight?'':`<div class="edge-hint left" id="${id}_el">‹</div><div class="edge-hint right" id="${id}_er">›</div>`;
  // tightは「指標 1/2」など短いキャプションなので送りボタンの行に重ねる。
  // それ以外(分析項目の「左にスワイプして詳細を見る」など)は文章が長く重ねると欠けるため、
  // ボタン行の上に独立した中央揃えの行にする
  return `<div class="pages-wrap"><div class="pages" id="${id}_pages">${pagesHtml}</div>
      ${edges}</div>
    ${total>1?`${tight?'':`<div class="swipecap swipecap-line" id="${id}_cap"></div>`}<div class="pager-nav">
      ${tight?`<span class="swipecap" id="${id}_cap"></span>`:''}
      <div class="dots" id="${id}_dots">${dotsHtml}</div>
    </div>`:''}`;
}
function pagerInit(id){
  // ページャーが無くなった画面(グラフが1枚に減ったときなど)では、前の状態を残さない。
  // 残すと「総数5」のまま次の操作を受けてしまい、存在しない要素を触りにいく
  const pagesEl=document.getElementById(id+'_pages'); if(!pagesEl){ delete _pagerState[id]; return; }
  const total=pagesEl.children.length;
  _pagerState[id]={activeIdx:0, total};
  pagesEl.scrollLeft=0;
  pagerUpdateNav(id);
  pagesEl.onscroll=()=>{ const w=pagesEl.clientWidth; if(!w) return; const idx=Math.round(pagesEl.scrollLeft/w); if(idx!==_pagerState[id].activeIdx){ _pagerState[id].activeIdx=idx; pagerUpdateNav(id); } };
}
function pagerGoto(id, idx){
  const st=_pagerState[id]; if(!st||idx<0||idx>=st.total) return;
  const el=document.getElementById(id+'_pages'); if(!el) return;
  const left=idx*el.clientWidth;
  el.scrollTo({left, behavior:'smooth'});
  // 滑らかな送りは、直前に別のスクロールが走っていると端末側で取り消されることがある。
  // 送れていなければ位置を直接入れて、押したのに動かない状態を残さない
  setTimeout(()=>{ if(Math.abs(el.scrollLeft-left)>2) el.scrollLeft=left; }, 400);
}
function pagerUpdateNav(id){
  const st=_pagerState[id]; if(!st) return;
  const dots=document.getElementById(id+'_dots');
  if(dots) [...dots.children].forEach((el,i)=>el.classList.toggle('on', i===st.activeIdx));
  const el=document.getElementById(id+'_el'), er=document.getElementById(id+'_er');
  if(el) el.classList.toggle('show', st.activeIdx>0);
  if(er) er.classList.toggle('show', st.activeIdx<st.total-1);
  const cap=document.getElementById(id+'_cap');
  if(cap && _pagerCap[id]) cap.textContent=_pagerCap[id](st.activeIdx, st.total);
  // 業績推移は表と対応づけているので、送ったら表側の印も動かす
  if(id==='trendchart') syncTrendRows(st.activeIdx);
}

function parseReminder(){
  const md=$('#rm_md').value; const sid=$('#rm_stock').value;
  const hidEl=$('#rm_hypo');
  if(!md.trim()){toast('mdを貼り付けてください');return;}
  const lines=md.split(/\r?\n/); let block=null; const r={id:'r'+Date.now(),stockId:sid,hypoIds:(hidEl&&hidEl.value?hidEl.value.split(',').filter(Boolean):[]),times:[],changes:[],log:[],paused:false,src:'外部AI',srcDate:fmtToday()}; let cur=null; let promptLines=[]; let inPrompt=false; let promptTarget=0; const chPrompts={};
  for(let raw of lines){ let line=raw.replace(/\*\*/g,'').trim(); if(!line)continue;
    let m;
    if(m=line.match(/^##\s*(.+)$/)){
      block=m[1].trim();
      const pm=block.match(/^変更後の実行プロンプト\s*(\d)?/);
      if(pm){ inPrompt=true; promptTarget=+(pm[1]||1); continue; }
      if(/実行プロンプト/.test(block)){ inPrompt=true; promptTarget=0; continue; }
      if(/頻度変更/.test(block)){cur={};r.changes.push(cur);}
      inPrompt=false; continue;
    }
    if(inPrompt){ if(promptTarget===0) promptLines.push(raw.trim()); else { chPrompts[promptTarget]=(chPrompts[promptTarget]||'')+(chPrompts[promptTarget]?'\n':'')+raw.trim(); } continue; }
    if(line.startsWith('-')){ let b=line.replace(/^-\s*/,''); let km=b.match(/^([^:：]+)[:：]\s*(.*)$/); if(!km)continue; let k=km[1].trim(),val=km[2].trim();
      if(/頻度変更/.test(block||'')&&cur){ if(/条件/.test(k))cur.cond=val; else if(/頻度/.test(k))cur.freq=val; else if(/時間/.test(k))cur.times=val; }
      else {
        if(/タイトル/.test(k))r.title=val;
        else if(/コメント/.test(k))r.comment=val;
        else if(/カテゴリ/.test(k))r.cat=val;
        else if(/開始日/.test(k)){ const dd=String(val).match(/\d{4}\/\d{1,2}\/\d{1,2}/); r.startDate=dd?dd[0]:null; }
        else if(/終了日/.test(k)){ const dd=String(val).match(/\d{4}\/\d{1,2}\/\d{1,2}/); r.endDate=dd?dd[0]:null; }
        else if(/頻度/.test(k))r.freq=val;
        else if(/時間/.test(k))r.times=val.split(',').map(x=>x.trim());
      }
    }
  }
  r.prompt=promptLines.join('\n').trim();
  // 変更後の実行プロンプトを頻度変更に紐付け
  Object.keys(chPrompts).forEach(k=>{ const i=+k-1; const txt=String(chPrompts[k]||'').trim();
    if(r.changes[i] && txt && !/^同じ$/.test(txt)) r.changes[i].prompt=txt; });
  // validate freq changes date
  let bad=r.changes.find(c=>c.cond&&!/\d{4}\/\d{1,2}\/\d{1,2}/.test(c.cond));
  if(!r.title){toast('タイトルが解析できません');return;}
  { const d=calcNextFire(r); r.nextFire = d ? fmtFire(d) : null; }
  DB.reminders.push(r); clearHints(r.hypoIds); save();
  toast(bad?'登録しました(日付なし頻度変更は要確認)':'登録しました');
  afterReminderSaved(r.hypoIds, sid);
}

}
// ===== 指標マスターの管理(#A-2相当) =====
// 右端のバッジが、その指標を今どう扱っているかの状態表示を兼ねる。
// 「表示」「非表示」だと押した結果なのか今の状態なのか読めないので「表示中/非表示中」と書く
// 指標は取り込みで自動的に増えるので、手で足すボタンは置かない。
// 増やし方が分からなくなる人のために、見出しの脇に「?」だけ残して説明を出す
function metHelpLbl(text, key, extraStyle){
  return `<div class="lbl" style="display:flex;align-items:center;justify-content:space-between;${extraStyle||''}">
      <span>${text}</span>
      <button class="helpq" onclick="toggleMetHelp('${key}')" aria-label="指標の増やし方">?</button>
    </div>`
    + (STATE._metHelp===key ? '<div class="banner">指標を追加したい場合は、外部AIに頼んで取り込めば自動で追加されます。</div>' : '');
}
function toggleMetHelp(key){
  STATE._metHelp = (STATE._metHelp===key) ? null : key;
  (key==='mkt' ? sheetMarketMetricsMaster : sheetMetricsMaster)();
}
function statBadge(on, action){
  return `<button class="stat${on?' on':''}" onclick="${action}">${on?'表示中':'非表示中'}</button>`;
}
// ===== 指標の整理(まとめる・削除) =====
// 表記揺れで増えた指標は、あとから畳めないと持ち続けることになる。
// 一覧の指標名をタップすると、その指標をどうするかを選ぶ画面を開く。
// src … 'stock'(銘柄用マスター) / 'mkt'(いま開いている粒度の市場マスター)
function masterBySrc(src){ return src==='mkt' ? curScopeMet() : DB.metricsMaster; }
function backToMaster(src){ (src==='mkt'?sheetMarketMetricsMaster:sheetMetricsMaster)(); }
// そのマスターを使っているカード。銘柄用は非市場カード、粒度別マスターは同じ粒度の市場カード
function stocksForMaster(mm){ return DB.stocks.filter(s=>metricsMasterFor(s)===mm); }
function metDataCount(type, name, mm){
  return type==='trend'
    ? DB.stocks.filter(s=>!isMkt(s)&&s.trend&&s.trend[name]).length
    : stocksForMaster(mm).filter(s=>s.metrics&&s.metrics[name]).length;
}
function metNameBtn(type, name, src){
  return `<button class="nm" onclick="sheetMetricEdit('${type}','${escArg(name)}','${src}')">${esc(name)}`
    + `<svg class="dots" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>`;
}
function sheetMetricEdit(type, name, src){
  const mm=masterBySrc(src);
  const others = type==='trend' ? mm.trend.map(t=>t.name).filter(n=>n!==name) : mm.snap.filter(n=>n!==name);
  const n=metDataCount(type,name,mm);
  const where = type==='trend' ? '業績推移' : (src==='mkt' ? esc(curScopeName())+'の指標' : 'スナップショット指標');
  let h=`<h3>${esc(name)}</h3>
    <div class="muted" style="margin-bottom:12px">${where}の指標です。${n?`いま ${n}件のカードにデータがあります。`:'まだどのカードにもデータがありません。'}</div>`;
  if(others.length){
    // 表記揺れを畳むのが主な用途なので、似た名前を選択肢の先頭に置いて探す手間を減らす
    const near=nearestMetric(name, others);
    const list = near ? [near.name].concat(others.filter(k=>k!==near.name)) : others;
    h+=`<div class="lbl" style="margin-top:0">ほかの指標にまとめる</div>`;
    if(near) h+=`<div class="banner">「${esc(near.name)}」と名前が似ています。同じものであれば、まとめてください。</div>`;
    h+=`<div class="muted" style="margin-bottom:8px">${type==='trend'
        ? '年度ごとに合体します。同じ年度が両方にある場合は、まとめ先の値を残します。'
        : '値は1つしか持てないので、取り込み日が新しいほうを残します。'}まとめたあと「${esc(name)}」は一覧から消えます。</div>
      <label class="fld"><select id="metMergeTo">${list.map(k=>`<option value="${esc(k)}">${esc(k)}</option>`).join('')}</select></label>
      <button class="btn" onclick="askMergeMetric('${type}','${escArg(name)}','${src}')">まとめる</button>`;
  }
  h+=`<div class="lbl">この指標を削除</div>
    <div class="muted" style="margin-bottom:8px">${n?`${n}件のカードの「${esc(name)}」のデータも一緒に消えます。`:'消えて困るデータはありません。'}元に戻せません。</div>
    <button class="btn danger" onclick="askDeleteMetric('${type}','${escArg(name)}','${src}')">削除する</button>
    <button class="btn ghost" style="margin-top:14px" onclick="backToMaster('${src}')">← 一覧に戻る</button>`;
  openSheet(h);
}
function askMergeMetric(type, from, src){
  const sel=document.getElementById('metMergeTo'); const to=sel?sel.value:'';
  if(!to){ toast('まとめ先を選んでください'); return; }
  askConfirm({title:'指標をまとめる',
    body:`「${from}」を「${to}」にまとめます。\n\n${type==='trend'
      ? '年度ごとに合体し、同じ年度が両方にある場合は「'+to+'」の値を残します。'
      : '取り込み日が新しいほうの値を残します。'}\n「${from}」は一覧から消えます。`,
    okLabel:'まとめる', onOk:()=>doMergeMetric(type,from,to,src)});
}
function doMergeMetric(type, from, to, src){
  const mm=masterBySrc(src);
  let moved=0, kept=0;
  if(type==='trend'){
    DB.stocks.filter(s=>!isMkt(s)).forEach(s=>{
      const f=s.trend&&s.trend[from]; if(!f) return;
      const t=s.trend[to]||(s.trend[to]={unit:f.unit||''});
      if(!t.unit&&f.unit) t.unit=f.unit;
      Object.keys(f).forEach(y=>{
        if(y==='unit') return;
        // 取り込み済みの値は上書きしない。同じ年度が両方にあるならまとめ先を残す
        if(t[y]===undefined){ t[y]=f[y]; moved++; } else kept++;
      });
      delete s.trend[from];
    });
    DB.metricsMaster.trend=DB.metricsMaster.trend.filter(t=>t.name!==from);
    DB.metricsMaster.hiddenTrend=(DB.metricsMaster.hiddenTrend||[]).filter(k=>k!==from);
  } else {
    stocksForMaster(mm).forEach(s=>{
      const f=s.metrics&&s.metrics[from]; if(!f) return;
      const t=s.metrics[to], fd=parseD(f.d), td=t?parseD(t.d):null;
      // 値は1つしか持てないので、より新しく取り込んだほうを残す
      if(!t || (fd && (!td || fd>td))){ s.metrics[to]=f; moved++; } else kept++;
      delete s.metrics[from];
    });
    mm.snap=mm.snap.filter(k=>k!==from);
    mm.hiddenSnap=(mm.hiddenSnap||[]).filter(k=>k!==from);
  }
  save(); render(); backToMaster(src);
  toast(kept?`「${to}」にまとめました(${moved}件を移し、${kept}件は既存を残しました)`:`「${to}」にまとめました(${moved}件)`);
}
function askDeleteMetric(type, name, src){
  const n=metDataCount(type,name,masterBySrc(src));
  askConfirm({title:'指標を削除する', danger:true,
    body:`「${name}」を一覧から削除します。\n\n${n?`${n}件のカードに入っている「${name}」のデータも一緒に消えます。`:'この指標のデータを持つカードはありません。'}\n元に戻せません。`,
    okLabel:'削除する', onOk:()=>doDeleteMetric(type,name,src)});
}
function doDeleteMetric(type, name, src){
  const mm=masterBySrc(src);
  if(type==='trend'){
    DB.stocks.filter(s=>!isMkt(s)).forEach(s=>{ if(s.trend) delete s.trend[name]; });
    DB.metricsMaster.trend=DB.metricsMaster.trend.filter(t=>t.name!==name);
    DB.metricsMaster.hiddenTrend=(DB.metricsMaster.hiddenTrend||[]).filter(k=>k!==name);
  } else {
    stocksForMaster(mm).forEach(s=>{ if(s.metrics) delete s.metrics[name]; });
    mm.snap=mm.snap.filter(k=>k!==name);
    mm.hiddenSnap=(mm.hiddenSnap||[]).filter(k=>k!==name);
  }
  save(); render(); backToMaster(src);
  toast(`「${name}」を削除しました`);
}
function sheetMetricsMaster(){
  const mm=DB.metricsMaster;
  const graphOn=trendInds(mm).filter(x=>x.graph).length;
  const snapOn=snapKeys(mm).length, trendOn=trendInds(mm).length;
  let h=`<h3>収容指標・業績分析項目の設定</h3>
    <div class="muted" style="margin-bottom:12px">全銘柄に共通の設定です。ここで選んだ指標が質問文作成(「聞くことが思いつかない時は」)と、銘柄詳細の表示に使われます。右端のバッジを押すと表示・非表示を切り替えられます(非表示にしても指標はこの一覧に残り、取り込み済みのデータも保持されます)。指標名を押すと、ほかの指標にまとめたり削除したりできます。</div>`;
  // スナップショット指標
  h+=metHelpLbl(`スナップショット指標 (表示中 ${snapOn}/${mm.snap.length})`, 'snap', 'margin-top:0');
  mm.snap.forEach((k,i)=>{
    const on=metOn(mm,'snap',k);
    h+=`<div class="met-row${on?'':' off'}">
      ${metNameBtn('snap',k,'stock')}
      <button class="btn sm" style="width:auto;padding:3px 7px;font-size:11px" onclick="moveMetric('snap',${i},-1)" ${i===0?'disabled style="opacity:.3;width:auto;padding:3px 7px;font-size:11px"':''}>↑</button>
      <button class="btn sm" style="width:auto;padding:3px 7px;font-size:11px" onclick="moveMetric('snap',${i},1)" ${i===mm.snap.length-1?'disabled style="opacity:.3;width:auto;padding:3px 7px;font-size:11px"':''}>↓</button>
      ${statBadge(on, `toggleMetric('snap','${escArg(k)}')`)}
    </div>`; });
  // 業績推移指標
  h+=metHelpLbl(`業績推移の指標 (表示中 ${trendOn}/${mm.trend.length}) · グラフ表示 (${graphOn}/${GRAPH_MAX})`, 'trend');
  // グラフに出せなかったときの理由は、押した場所のすぐ上に出す。
  // 1回だけ出す一時的な文言なので、読み出したらすぐ消す
  const gm=STATE._graphMsg; STATE._graphMsg=null;
  if(gm) h+=`<div class="banner warn">${esc(gm.why==='limit'
      ? `グラフの上限は${GRAPH_MAX}件までです。どれかの指標を非表示に変更してください。`
      : `「${gm.name}」は非表示中なのでグラフに出せません。右のバッジで「表示中」にしてから選んでください。`)}</div>`;
  else if(graphOn>GRAPH_MAX) h+=`<div class="banner warn">グラフが上限の${GRAPH_MAX}件を超えています(${graphOn}件)。銘柄詳細ではこの${graphOn}件ぶんのグラフが並びます。どれかの指標を非表示に変更してください。</div>`;
  else if(graphOn===GRAPH_MAX) h+=`<div class="banner">グラフの上限は${GRAPH_MAX}件までです。ほかの指標をグラフに出すには、どれかの指標を非表示に変更してください。</div>`;
  mm.trend.forEach((o,i)=>{
    const on=metOn(mm,'trend',o.name);
    // 非表示中はそもそも画面に出ないので、グラフの指定も効かない。押せないことが分かるよう薄くする
    h+=`<div class="met-row${on?'':' off'}">
      <button class="btn sm" style="width:auto;padding:3px 10px;font-size:11px;${on?'':'opacity:.35;'}${on&&o.graph?'background:var(--navy);color:#fff;border-color:var(--navy)':''}" onclick="toggleGraph(${i})">グラフ</button>
      ${metNameBtn('trend',o.name,'stock')}
      <button class="btn sm" style="width:auto;padding:3px 7px;font-size:11px" onclick="moveMetric('trend',${i},-1)" ${i===0?'disabled':''}>↑</button>
      <button class="btn sm" style="width:auto;padding:3px 7px;font-size:11px" onclick="moveMetric('trend',${i},1)" ${i===mm.trend.length-1?'disabled':''}>↓</button>
      ${statBadge(on, `toggleMetric('trend','${escArg(o.name)}')`)}
    </div>`; });
  h+=`<button class="btn sm" style="margin-top:18px" onclick="resetMetricOrder()">並び順を既定に戻す</button>`;
  // 「非表示の指標」を別リストに分けるのはやめた。分けると、元がスナップショットだったのか
  // 業績推移だったのかも、どこに並んでいたのかも分からなくなるため
  h+=`<button class="btn ghost" style="margin-top:14px" onclick="closeSheet()">← 閉じる</button>`;
  openSheet(h);
}
// 市場・テーマ用の指標設定。銘柄用と違い業績推移(trend)は無く、スナップショットだけを持つ
// 粒度(市場/業界/テーマ)ごとに別々のマスターを編集する。開いているカードの粒度が対象
function curScopeMet(){ const s=STATE.stockId?stock(STATE.stockId):null; return DB[(s&&isMkt(s)?scopeKeys(s):SCOPE_KEYS['市場']).met]; }
function curScopeName(){ const s=STATE.stockId?stock(STATE.stockId):null; return (s&&isMkt(s)?scopeOf(s):'市場'); }
function sheetMarketMetricsMaster(){
  const mm=curScopeMet(); const sc=curScopeName();
  let h=`<h3>${esc(sc)}の指標の設定</h3>
    <div class="muted" style="margin-bottom:12px">「${esc(sc)}」のカードすべてに共通の設定です。当日の値動きではなく、数か月単位で見直す水準を想定しています。右端のバッジを押すと表示・非表示を切り替えられます(非表示にしても指標はこの一覧に残り、取り込み済みのデータも保持されます)。指標名を押すと、ほかの指標にまとめたり削除したりできます。</div>`;
  h+=metHelpLbl(`指標 (表示中 ${snapKeys(mm).length}/${mm.snap.length})`, 'mkt', 'margin-top:0');
  if(!mm.snap.length) h+='<div class="muted" style="padding:0 2px 6px">まだありません。会話を取り込むと自動で増えます。</div>';
  mm.snap.forEach((k,i)=>{
    const on=metOn(mm,'snap',k);
    h+=`<div class="met-row${on?'':' off'}">
      ${metNameBtn('snap',k,'mkt')}
      <button class="btn sm" style="width:auto;padding:3px 7px;font-size:11px" onclick="moveMarketMetric(${i},-1)" ${i===0?'disabled':''}>↑</button>
      <button class="btn sm" style="width:auto;padding:3px 7px;font-size:11px" onclick="moveMarketMetric(${i},1)" ${i===mm.snap.length-1?'disabled':''}>↓</button>
      ${statBadge(on, `toggleMarketMetric('${escArg(k)}')`)}
    </div>`; });
  h+=`<button class="btn sm" style="margin-top:18px" onclick="resetMarketMetricOrder()">並び順を既定に戻す</button>`;
  h+=`<button class="btn ghost" style="margin-top:14px" onclick="closeSheet()">← 閉じる</button>`;
  openSheet(h);
}
function moveMarketMetric(i,dir){
  const arr=curScopeMet().snap; const j=i+dir;
  if(j<0||j>=arr.length) return;
  const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  save(); render(); sheetMarketMetricsMaster();
}
// 一覧からは動かさず、表示中/非表示中を入れ替えるだけ
function toggleMarketMetric(name){
  const mm=curScopeMet();
  mm.hiddenSnap=mm.hiddenSnap||[];
  const on=metOn(mm,'snap',name);
  if(on) mm.hiddenSnap.push(name);
  else mm.hiddenSnap=mm.hiddenSnap.filter(x=>x!==name);
  save(); render(); sheetMarketMetricsMaster();
  toast(on?'非表示にしました(データは保持されます)':'表示中にしました');
}
function moveMetric(type,i,dir){
  const arr=DB.metricsMaster[type]; const j=i+dir;
  if(j<0||j>=arr.length) return;
  const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  save(); render(); sheetMetricsMaster();
}
// 断られた理由は、数秒で消えるトーストではなく設定画面の中に残す
function toggleGraph(i){
  const mm=DB.metricsMaster;
  const o=mm.trend[i];
  // 非表示中の指標はそもそも画面に出ないので、グラフの指定だけしても意味がない
  if(!metOn(mm,'trend',o.name)){ STATE._graphMsg={name:o.name, why:'hidden'}; sheetMetricsMaster(); return; }
  if(!o.graph && trendInds(mm).filter(x=>x.graph).length>=GRAPH_MAX){ STATE._graphMsg={name:o.name, why:'limit'}; sheetMetricsMaster(); return; }
  o.graph=!o.graph; save(); render(); sheetMetricsMaster();
}
// 旧バージョンでは、非表示から戻した指標が一覧の末尾へ飛んでいた(今は元の位置に戻る)。
// 末尾に飛ぶと、6件ごとの指標グリッドで2ページ目に押し出され、1ページ目が
// 「データなし」だけになって数字が見つけられなくなる。
// すでに並びが崩れているデータのために、既定の並びへ組み直す入口を残す
function orderByDefault(names, def){
  return def.filter(k=>names.includes(k)).concat(names.filter(k=>!def.includes(k)));
}
function resetMetricOrder(){
  askConfirm({title:'並び順を既定に戻す', body:'主要指標と業績推移の並び順を、既定の順序に組み直します。\n\n自分で追加した指標は、いまの順番のまま後ろに続きます。表示中/非表示中の設定と、取り込み済みの数値は変わりません。', okLabel:'並び替える', onOk:()=>{
    const mm=DB.metricsMaster, s0=seed();
    mm.snap=orderByDefault(mm.snap, s0.metricsMaster.snap);
    mm.trend=orderByDefault(mm.trend.map(t=>t.name), s0.metricsMaster.trend.map(t=>t.name)).map(n=>mm.trend.find(t=>t.name===n));
    save(); render(); sheetMetricsMaster(); toast('並び順を戻しました');
  }});
}
function resetMarketMetricOrder(){
  askConfirm({title:'並び順を既定に戻す', body:'指標の並び順を、既定の順序に組み直します。\n\n自分で追加した指標は、いまの順番のまま後ろに続きます。表示中/非表示中の設定と、取り込み済みの数値は変わりません。', okLabel:'並び替える', onOk:()=>{
    const mm=curScopeMet(), def=seed()[(SCOPE_KEYS[curScopeName()]||SCOPE_KEYS['市場']).met].snap;
    mm.snap=orderByDefault(mm.snap, def);
    save(); render(); sheetMarketMetricsMaster(); toast('並び順を戻しました');
  }});
}
// 一覧からは動かさず、表示中/非表示中を入れ替えるだけ。
// 別リストへ移すと、元がどちらの指標だったのかも並び順も分からなくなるため
function toggleMetric(type,name){
  const mm=DB.metricsMaster;
  const key=(type==='trend')?'hiddenTrend':'hiddenSnap';
  mm[key]=mm[key]||[];
  const on=metOn(mm,type,name);
  if(on) mm[key].push(name);
  else {
    mm[key]=mm[key].filter(x=>x!==name);
    // 表示中に戻したときグラフが5件目になってしまう場合は、表だけの扱いにする
    const o=(type==='trend')?mm.trend.find(x=>x.name===name):null;
    if(o&&o.graph&&trendInds(mm).filter(x=>x.graph).length>GRAPH_MAX){ o.graph=false; save(); render(); sheetMetricsMaster(); toast(`表示中にしました(グラフは${GRAPH_MAX}件までのため表のみ)`); return; }
  }
  save(); render(); sheetMetricsMaster();
  toast(on?'非表示にしました(データは保持されます)':'表示中にしました');
}
function sheetBackup(){
  openSheet(`<h3>バックアップ</h3>
    <div class="muted" style="margin-bottom:12px">端末内のデータを書き出し・読み込みします。機種変更やデータ消失に備えて、ときどき書き出しておくと安心です。</div>
    <button class="btn pri" onclick="exportData()">データを書き出す(バックアップ)</button>
    <label class="btn" style="margin-top:10px;cursor:pointer">データを読み込む(復元)
      <input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)">
    </label>
    <button class="btn danger" style="margin-top:16px" onclick="resetDB()">全データを初期化</button>
    <div class="hint" style="margin-top:10px">書き出したファイルはダウンロードフォルダに保存されます。復元すると現在のデータは上書きされます。</div>`);
}

render();
</script>
</body>
