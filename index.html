<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仮説トラッカー プロトタイプ</title>
<style>
  :root{
    --bg:#eef0f2; --app:#f7f8f9; --card:#ffffff; --line:#e2e5e8; --line2:#cbd0d5;
    --ink:#1e2933; --ink2:#5a6672; --ink3:#8b95a1;
    --navy:#123a5e; --navy-bg:#e8eff5; --navy-tx:#123a5e;
    --amber-bg:#fbf0da; --amber-tx:#8a5a12;
    --green-bg:#e5f1df; --green-tx:#356124;
    --red-bg:#fbe6e4; --red-tx:#9c3329;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    /* 余白は 4 / 8 / 12 / 16 の4段階に揃える。中途半端な値を足すとカードごとに詰まり方が変わる */
    --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px;
  }
  /* 文字サイズは次の6段階だけを使う。増やさないこと。
       11px … 日付・単位・補足(最小)
       12px … 補助テキスト
       13px … 本文
       15px … 強調・小見出し
       17px … 画面タイトル・指標の数値
       16px … 入力欄専用(iOSは16px未満の入力にフォーカスすると自動でズームするため下げない)
     通勤中にスマホで読む前提なので、10px以下は使わない。 */
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif; color:var(--ink); line-height:1.6;}
  .phone{max-width:430px; margin:0 auto; min-height:100vh; background:var(--app); position:relative; display:flex; flex-direction:column;}
  /* header */
  .top{position:sticky; top:0; z-index:20; background:var(--app); border-bottom:1px solid var(--line); padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between;}
  .top h1{font-size:17px; font-weight:700; margin:0; letter-spacing:.01em;}
  .top .sub{font-size:11px; color:var(--ink3); font-weight:400;}
  .top .act{font-size:13px; color:var(--navy); font-weight:600; cursor:pointer; border:none; background:none; display:inline-flex; align-items:center; min-height:44px; padding:0 2px;}
  /* scroll body */
  .body{flex:1; overflow-y:auto; padding:14px 16px 90px;}
  /* bottom tab */
  .tabbar{position:sticky; bottom:0; z-index:20; background:var(--card); border-top:1px solid var(--line); display:flex; padding:6px 4px 8px;}
  .tabbar button{flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center; gap:4px; padding:4px; cursor:pointer; color:var(--ink3); font-size:11px; font-weight:600;}
  .tabbar button.on{color:var(--navy);}
  .tabbar .ic{width:22px; height:22px; display:block;}
  /* components */
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-bottom:11px;}
  .card.tap{cursor:pointer;} .card.tap:active{background:#fafbfc;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .chip{display:inline-block; font-size:11px; font-weight:600; padding:2px 9px; border-radius:9px; white-space:nowrap;}
  .chip.navy{background:var(--navy-bg); color:var(--navy-tx);}
  .chip.amber{background:var(--amber-bg); color:var(--amber-tx);}
  .chip.green{background:var(--green-bg); color:var(--green-tx);}
  .chip.red{background:var(--red-bg); color:var(--red-tx);}
  .chip.gray{background:var(--bg); color:var(--ink2); border:1px solid var(--line);}
  .chip.tap{display:inline-flex; align-items:center; min-height:36px; padding:2px 12px; cursor:pointer;}
  .muted{color:var(--ink3); font-size:12px;}
  /* 画面の区切り。以前は11pxのグレーで本文より弱く、どこからどこまでが一塊か読み取れなかった */
  .lbl{font-size:12px; color:var(--ink2); font-weight:700; letter-spacing:.02em; margin:20px 0 8px;}
  .lbl:first-child{margin-top:2px;}
  h2.blk{font-size:13px; font-weight:700; margin:0 0 3px;}
  /* 「対応が必要」など、いま見てほしいものだけ地色を変える。
     全部が同じ白カードだと重要度の差が出ず、目がどこにも止まらない */
  .card.attn{background:var(--navy-bg); border-color:#cfdde8;}
  /* 一覧は「カードを積む」のではなく「1枚の枠に行を並べる」。
     カード1件ごとに影と余白が付くと、件数が増えたときに全部が同じ強さで主張してしまう */
  .list{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:var(--sp3);}
  .list-row{display:flex; align-items:center; justify-content:space-between; gap:var(--sp3); padding:11px 14px; min-height:44px; cursor:pointer; border-top:1px solid var(--line);}
  .list-row:first-child{border-top:none;}
  .list-row:active{background:var(--navy-bg);}
  .list-row .lt{min-width:0; flex:1;}
  .list-row .ttl{font-size:13px; font-weight:600; line-height:1.4;}
  .list-row .meta{font-size:11px; color:var(--ink3); margin-top:1px;}
  .list-row .rt{display:flex; align-items:center; gap:var(--sp2); font-size:12px; color:var(--ink2); white-space:nowrap; flex:none;}
  .list-row .arrow{color:var(--ink3); font-size:15px;}
  /* タップ領域は44px以上を下限にする(iOS/Androidの推奨値)。
     以前は33pxのボタンが並び、親指では隣を押しやすい状態だった。
     例外は文章に紛れるチップ・リンクで、そこは36px以上とする */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line2); background:var(--card); color:var(--ink); border-radius:9px; padding:10px 14px; min-height:44px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; width:100%;}
  .btn:active{background:#f0f2f4;}
  .btn.pri{background:var(--navy); border-color:var(--navy); color:#fff;}
  .btn.sm{padding:7px 11px; font-size:12px; width:auto;}
  .btn.ghost{border-color:transparent; color:var(--ink3);}
  .btn.danger{color:var(--red-tx); border-color:var(--red-bg);}
  input,textarea,select{width:100%; max-width:100%; min-width:0; box-sizing:border-box; border:1px solid var(--line2); border-radius:9px; padding:10px 12px; font-size:16px; font-family:inherit; color:var(--ink); background:var(--card); margin-top:4px;}
  /* 日付・時刻の入力(特にtime)はブラウザ標準UIの内部幅が広く、通常のpaddingだと外枠をはみ出すことがあるため詰める */
  input[type="date"],input[type="time"]{padding:10px 6px;}
  /* 入力欄を16pxに上げた分、60pxだとplaceholderの末尾が切れるので余裕を持たせる */
  textarea{resize:vertical; min-height:84px;}
  textarea.mono{font-family:var(--mono); font-size:12px; line-height:1.6;}
  label.fld{display:block; margin-bottom:11px;}
  label.fld .t{font-size:12px; color:var(--ink2); font-weight:600;}
  .seg{display:flex; border:1px solid var(--line2); border-radius:9px; overflow:hidden; margin-top:4px;}
  .seg button{flex:1; border:none; background:var(--card); padding:8px; min-height:44px; font-size:13px; color:var(--ink2); cursor:pointer; font-family:inherit; font-weight:600;}
  .seg button.on{background:var(--navy); color:#fff;}
  table{width:100%; border-collapse:collapse; font-size:12px; margin-top:4px;}
  th{text-align:left; font-size:11px; color:var(--ink3); font-weight:600; padding:4px 6px; border-bottom:1px solid var(--line);}
  td{padding:6px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.5;}
  .val-up{color:var(--green-tx); font-weight:700;}
  .val-dn{color:var(--red-tx); font-weight:700;}
  .val-old{color:var(--ink3); text-decoration:line-through;}
  tr.newrow td{background:var(--green-bg);}
  /* 3列だと1セル約95pxしかなく、指標名がほぼ必ず2〜3行に折り返して読めなかったので2列にする */
  .metric{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp2);}
  .metric .m{background:var(--app); border:1px solid var(--line); border-radius:9px; padding:8px 10px;}
  .metric .m .k{font-size:11px; color:var(--ink3);}
  .metric .m .v{font-size:17px; font-weight:700; margin-top:1px;}
  .metric .m .d{font-size:11px; color:var(--ink3); margin-top:1px;}
  .metric .m.stale{background:var(--amber-bg); border-color:var(--amber-bg);}
  .metric .m.stale .k,.metric .m.stale .v,.metric .m.stale .d{color:var(--amber-tx);}
  .sec{border:1px solid var(--line); border-radius:9px; margin-bottom:7px; overflow:hidden;}
  .sec .h{display:flex; justify-content:space-between; align-items:center; padding:9px 11px; min-height:44px; cursor:pointer; font-size:13px; font-weight:600; background:var(--card);}
  .sec .h .m{font-size:11px; color:var(--ink3); font-weight:400;}
  .sec .b{display:none; padding:0 11px 10px; font-size:13px; color:var(--ink2);}
  .sec.open .b{display:block;}
  .mine{border-left:3px solid var(--navy); background:var(--navy-bg); border-radius:0 8px 8px 0; padding:9px 11px; margin-top:4px;}
  .mine .row2{font-size:12px; color:var(--navy-tx);} .mine .ts{font-size:11px; color:var(--navy); opacity:.7;}
  .empty{text-align:center; padding:40px 20px; color:var(--ink3);}
  .empty .big{font-size:15px; font-weight:600; color:var(--ink2); margin-bottom:6px;}
  /* 分析項目の行(タップで概要/詳細スワイプシートを開く) */
  .sub-row{display:flex; align-items:center; justify-content:space-between; gap:var(--sp2); padding:9px 11px; min-height:44px; font-size:12px; border-top:1px solid var(--line); cursor:pointer; background:var(--card);}
  .sub-row:active{background:var(--navy-bg);}
  .sub-row .row-right{display:flex; align-items:center; gap:8px;}
  .sub-row .arrow{color:var(--ink3); font-size:15px;}
  /* 概要/詳細の横スワイプページャー */
  .pager-top{padding:2px 20px 10px; border-bottom:1px solid var(--line); margin-bottom:2px;}
  .pager-top .ti{font-size:15px; font-weight:700;}
  .pager-top .cat{font-size:11px; color:var(--ink3); margin-top:1px;}
  .pages-wrap{position:relative;}
  .pages{display:flex; overflow-x:auto; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .pages::-webkit-scrollbar{display:none;}
  .page{flex:0 0 100%; scroll-snap-align:start; padding:14px 20px; min-height:140px;}
  .page.tight{padding:2px 0 4px; min-height:0;}
  .page .kicker{font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--navy-tx); background:var(--navy-bg); display:inline-block; padding:3px 9px; border-radius:8px; margin-bottom:10px;}
  .page .kicker.detail{color:var(--ink2); background:var(--bg); border:1px solid var(--line);}
  .page .txt{font-size:13px; line-height:1.75; white-space:pre-wrap;}
  .page .meta{margin-top:12px; font-size:11px; color:var(--ink3); display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .edge-hint{position:absolute; top:0; bottom:0; width:26px; display:flex; align-items:center; font-size:17px; color:var(--navy-tx); pointer-events:none; opacity:0; transition:opacity .2s;}
  .edge-hint.show{opacity:1;}
  .edge-hint.left{left:0; justify-content:flex-start; background:linear-gradient(to right, var(--app) 25%, transparent 100%);}
  .edge-hint.right{right:0; justify-content:flex-end; background:linear-gradient(to left, var(--app) 25%, transparent 100%);}
  /* 「指標 1/2」は単独行にすると28px使うだけなので、送りボタンの行に重ねる */
  .swipecap{position:absolute; left:0; top:50%; transform:translateY(-50%); font-size:11px; color:var(--ink3);}
  .pager-nav{position:relative; display:flex; align-items:center; justify-content:center; gap:var(--sp3); padding:6px 0 4px;}
  .navbtn{border:none; background:var(--navy); color:#fff; width:44px; height:44px; border-radius:50%; font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none;}
  .navbtn:active{transform:scale(.94);}
  .navbtn:disabled{opacity:.25; cursor:default;}
  .dots{display:flex; align-items:center; gap:8px;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--line2); transition:background .15s, transform .15s;}
  .dot.on{background:var(--navy); transform:scale(1.4);}
  @media (prefers-reduced-motion: reduce){ .dot{transition:none;} }
  /* modal */
  .scrim{position:fixed; inset:0; background:rgba(20,30,40,.4); z-index:40; display:none; align-items:flex-end; justify-content:center;}
  .scrim.show{display:flex;}
  .sheet{position:relative; background:var(--app); width:100%; max-width:430px; border-radius:18px 18px 0 0; padding:16px 16px 26px; max-height:88vh; overflow-y:auto;}
  /* 画面端スワイプで閉じるための帯。ここだけtouch-action:pan-yにして、
     ブラウザ自身の「画面端スワイプで戻る」機能に横方向の操作を渡さないようにする。
     判定が狭すぎるとの指摘を受け、左端30%まで広げている */
  .edge-swipe-zone{position:fixed; top:0; bottom:0; left:0; width:30%; z-index:41; touch-action:pan-y; pointer-events:none;}
  .edge-swipe-zone.show{pointer-events:auto;}
  .sheet h3{font-size:15px; font-weight:700; margin:2px 0 12px; text-align:center;}
  /* 背景タップで閉じられるが、それに気づかず「戻れない」と感じる人のための明示的な閉じるボタン */
  .sheet-close{position:absolute; top:4px; right:4px; width:44px; height:44px; border-radius:50%; border:none; background:none; color:var(--ink3); font-size:17px; line-height:1; cursor:pointer; z-index:1;}
  .sheet-close:active{background:var(--line);}
  /* シート内で未保存の変更を破棄してよいか確認するミニダイアログ。#sheetの中身は書き換えずシートの上に重ねる */
  .exit-confirm{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; background:rgba(20,30,40,.25);}
  .exit-confirm.show{display:flex;}
  .exit-confirm-card{background:var(--app); border-radius:14px; padding:18px; width:82%; max-width:320px; box-shadow:0 8px 30px rgba(0,0,0,.3);}
  .exit-confirm-msg{font-size:13px; line-height:1.6; margin-bottom:14px;}
  .exit-confirm-row{display:flex; flex-direction:column; gap:8px;}
  .toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:12px; padding:9px 16px; border-radius:20px; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%; text-align:center;}
  .toast.show{opacity:1;}
  .hint{font-size:11px; color:var(--ink3); margin-top:4px; line-height:1.5;}
  .failbox{background:var(--amber-bg); border-radius:9px; padding:9px 11px; margin-top:8px;}
  .failbox .t{font-size:12px; color:var(--amber-tx); font-weight:700;}
  .failbox .l{font-family:var(--mono); font-size:11px; color:var(--amber-tx); margin-top:3px; word-break:break-all;}
  .pill-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
  .banner{background:var(--navy-bg); border-radius:9px; padding:10px 12px; font-size:12px; color:var(--navy-tx); margin-bottom:11px; line-height:1.5;}
  .del{color:var(--red-tx); font-size:12px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; min-width:44px; min-height:44px;}
  .clip2{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.5;}
  .clip3{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; line-height:1.45;}
  .clip3.open{-webkit-line-clamp:unset; overflow:visible;}
  .dbody.open2{display:block !important;}
  .d-del{text-decoration:line-through; color:var(--ink3);}
  .d-add{color:#1257a8; font-weight:600;}
  .difflegend{font-size:11px; color:var(--ink3); margin:2px 0 6px;}
  .difflegend span{margin-right:9px;}
  .swipe{position:relative; overflow:hidden;}
  .swipe .del-btn{position:absolute; right:0; top:0; bottom:0; width:64px; background:var(--red-tx); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; border:none;}
</style>
</head>
<body>
<div class="phone">
  <div class="top">
    <div><h1 id="topTitle">ホーム</h1><div class="sub" id="topSub"></div></div>
    <div style="display:flex;align-items:center;gap:12px">
      <button class="act" id="topAct" style="display:none"></button>
      <button class="act" id="topMenu" style="display:none;font-size:17px;line-height:1">☰</button>
    </div>
  </div>
  <div class="body" id="view"></div>
  <div class="tabbar">
    <button data-tab="home" class="on" onclick="go('home')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>ホーム</button>
    <button data-tab="analysis" onclick="go('analysis')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 16l3-4 3 2 4-6"/></svg>市場・銘柄分析</button>
    <button data-tab="import" onclick="go('import')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M8 11l4 4 4-4"/><path d="M4 21h16"/></svg>会話を取り込む</button>
    <button data-tab="reminder" onclick="go('reminder')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>リマインダー</button>
  </div>
</div>
<div class="scrim" id="scrim" onclick="if(event.target===this)requestCloseSheet()"><div class="sheet" id="sheet"></div></div>
<div class="edge-swipe-zone" id="edgeSwipeZone"></div>
<div class="exit-confirm" id="exitConfirm">
  <div class="exit-confirm-card">
    <div class="exit-confirm-msg">保存されていない変更があります。破棄しますか?</div>
    <div class="exit-confirm-row">
      <button class="btn danger" onclick="confirmCloseSheet()">破棄して閉じる</button>
      <button class="btn ghost" onclick="cancelCloseSheet()">編集を続ける</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
//////////////////// storage & seed ////////////////////
const KEY='hypo_tracker_proto_v1';
function load(){ try{return JSON.parse(localStorage.getItem(KEY))||null}catch(e){return null} }
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }
function seed(){
  return {
    metricsMaster:{
      snap:['PER(予想)','PBR','ROE','営業利益率','自己資本比率','配当利回り(予想)'],
      trend:[{name:'売上高',graph:true},{name:'営業利益',graph:true},{name:'EPS',graph:true}],
      hiddenSnap:[], hiddenTrend:[]
    },
    // 市場カードは粒度(scope)ごとに語彙が違うので、指標マスターを分けて持つ。
    // 例: 「日本株市場」に騰落レシオは効くが「データセンター業界」には無意味
    marketMetricsMaster:{   // scope:'市場' … 日本株市場、米国株市場など
      // 日次で動く株価指数・移動平均は入れない(証券アプリの役割)。
      // 数か月単位で水準を比べられるもの＝バリュエーション・金利・為替・過熱度に絞る
      snap:['予想PER(市場全体)','長期金利(10年)','為替(USD/JPY)'],
      hiddenSnap:[]
    },
    // scope:'業界'。生成AIは業種別の中央値を自力で算出できず捏造しやすいため、
    // 公表値が手に入るバリュエーションだけに絞る。ROE・営業利益率などの水準は
    // 数値ではなく分析セクションに文章で残す方針
    industryMetricsMaster:{
      snap:['PER','PBR'],
      hiddenSnap:[]
    },
    themeMetricsMaster:{    // scope:'テーマ' … AI、脱炭素など。数値化しにくいので既定は置かず取り込みで育てる
      snap:[],
      hiddenSnap:[]
    },
    sectionMaster:[
      {cat:'ビジネスモデル', on:true, subs:['収益モデル','顧客セグメント','提供価値','事業構造','収益の安定性']},
      {cat:'財務', on:true, subs:['実績財務(PL/BS/CF)','財務健全性・効率性']},
      {cat:'市場環境', on:true, subs:['市場規模(TAM/SAM/SOM)','市場成長率','産業構造','技術トレンド','マクロ要因']},

let DB = migrate(load()) || seed();
function migrate(db){
  if(!db) return null;
  const s0=seed();
  // 新フィールドの補完
  if(!db.sectionMaster) db.sectionMaster=s0.sectionMaster;
  if(!db.marketSectionMaster) db.marketSectionMaster=s0.marketSectionMaster;
  // 市場マスターの旧名称を平易な名称へ読み替え
  {
    const CATMAP={'バリュエーション':'割高・割安の水準','カタリスト・イベント':'注目イベント','銘柄への含意':'自分の銘柄への影響'};
    const SUBMAP={'市場全体の水準感':'市場全体の割高・割安','セクター別の水準感':'セクター別の割高・割安'};
    (db.marketSectionMaster||[]).forEach(c=>{
      if(CATMAP[c.cat]) c.cat=CATMAP[c.cat];
      c.subs=c.subs.map(su=>SUBMAP[su]||su);
    });
    (db.stocks||[]).forEach(st=>{
      if(st.kind!=='市場'||!st.sections) return;
      Object.keys(st.sections).forEach(k=>{
        if(SUBMAP[k]){ const nk=SUBMAP[k]; if(!st.sections[nk]) st.sections[nk]=st.sections[k]; delete st.sections[k]; }
      });
    });
  }
  if(!db.askPrefs) db.askPrefs={mode:'new', level:'標準', picks:{}, themes:{}};
  if(!db.askPrefs.themes) db.askPrefs.themes={};
  // 回数(count)→終了日(endDate)へ移行。回数は概念ごと廃止
  (db.reminders||[]).forEach(r=>{
    if(r.endDate===undefined) r.endDate=null;
    if('count' in r) delete r.count;
    (r.changes||[]).forEach(c=>{ if('count' in c) delete c.count; });
    // 紐付けを単一hypoIdから配列hypoIdsへ。
    // 同じイベント日(同じ決算など)の注目ポイントを1つのリマインダーでまとめて見るため
    if(!Array.isArray(r.hypoIds)) r.hypoIds = r.hypoId ? [r.hypoId] : [];
    if('hypoId' in r) delete r.hypoId;
  });
  if(!db.metricsMaster) db.metricsMaster=s0.metricsMaster;
  if(!db.metricsMaster.hiddenSnap) db.metricsMaster.hiddenSnap=[];
  if(!db.metricsMaster.hiddenTrend) db.metricsMaster.hiddenTrend=[];
  // 市場カードの粒度(市場/業界/テーマ)ごとのマスター(旧データには存在しない)
  ['marketMetricsMaster','industryMetricsMaster','themeMetricsMaster'].forEach(k=>{
    if(!db[k]) db[k]=s0[k];
    if(!db[k].snap) db[k].snap=[];
    if(!db[k].hiddenSnap) db[k].hiddenSnap=[];
  });
  // 既定指標を入れ替えた分は、ユーザーが編集していない(過去のいずれかの既定のままの)場合だけ差し替える。
  // 既定から外れた項目は「非表示」に送る。取り込み済みのデータが画面から消えたまま
  // 復元手段が無くなるのを避けるため(非表示一覧から復元できる)
  {
    const RESET=[
      {k:'metricsMaster', olds:[
        ['PER(予想)','PBR','時価総額','配当利回り(予想)','信用倍率','目標株価コンセンサス'],
      ]},
      {k:'marketMetricsMaster', olds:[
        ['予想PER(市場全体)','PBR(市場全体)','配当利回り(市場全体)','騰落レシオ(25日)','信用評価損益率','長期金利(10年)'],
        ['予想PER(市場全体)','PBR(市場全体)','長期金利(10年)','為替(USD/JPY)','騰落レシオ(25日)','VIX指数'],
      ]},
      {k:'industryMetricsMaster', olds:[
        ['市場規模','市場成長率(YoY)','設備投資額'],
        ['PER','PBR','EBITDA','ROE','営業利益率','自己資本比率'],
      ]},
    ];
    RESET.forEach(({k,olds})=>{
      const cur=db[k].snap||[];
      const same=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);
      if(!olds.some(o=>same(cur,o))) return;
      const next=s0[k].snap.slice();
      db[k].hiddenSnap=db[k].hiddenSnap||[];
      cur.forEach(x=>{ if(!next.includes(x)&&!db[k].hiddenSnap.includes(x)) db[k].hiddenSnap.push(x); });
      db[k].snap=next;
    });
  }
  if(!db.industrySectionMaster) db.industrySectionMaster=s0.industrySectionMaster;
  if(!db.themeSectionMaster) db.themeSectionMaster=s0.themeSectionMaster;
  // 既存の市場カードは粒度が未設定なので「市場」扱いにする(従来の語彙がそのまま使える)
  (db.stocks||[]).forEach(st=>{ if(st.kind==='市場' && !st.scope) st.scope='市場'; });
  // 旧セクション名 → 新体系サブ項目への読み替え
  const MAP={'事業・ビジネスモデル':'事業構造','成長ドライバー':'市場成長率','リスク要因':'事業リスク','競合ポジション':'主要競合','技術':'技術力'};
  (db.stocks||[]).forEach(st=>{
    if(!st.sections) st.sections={};
    Object.keys(st.sections).forEach(k=>{
      const v=st.sections[k];
      if(v===null){ delete st.sections[k]; return; }           // 旧「未取得」プレースホルダは削除
      if(MAP[k]){ const nk=MAP[k]; if(!st.sections[nk]) st.sections[nk]=v; delete st.sections[k]; }
      if(v&&!v.details) v.details=[];
    });
  });
  // 旧「自分の見解(mine)」をメモ型カードに移行
  (db.stocks||[]).forEach(st=>{
    if(st.mine&&st.mine.length){
      db.hypotheses=db.hypotheses||[];
      st.mine.forEach(m=>{ db.hypotheses.push({id:'h'+Math.random().toString(36).slice(2,9), stockId:st.id, kind:'memo', text:m.t, createdAt:m.ts}); });
      delete st.mine;
    }
  });
  // 廃止された 'hypo' 種別(検証ポイント・判定・版管理)を 'watch'(注目ポイント)へ変換。
  // text・eventDate・eventNoteは引き継ぎ、points・judgeLog・ver・verLog・stateは破棄する。
  (db.hypotheses||[]).forEach(h=>{ if(!h.kind) h.kind='hypo'; });
  db.hypotheses=(db.hypotheses||[]).map(h=>{
    if(h.kind!=='hypo') return h;
    return {
      id:h.id, stockId:h.stockId, kind:'watch',
      text:h.text, eventDate:h.eventDate||null, eventNote:h.eventNote||null,
      createdAt:h.createdAt
    };
  });
  // 「注目イベント(eventDate)」という独立した概念を廃止し、日付の管理はリマインダーに一本化する。
  // ホーム画面で「注目イベント」と「リマインダー」が別物として並んでいたのが混乱の元だったため、
  // 日付つきの注目ポイントは「リマインド候補(remindHint)」に移し、登録を促すだけの存在にする。
  // 既にリマインダーが紐づいているものは登録済みなので候補を作らない。
  {
    const linked=new Set();
    (db.reminders||[]).forEach(r=>(r.hypoIds||[]).forEach(id=>linked.add(id)));
    (db.hypotheses||[]).forEach(h=>{
      if(h.kind==='watch' && h.eventDate && !h.remindHint && !linked.has(h.id)){
        h.remindHint={date:h.eventDate, note:h.eventNote||null};
      }
      delete h.eventDate; delete h.eventNote; delete h.eventType;
    });
  }
  // 誤登録カードのクリーニング
  // ①kindが正規値以外なら「ウォッチ」に補正
  (db.stocks||[]).forEach(st=>{ if(!['保有','ウォッチ','市場'].includes(st.kind)) st.kind='ウォッチ'; });
  // ②市場カードと同名の「実質空の非市場カード」(取り込み時の誤登録)を削除
  {
    const mktNames=new Set((db.stocks||[]).filter(s=>s.kind==='市場').map(s=>s.name));
    db.stocks=(db.stocks||[]).filter(st=>{
      if(st.kind==='市場') return true;
      const empty=(!st.metrics||!Object.keys(st.metrics).length)&&(!st.sections||!Object.keys(st.sections).length)&&(!st.mine||!st.mine.length)&&(!st.trend||!Object.keys(st.trend).length);
      if(mktNames.has(st.name)&&empty) return false;   // 市場カードの同名空カードは誤登録として除去
      return true;
    });
  }
  return db;
}

const $=(s,r=document)=>r.querySelector(s);
const el=(h)=>{const d=document.createElement('div'); d.innerHTML=h.trim(); return d.firstChild;};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
// onclick="fn('...')" のようにJS文字列リテラルへ埋め込む値用。
// esc() はシングルクォートを扱わないため、セクション名に ' があるとハンドラが壊れる
function escArg(s){return esc(String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,'\\n'));}
function today(){return new Date();}
function parseD(s){ if(!s)return null; const m=String(s).match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/); if(!m)return null; return new Date(+m[1],+m[2]-1,+m[3]); }
function daysSince(s){ const d=parseD(s); if(!d)return 999; return Math.floor((today()-d)/86400000); }
// 文字単位の差分(LCS)。長文はチャンク分割して計算量を抑える
function diffChars(a,b){
  a=String(a==null?'':a); b=String(b==null?'':b);
  const LIMIT=1200;
  if(a.length>LIMIT||b.length>LIMIT){ // 長すぎる場合は句読点単位で粗く比較
    const as=a.split(/(?<=[。、\n])/), bs=b.split(/(?<=[。、\n])/);
    return lcsDiff(as,bs);
  }
  return lcsDiff(a.split(''), b.split(''));
}
function lcsDiff(A,B){
  const n=A.length,m=B.length;
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]= A[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<n&&j<m){
    if(A[i]===B[j]){ out.push({t:'=',v:A[i]}); i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ out.push({t:'-',v:A[i]}); i++; }
    else { out.push({t:'+',v:B[j]}); j++; }
  }
  while(i<n){ out.push({t:'-',v:A[i++]}); }
  while(j<m){ out.push({t:'+',v:B[j++]}); }
  // 連続する同種をまとめる
  const merged=[];
  out.forEach(o=>{ const last=merged[merged.length-1]; if(last&&last.t===o.t) last.v+=o.v; else merged.push({t:o.t,v:o.v}); });
  return merged;
}

}

  $('#topTitle').textContent='ホーム';
  const act=$('#topAct'); act.style.display='block'; act.textContent='⚙ バックアップ'; act.onclick=sheetBackup;
  const todayRem=DB.reminders.filter(r=>!r.paused);
  const pend=pendingHints();
  let h='';
  h+='<div class="lbl">対応が必要</div>';
  // 「対応が必要」だけ地色を変えて前に出す。下の「今週の予定」は同じ白カードだと同格に見えてしまう
  if(todayRem.length) h+=`<div class="card attn"><div class="row"><span class="chip navy">今日のリマインダー ${todayRem.length}</span><button class="btn sm pri" onclick="copyBrief()">☀ 今日のまとめ確認をコピー</button></div><div style="margin-top:6px;font-size:13px;font-weight:600">${esc(todayRem[0].title)} ほか</div></div>`;
  // 取り込みで日付が入ったのにリマインダー未登録の注目ポイント。
  // 日付はリマインダーでしか管理しないので、ここで登録を促さないと予定として現れない
  if(pend.length) h+=`<div class="card attn tap" onclick="openStock('${pend[0].stockId}')"><div class="row"><span class="chip amber">リマインド未登録 ${pend.length}件</span><span class="arrow" style="color:var(--ink3);font-size:15px">›</span></div><div class="muted" style="margin-top:4px">日付つきの注目ポイントがあります: ${pend.slice(0,3).map(p=>esc((stock(p.stockId)?.name||'')+' '+p.remindHint.date)).join('、')}</div></div>`;
  if(!todayRem.length&&!pend.length) h+='<div class="empty"><div class="big">対応が必要なことはありません</div><div>銘柄を分析するか、リマインダーを作りましょう。</div></div>';
  // 予定はリマインダーだけを載せる。
  // 以前は「注目イベント」も並べていたが、リマインダーの日付が「次に通知する日」なのに対し
  // 注目イベントの日付は「その日に事が起きる」で意味が違い、同じ見た目で並ぶと混乱するため廃止した
  const items=[];
  DB.reminders.filter(r=>!r.paused).forEach(r=>{const d=calcNextFire(r); if(d)items.push({d,label:r.title,act:`openReminder('${r.id}')`});});
  items.sort((a,b)=>a.d-b.d);
  h+='<div class="lbl">今週の予定</div>';
  if(!items.length) h+='<div class="muted">予定はありません</div>';
  else h+='<div class="list">'+items.slice(0,6).map(it=>{ const wd=['日','月','火','水','木','金','土'][it.d.getDay()];
    return `<div class="list-row" onclick="${it.act}"><div class="lt"><div class="ttl">${esc(it.label)}</div></div><span class="rt">${it.d.getMonth()+1}/${it.d.getDate()}(${wd})<span class="arrow">›</span></span></div>`; }).join('')+'</div>';
  v.innerHTML=h;
}

//////////////////// ANALYSIS list ////////////////////
let anaSort='保有優先';
function renderAnalysis(v){
  $('#topTitle').textContent='市場・銘柄分析';
  const act=$('#topAct'); act.style.display='block'; act.textContent='＋ 追加'; act.onclick=sheetAddStock;
  const sorts=['保有優先','名前順'];
  let h=`<div class="seg">${sorts.map(k=>`<button class="${anaSort===k?'on':''}" onclick="anaSort='${k}';render()">${k}</button>`).join('')}</div>`;

  if(!DB.stocks.length){ v.innerHTML=h+`<div class="empty"><div class="big">銘柄がありません</div><div>右上の「＋ 追加」から登録できます。</div></div>`; return; }
  // 1件ずつを独立カードにすると全部が同じ強さで並ぶので、区分ごとに1枚の枠へ行として並べる
  // 保有/ウォッチで見出しを分ける並びでは種別を行に出さない(見出しと重複する)。
  // 名前順のときだけ種別を添える
  const row=(s)=>{ const hy=hyposOf(s.id).length;
    const meta=esc(s.code)+(anaSort==='名前順'?' · '+esc(s.kind):'');
    return `<div class="list-row" onclick="openStock('${s.id}')">
      <div class="lt"><div class="ttl">${esc(s.name)}</div><div class="meta">${meta}</div></div>
      <span class="rt">${hy?`<span class="chip navy">メモ・注目 ${hy}</span>`:''}<span class="arrow">›</span></span>
    </div>`; };
  const mkts=DB.stocks.filter(s=>isMkt(s));
  const mrow=(s)=>{ const th=((DB.askPrefs&&DB.askPrefs.themes)||{})[s.id]||'';
    return `<div class="list-row" onclick="openStock('${s.id}')">
      <div class="lt"><div class="ttl">◆ ${esc(s.name)}</div>${th?`<div class="meta">注目: ${esc(th)}</div>`:''}</div>
      <span class="rt"><span class="chip gray">${esc(scopeOf(s))}</span><span class="arrow">›</span></span>
    </div>`; };
  const group=(label,rows)=>`<div class="lbl">${label}</div>`+(rows.length?`<div class="list">${rows.join('')}</div>`:'<div class="muted" style="padding:2px 2px 8px">なし</div>');
  if(mkts.length){
    // 粒度ごとにまとめる(市場→業界→テーマ)。混ざっていると何のカードか分かりにくい
    const rows=[]; SCOPES.forEach(sc=>mkts.filter(s=>scopeOf(s)===sc).forEach(s=>rows.push(mrow(s))));
    h+=group(`市場・業界・テーマ (${mkts.length})`, rows);
  }
  if(anaSort==='保有優先'){
    [['保有','保有'],['ウォッチ','ウォッチ']].forEach(([k,label])=>{
      const list=DB.stocks.filter(s=>s.kind===k);
      h+=group(`${label} (${list.length})`, list.map(row));
    });
  } else {
    let list=DB.stocks.filter(s=>!isMkt(s));
    list.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
    h+=group(`銘柄 (${list.length})`, list.map(row));
  }
  v.innerHTML=h;
}

//////////////////// DETAIL の共通ブロック ////////////////////
// 銘柄・市場の詳細画面は構成が違うので描画関数を分けている。
// ただしテーマ・分析・メモ・リンクは共通なので、ここに部品として切り出す。
function blkChips(hy){
  const wCnt=hy.filter(x=>x.kind==='watch').length, mCnt=hy.length-wCnt;
  if(!wCnt&&!mCnt) return '';
  return `<div class="pill-row" style="margin-bottom:11px">${wCnt?`<span class="chip amber">注目 ${wCnt}</span>`:''}${mCnt?`<span class="chip gray">メモ ${mCnt}</span>`:''}</div>`;
}
function blkTheme(s){
  const theme=((DB.askPrefs&&DB.askPrefs.themes)||{})[s.id]||'';
  // 市場・業界・テーマは「どの指数・ETFを指しているか」で数値の意味が変わるので、
  // 基準を1つ決められるようにする(例: AIというテーマ → グローバルX AI&ビッグデータETF)
  const bm=isMkt(s)?(s.benchmark||''):null;
  return `<div class="card tap" style="padding:9px 11px;margin-bottom:11px;border-left:3px solid var(--navy)" onclick="sheetTheme('${s.id}')">
    <div class="row"><span class="muted" style="font-size:11px">注目テーマ</span><span class="muted" style="font-size:11px">タップで編集</span></div>
    <div style="font-size:13px;font-weight:600;margin-top:2px;${theme?'':'color:var(--ink3);font-weight:400'}">${theme?esc(theme):'未設定(会話の切り口を決められます)'}</div>
    ${bm!==null?`<div class="row" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--line)"><span class="muted" style="font-size:11px">代表指数・ETF</span></div>
    <div style="font-size:12px;margin-top:1px;${bm?'':'color:var(--ink3)'}">${bm?esc(bm):'未設定(決めるとAIの答える数値がぶれません)'}</div>`:''}</div>`;
}
// 指標グリッド。6件を超える場合は横スワイプページャーで送る
function blkMetrics(s, label, keys, editAction, pagerId){
  let h=lblWithEdit(label, editAction, 'margin-top:2px');
  const chunks=[]; for(let i=0;i<keys.length;i+=6) chunks.push(keys.slice(i,i+6));
  if(chunks.length<=1) h+='<div class="metric">'+(chunks[0]||[]).map(k=>metricCellHtml(s,k)).join('')+'</div>';
  else {
    const pages=chunks.map(chunk=>`<div class="metric">${chunk.map(k=>metricCellHtml(s,k)).join('')}</div>`);
    h+=pagerBlock(pagerId, pages, (idx,total)=>`指標 ${idx+1}/${total}`, 'tight');
  }
  // 1つも埋まっていないときだけ、埋め方を1行だけ添える。
  // セルごとに「未取得」と書くと、新規カードを開くたびに何度も未完了を突きつけることになる
  if(keys.length && keys.every(k=>!s.metrics[k])) h+='<div class="hint" style="margin-top:6px">会話を取り込むと、ここに数字が入ります。</div>';
  return h;
}
// カテゴリのアコーディオン。各項目タップで概要/詳細スワイプのシートを開く
function blkSections(s){
  let h='<div class="lbl">分析</div>';
  const master=masterFor(s);
  master.filter(c=>c.on).forEach((c,ci)=>{
    const filled=filledCatCount(s,c.cat,master);
    h+=`<div class="sec" id="cat${ci}"><div class="h" onclick="this.parentNode.classList.toggle('open')"><span>${esc(c.cat)}${filled?` <span class="chip navy" style="font-size:11px">${filled}</span>`:''}</span><span class="m">${filled?filled+'/'+c.subs.length+' 項目':''}</span></div><div class="b" style="padding:0">`;
    c.subs.forEach(su=>{ const val=s.sections[su]; const det=(val&&val.details)||[];
      h+=`<div class="sub-row" onclick="event.stopPropagation();sheetAnalysisItem('${s.id}','${escArg(su)}')">
        <span class="name">${esc(su)}${det.length?` <span class="chip navy" style="font-size:11px">詳細${det.length}</span>`:''}</span>
        <span class="row-right"><span class="m">${val?esc(val.d.slice(5)):''}</span><span class="arrow">›</span></span>
      </div>`; });
    h+=`</div></div>`;
  });
  return h;
}
// 件数が増えるほど詳細画面が一方的に伸びていくので、既定は先頭3件だけ出して残りは畳む。
// 1件ずつのボタン(編集/削除/リマインダー)は行から外し、行タップで開く編集シートに集約した
const HYPO_PREVIEW=3;
function blkHypos(s, hy){
  let h=`<div class="lbl">メモ・注目ポイント (${hy.length})</div>`;
  if(!hy.length){
    h+='<div class="hint" style="margin:-4px 0 8px">思ったことはメモに、気にかけたい・検証したいことは注目ポイントに書けます。</div>';
  } else {
    const all=STATE.hypoAll || hy.length<=HYPO_PREVIEW;
    const shown=all?hy:hy.slice(0,HYPO_PREVIEW);
    h+='<div class="list">'+shown.map(hypoMiniCard).join('')+'</div>';
    if(!all) h+=`<button class="btn sm" style="width:100%;margin:-4px 0 10px" onclick="STATE.hypoAll=true;render()">残り ${hy.length-HYPO_PREVIEW}件を表示</button>`;
  }
  h+=`<div class="row" style="gap:8px;margin-top:2px">
    <button class="btn sm" onclick="sheetEditHypo(null,'${s.id}','memo')">＋ メモ</button>
    <button class="btn sm" onclick="sheetEditHypo(null,'${s.id}','watch')">＋ 注目ポイント</button>
  </div>`;
  return h;
}
function blkLinks(s){
  return `<button class="btn" style="margin-top:14px" onclick="openRem('${s.id}')">${isMkt(s)?'この'+scopeOf(s):'この銘柄'}のリマインダー (${remOf(s.id).length})</button>
    <button class="btn pri" style="margin-top:8px" onclick="openAsk('${s.id}')">会話を取り込む</button>`;
}
function detailHeader(s, sub){
  $('#topTitle').textContent=s.name;
  $('#topSub').textContent=sub;
  const act=$('#topAct'); act.style.display='block'; act.textContent='← 戻る'; act.onclick=()=>{STATE.stockId=null;render();};
  const menu=$('#topMenu'); menu.style.display='block'; menu.onclick=()=>sheetStockMenu(s.id);
}

//////////////////// STOCK DETAIL ////////////////////
function renderStockDetail(v){
  const s=stock(STATE.stockId); if(!s){go('analysis');return;}
  detailHeader(s, s.code+' · '+s.kind);
  const hy=hyposOf(s.id);
  let h=blkChips(hy)+blkTheme(s);
  h+=blkMetrics(s,'主要指標',DB.metricsMaster.snap,'sheetMetricsMaster()','metrics');
  h+=lblWithEdit('業績推移','sheetMetricsMaster()');
  h+=renderTrend(s);
  h+=blkSections(s)+blkHypos(s,hy)+blkLinks(s);

  pagerInit('metrics'); pagerInit('trendchart');
}

//////////////////// MARKET DETAIL ////////////////////
// 市場・業界・テーマ専用。銘柄と違い業績推移は持たず、指標は粒度ごとのマスターを使う。
// 以前は銘柄画面を流用して指標を丸ごと隠していたため、市場の水準感を数値で残せなかった
function renderMarketDetail(v){
  const s=stock(STATE.stockId); if(!s){go('analysis');return;}
  const sc=scopeOf(s);
  detailHeader(s, sc);
  const hy=hyposOf(s.id);
  let h=blkChips(hy)+blkTheme(s);
  const METLBL={'市場':'市場の水準','業界':'業界の水準','テーマ':'テーマの指標'};
  const keys=metricsMasterFor(s).snap;
  if(keys.length) h+=blkMetrics(s,METLBL[sc],keys,'sheetMarketMetricsMaster()','mktmetrics');
  else h+=lblWithEdit(METLBL[sc],'sheetMarketMetricsMaster()','margin-top:2px')+'<div class="muted" style="padding:0 2px 4px">まだありません。会話を取り込むと自動で増えます。</div>';
  h+=`<div class="hint" style="margin:2px 0 0">当日の値動きではなく、数か月単位で見直す水準を記録します。${s.benchmark?`基準: ${esc(s.benchmark)}`:''}</div>`;
  h+=blkSections(s);
  h+=blkHypos(s,hy);
  // 市場の話は最終的に「自分の銘柄がどうなるか」に着地するので、保有・ウォッチへの導線を置く
  const mine=DB.stocks.filter(x=>!isMkt(x));
  if(mine.length){
    h+='<div class="lbl">自分の銘柄を確認</div>';
    h+=`<div class="pill-row" style="margin-bottom:2px">${mine.map(x=>`<span class="chip navy tap" style="cursor:pointer" onclick="openStock('${x.id}')">${esc(x.name)}</span>`).join('')}</div>`;
  }
  h+=blkLinks(s);
  v.innerHTML=h;
  pagerInit('mktmetrics');
}
// 見出しの右端に編集リンクを添える(指標の追加・削除などの設定画面への入口)
function lblWithEdit(label, action, extraStyle){
  return `<div class="lbl" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;${extraStyle||''}">
    <span>${esc(label)}</span>
    <span style="color:var(--navy);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;min-height:44px;padding-left:16px" onclick="${action}">編集</span>
  </div>`;
}
function metricCellHtml(s,k){
  const m=s.metrics[k]; const miss=!m;
  // 「要更新」の判定はせず、いつ時点の数字かを事実として見せる。
  // 何年のものか分かるよう年(下2桁)まで出す(四半期開示は数か月前の日付が正常なため)
  return `<div class="m"><div class="k">${esc(k)}</div><div class="v" ${miss?'style="color:var(--ink3);font-weight:400"':''}>${miss?'—':esc(fmtNum(m.v))+(m.unit?`<span style="font-size:11px">${esc(m.unit)}</span>`:'')}</div><div class="d">${miss?'':esc(m.d.replace(/^\d{2}/,''))}</div></div>`;
}
function sheetStockMenu(sid){
  const s=stock(sid); if(!s) return;
  const mkt=isMkt(s);
  openSheet(`<h3>${esc(s.name)}</h3>
    ${mkt?`<label class="fld"><span class="t">種別</span>
      <div class="seg">${SCOPES.map(k=>`<button class="${k===scopeOf(s)?'on':''}" onclick="setScope('${sid}','${k}')">${k}</button>`).join('')}</div>
      <div class="hint">${esc(SCOPE_INFO[scopeOf(s)].desc)} 切り替えると指標・分析項目の既定が変わります(入力済みの内容は残ります)。</div></label>
      <button class="btn" onclick="closeSheet();sheetMarketMetricsMaster()">⚙ 指標・分析項目の設定(${esc(scopeOf(s))}用)</button>`
         :`<button class="btn" onclick="closeSheet();sheetMetricsMaster()">⚙ 収容指標・業績分析項目の設定</button>`}
    <button class="btn" style="margin-top:8px" onclick="closeSheet();sheetTheme('${sid}')">${mkt?'注目テーマ・代表指数を編集':'注目テーマを編集'}</button>
    <button class="btn danger" style="margin-top:16px" onclick="delStock('${sid}')">${mkt?'このカードを削除':'この銘柄を削除'}</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">閉じる</button>`);
}
// 粒度の変更。既に入力済みのセクション・指標のデータは消さない(表示対象から外れるだけ)
function setScope(sid, sc){
  const s=stock(sid); if(!s||!SCOPES.includes(sc)) return;
  s.scope=sc; save(); render(); sheetStockMenu(sid); toast(sc+'に変更しました');
}
const BM_PH={'市場':'例: TOPIX / S&P500','業界':'例: 東証業種別指数(電気機器) / SOX指数','テーマ':'例: グローバルX AI&ビッグデータETF (2638)'};
function sheetTheme(sid){
  const s=stock(sid); const mkt=s&&isMkt(s);
  const th=((DB.askPrefs&&DB.askPrefs.themes)||{})[sid]||'';
  const bm=(s&&s.benchmark)||'';
  openSheet(`<h3>${mkt?'注目テーマ・代表指数':'注目テーマ'}</h3>
    <div class="muted" style="margin-bottom:10px">${mkt?'この':'この銘柄を'}見るときの切り口。「聞くことが思いつかない時は」で作る質問文やリマインダー設定に反映されます。</div>
    <label class="fld"><span class="t">テーマ</span><input id="th_in" value="${esc(th)}" placeholder="例: AI・データセンター向け液冷技術"></label>
    ${mkt?`<label class="fld"><span class="t">代表指数・ETF(任意)</span>
      <input id="th_bm" value="${esc(bm)}" placeholder="${esc(BM_PH[scopeOf(s)]||'')}">
      <div class="hint">AIに数値を聞くときの基準になります。「AI」のように広いテーマでも、どの指数・ETFを指すか決まっていれば答えがぶれません。</div></label>`:''}
    <button class="btn pri" onclick="doSaveTheme('${sid}')">保存</button>`);
}
function doSaveTheme(sid){
  const v=$('#th_in').value.trim();
  if(!DB.askPrefs.themes)DB.askPrefs.themes={};
  DB.askPrefs.themes[sid]=v;
  const bmEl=$('#th_bm'), s=stock(sid);
  if(bmEl&&s){ const b=bmEl.value.trim(); if(b) s.benchmark=b; else delete s.benchmark; }
  save(); closeSheet(); render(); toast('保存しました');
}
function delStock(sid){
  const s=stock(sid); const hy=hyposOf(sid).length, rm=remOf(sid).length;
  let msg=`「${s.name}」を削除します。`;
  if(hy||rm) msg+=`\n\n関連する メモ・注目ポイント${hy}件・リマインダー${rm}件 も削除されます。`;
  msg+='\n\nこの操作は取り消せません。';
  askConfirm({title:'銘柄を削除', body:msg, okLabel:'削除する', danger:true, onOk:()=>{
    DB.stocks=DB.stocks.filter(x=>x.id!==sid);
    DB.hypotheses=DB.hypotheses.filter(x=>x.stockId!==sid);
    DB.reminders=DB.reminders.filter(x=>x.stockId!==sid);
    if(DB.askPrefs&&DB.askPrefs.themes) delete DB.askPrefs.themes[sid];
    save(); STATE.stockId=null; go('analysis'); toast('削除しました');
  }});
}
function renderTrend(s){
  const tr=s.trend; const inds=DB.metricsMaster.trend.filter(t=>t.graph&&tr[t.name]);
  const years=new Set(); Object.values(tr).forEach(o=>Object.keys(o).forEach(k=>{if(k!=='unit')years.add(k);}));
  const ys=[...years];
  // 1年分も無いときは、見出しだけの空テーブルが出て「壊れている」ように見えるので出さない
  if(!ys.length) return '<div class="hint" style="margin:0 0 4px">売上高・営業利益などを年度つきで取り込むと、ここにグラフと表が出ます。</div>';
  let h='<div class="card" style="padding:11px 12px">';
  // 棒グラフ(グラフ対象指標が複数あれば横スワイプページャーで切り替え)
  if(inds.length){
    const chartHtml=(ind)=>{ const first=tr[ind.name]; const vals=ys.map(y=>+((first[y]||'0').replace(/,/g,''))); const max=Math.max(...vals,1);
      let ch='<div style="display:flex;align-items:flex-end;gap:8px;height:118px;margin-bottom:8px">';
      ys.forEach((y,i)=>{ const pct=Math.round(vals[i]/max*100); const fc=y.includes('予');
        ch+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><div style="width:60%;height:${pct}%;border-radius:3px 3px 0 0;${fc?'border:1.5px dashed var(--navy);':'background:var(--navy);'}"></div><div style="font-size:11px;color:var(--ink3);text-align:center">${esc(y.replace('期','').replace(/[（(]予[）)]/,''))}</div></div>`; });
      ch+='</div>'; ch+=`<div class="muted" style="font-size:11px;margin-bottom:2px">${esc(ind.name)}(${esc(first.unit||'')}) · 点線=予想</div>`;
      return ch;
    };
    if(inds.length<=1){ h+=chartHtml(inds[0]); }
    else { h+=pagerBlock('trendchart', inds.map(chartHtml), (idx)=>`${idx+1} / ${inds.length}`, 'tight'); }
  }
  // table

  DB.metricsMaster.trend.forEach(t=>{ const o=tr[t.name]; if(!o)return;

function briefingText(){
  // 分析の項目名は resolveSection が既知の名称にしか当たらないため、
  // 実際のマスターから一覧を生成して説明書に載せる(載せないと外部AIの出力がほぼ全て「該当なし」になる)
  const catList=(m)=>m.filter(c=>c.on).map(c=>`  【${c.cat}】 `+c.subs.join(' / ')).join('\n');
  const stockCats=catList(DB.sectionMaster);
  const mktCats=catList(DB.marketSectionMaster||[]);
  const indCats=catList(DB.industrySectionMaster||[]);
  const thmCats=catList(DB.themeSectionMaster||[]);
  const snap=DB.metricsMaster.snap.join(' / ');
  const mktSnap=DB.marketMetricsMaster.snap.join(' / ');
  const indSnap=(DB.industryMetricsMaster.snap||[]).join(' / ');
  const trend=DB.metricsMaster.trend.map(t=>t.name).join(' / ');
  return `あなたは投資記録アプリ「仮説トラッカー」と連携するアシスタントです。今後の会話の中で、次のいずれかに該当する情報が出てきたら、その都度このフォーマットで出力してください。当てはまらない話は、いつも通りの自由な文章のままで構いません(私が「メモ」として記録します)。

出力の先頭には対象を明記してください:
# 銘柄: 銘柄名 (証券コード)
(市場・業界などテーマの話なら) # テーマ: テーマ名

■ 書き方のお願い
専門用語はできるだけ避け、避けられない場合は「◯◯(=平たく言うと△△)」のように短い補足を添えてください。
後から読み返して意味が分かることが目的なので、業界用語で圧縮せず、平易な日本語でお願いします。
出典・URL・確信度は書かないでください。確からしさの担保はあなたの側でお願いします。
不確かなことは無理に書かず、分からない項目は省いてください(空欄で構いません)。

■ 指標(数値のスナップショット)
## 指標
- 指標名: 値 | 単位:◯◯ | 基準日(YYYY/M/D)
  値には単位や記号を含めず数値だけを書き、単位は「単位:」欄に書いてください(例: 単位:USD、単位:百万USD、単位:%、単位:倍)。
  銘柄の話のときによく使う指標名: ${snap}
  市場全体の話のときによく使う指標名: ${mktSnap}
    ※市場の話は数値より「今どういう地合いか」の説明が主役です。指標は水準の裏付けとして添える程度で構いません。
      株価指数の値・移動平均・日々のボラティリティは書かないでください(証券アプリで見ます)。
      CPI・PMIなど発表日が決まっているものは、指標にするより「## 注目ポイント」にイベント日つきで書いてください。
  業界の話のときによく使う指標名: ${indSnap}
    ※業界の指標は、東証の業種別データのように**公表されている業種別の数値**がある場合だけ書いてください。
      構成企業を集計して中央値を自分で算出する必要があるもの(業界のROE・営業利益率など)は、数値としては書かないでください。
      その場合は「## 分析」の「価格動向・採算」などに、「この業界の営業利益率は概ね10〜15%、A社は突出して高い」のように
      文章で書いてください。根拠や範囲を添えられる形のほうが、後から読み返して判断できます。
  これ以外の指標名も自由に使えます(取り込み時に自動で追加されます)。
  現在株価や当日の値動きは不要です(リアルタイム性が要るものは証券アプリで見ます)。
  ここで扱いたいのは、決算や指標の更新に合わせて数か月単位で見直す数字です。

■ 業績推移
## 業績推移
- 指標名: 25年3月期=数値 | 26年3月期=数値 | 27年3月期(予)=数値 | 単位:◯◯ | 基準日
  よく使う指標名: ${trend}
  決算期は「yy年mm月期」表記、予想には(予)を付けてください(米国株など海外企業も同じ形式で、その企業の決算月に合わせてください)。
  これは個別企業の決算のみです。市場・テーマの話では使いません。

■ 分析(定性的な内容)
## 分析
- 項目名(サマリ): 2〜3文の要点 | 基準日(YYYY/M/D)
- 項目名(詳細): 深掘りした長文 | 基準日(YYYY/M/D)
  項目名は必ず下記のいずれかを使ってください(カテゴリ名【】は付けない)。ここに無い名前を使うと取り込めません。
${stockCats}
  市場全体(日本株市場・米国株市場など)の話のときは下記:
${mktCats}
  業界(半導体・データセンターなど)の話のときは下記:
${indCats}
  テーマ(AI・脱炭素など、業界をまたぐ切り口)の話のときは下記:
${thmCats}

■ 注目ポイント(検証したい・気にかけたい観点。何がどうなったら良い/悪いか)
## 注目ポイント
- 本文: 自由記述
- イベント日: YYYY/M/D(任意。決算日など「その日に思い出したい」きっかけがあれば)
  複数ある場合は「## 注目ポイント」の見出しごと繰り返してください。
  この2つ以外の項目(出典など)は書かないでください。
  イベント日はアプリ側でリマインダー(通知)の候補日として扱われます。

これらは私がアプリの画面にそのまま貼り付けて取り込みます。リマインダーの頻度や確認内容の設計はアプリ側で別途行うので、ここでは扱わなくて大丈夫です。`;
}
function copyBriefing(){ copy(briefingText(), '説明書をコピーしました。ChatGPTのカスタム指示や会話の最初に貼ってください'); }
function parseMd(text){
  // returns {stock:{name,code}, rows:[{block,key,value,d,src,conf,kind}], failed:[], type, memoCandidates:[]}
  const lines=text.split(/\r?\n/); let block=null; let rows=[]; const failed=[]; let stk=null; let type='analysis';
  // 見出しにも箇条書きにも当てはまらない自由文(会話の地の文)は、メモ候補として連続した段落単位にまとめる
  const memoCandidates=[]; let pendingFree=[];
  const flushFree=()=>{ if(pendingFree.length){ memoCandidates.push(pendingFree.join('\n')); pendingFree=[]; } };
  for(let raw of lines){
    let line=raw.replace(/\*\*/g,'').trim();
    if(!line) { flushFree(); continue; }
    if(/^```/.test(line)) continue;                                  // コードブロック境界
    if(/^\[[0-9A-F-]{8,}\]\(https?:\/\//i.test(line)) continue;    // citationリンク行
    if(/^(PR TIMES|\+\d+)\s*`*$/i.test(line)) continue;            // 出典フッタ
    let m;
    if(m=line.match(/^#\s*銘柄[:：]\s*(.+?)\s*[\(（]([A-Za-z0-9]+)[\)）]/)){ stk={name:m[1].trim(),code:m[2].trim()}; flushFree(); continue; }
    if(m=line.match(/^#\s*テーマ[:：]\s*(.+)$/)){ const nm=m[1].trim(); const mk=DB.stocks.find(x=>isMkt(x)&&x.name===nm); stk={name:nm, code:mk?mk.id:nm, isMarket:true}; flushFree(); continue; }
    if(m=line.match(/^##\s*(.+)$/)){ const b=m[1].trim(); block=b; if(/リマインダー/.test(b))type='reminder'; flushFree(); continue; }
    if(line.startsWith('#')) { flushFree(); continue; }
    if(/^[-•*・‣▪]\s*/.test(line)){
      flushFree();
      let body=line.replace(/^[-•*・‣▪]\s*/,'');
      // key: value | d | src | conf   (labels like 出典: 確信度: tolerated)
      let km=body.match(/^([^:：]+)[:：]\s*(.*)$/);
      if(!km){ failed.push(raw.trim()); continue; }
      let key=km[1].trim(); let rest=km[2].trim();
      let parts=rest.split('|').map(x=>x.trim());
      let value=parts[0]||'';
      let d='',src='',conf='',unit='';
      parts.slice(1).forEach(p=>{
        if(/月期/.test(p)&&p.includes('=')){ value+=' | '+p; return; }
        const confM=p.match(/確信度[:：]\s*(高|中|低)/); if(confM){ conf=confM[1]; return; }
        p=p.replace(/^(出典|確信度|基準日|単位)[:：]\s*/,'');
        if(/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(p)||/^\d{1,2}\/\d{1,2}$/.test(p)) d=p;
        else if(/^(高|中|低)$/.test(p)) conf=p;
        else if(/^単位/.test(parts.find(x=>x.includes(p))||'')||/円|USD|ドル|\$|%/.test(p)&&p.length<8) unit=p.replace(/単位[:：]/,'');
        else src=src?src+' / '+p:p;
      });
      src=shortSrc(src);
      // 数値項目(指標・業績推移)のみ単位を正規化する。分析セクションの本文は一切加工しない。
      const isTrendRow = /[年][0-9]{1,2}月期/.test(value) && value.includes('=');
      const isAnalysisRow = /分析/.test(block||'') || /[（(](サマリ|要点のみ|詳細)[）)]/.test(key);
      if(isTrendRow){
        const segs=value.split('|').map(x=>x.trim()).filter(Boolean);
        const outs=[]; let segUnit='';
        segs.forEach(sg=>{ const mm=sg.split('='); if(mm.length!==2){outs.push(sg);return;}
          const nv=normalizeValueUnit(mm[1].trim(), '');
          if(nv.unit&&!segUnit) segUnit=nv.unit;
          outs.push(mm[0].trim()+'='+nv.v); });
        value=outs.join(' | ');
        if(segUnit&&(!unit||unit==='円')) unit=segUnit;
      } else if(!isAnalysisRow && isNumericValue(value)){
        const nv=normalizeValueUnit(value, unit);
        value=nv.v; if(nv.unit) unit=nv.unit;
      }
      // date-ok check
      if(d&&!parseD(d.length<=5?('2026/'+d):d) && !/^\d{1,2}\/\d{1,2}$/.test(d)){ /* keep */ }
      rows.push({block,key,value,d,src,conf,unit, raw:raw.trim()});
    } else { pendingFree.push(line); }
  }
  flushFree();
  // 見出しが無い行の行き先をキーから推定(GPTの分割出力対策)
  rows.forEach(r=>{
    if(r.block) return;
    if(DB.metricsMaster.snap.includes(r.key)) r.block='指標';
    else if(/[年][0-9]{1,2}月期\s*(\(予\))?\s*=/.test(r.value)||/FY\d{2}\s*=/.test(r.value)) r.block='業績推移';
    else if(resolveSection(r.key,r.value).sub) r.block='分析';
  });
  // 「## 注目ポイント」: 本文＋(任意)イベント日を1カード分の行にまとめる。
  // 複数回登場する場合も、本文の出現ごとに新しいまとまりとして分離する。
  let merged=[]; let pending=null;
  const flushPending=()=>{ if(pending){ merged.push(pending); pending=null; } };
  rows.forEach(r=>{
    if(r.block!=='注目ポイント'){ flushPending(); merged.push(r); return; }
    if(r.key==='本文'){ flushPending(); pending={block:'注目ポイント', key:'注目ポイント', value:r.value, eventDate:null, raw:r.raw}; }
    else if(/イベント日/.test(r.key) && pending){ pending.eventDate=r.value; }
    // 本文・イベント日以外(出典/確信度など、本文より前に来たイベント日も含む)は
    // カード化するとゴミが増えるため、メモ候補に回してユーザーの判断に委ねる
    else { memoCandidates.push(r.key+': '+r.value); }
  });
  flushPending();
  rows=merged;
  // 重複除外(同じキーで同じ値が複数回=AIの再出力)
  const seen=new Set(); const dups=[];
  const uniq=rows.filter(r=>{ const sig=r.key+'|'+String(r.value).slice(0,80); if(seen.has(sig)){ dups.push(r); return false; } seen.add(sig); return true; });
  return {stock:stk, rows:uniq, failed, type, dups, memoCandidates};
}
async function pasteFromClipboard(){
  const ta=$('#mdIn'); if(!ta) return;
  try{
    const txt=await navigator.clipboard.readText();
    if(!txt||!txt.trim()){ toast('クリップボードが空です'); return; }
    // 既に内容があれば追記(分割出力を続けて貼るケース)
    ta.value = ta.value.trim() ? (ta.value.replace(/\s+$/,'')+'\n\n'+txt) : txt;
    parseAndPreview();
    toast('貼り付けました');
  }catch(e){
    // 権限が無い/未対応の場合は手動ペーストへ誘導
    ta.focus();
    toast('端末の設定により自動貼り付けできません。入力欄を長押しして「ペースト」してください');
  }
}
function clearPaste(){ const ta=$('#mdIn'); if(!ta) return; ta.value=''; $('#parseOut').innerHTML=''; window._parsed=null; window._orphans=null; toast('クリアしました'); }
function parseAndPreview(){
  const text=$('#mdIn').value; const out=$('#parseOut');
  if(!text.trim()){ out.innerHTML=''; return; }
  const p=parseMd(text);
  let h='';
  if(p.type==='reminder'){ out.innerHTML='<div class="banner" style="background:var(--amber-bg);color:var(--amber-tx)">リマインダー形式を検出しました。<b>リマインダー登録</b>で読み込んでください(このプロトタイプでは企業分析の読み込みのみ実装)。</div>'; return; }
  // md内に銘柄行が無ければ、画面で選択中のカードを使う(分割出力の2回目以降を想定)
  let fallback=false;
  if(!p.stock && STATE.askStockId){ const sc0=stock(STATE.askStockId); if(sc0){ p.stock={name:sc0.name, code:sc0.id, isMarket:isMkt(sc0)}; fallback=true; } }
  // テーマ名がどのカードとも一致しないが、選択中カードがある場合は選択中を優先(登録ボタンを出さない)
  if(p.stock && p.stock.isMarket && !stock(p.stock.code) && STATE.askStockId){
    const sc0=stock(STATE.askStockId);
    if(sc0 && isMkt(sc0)){ p.stock={name:sc0.name, code:sc0.id, isMarket:true}; fallback=true; }
  }
  if(p.stock){ const known=stock(p.stock.code)||DB.stocks.find(x=>x.name===p.stock.name);
    if(known&&!stock(p.stock.code)) p.stock.code=known.id;
    h+=`<div class="pill-row" style="margin:4px 0 8px"><span class="chip ${known?'green':'red'}">${known?(fallback?'対象の銘柄: ':'銘柄: ')+esc(p.stock.name)+(fallback?' に取り込みます':' を検出'):'未登録: '+esc(p.stock.name)}</span><span class="chip gray">読取 ${p.rows.length}行</span></div>`;
    if(fallback) h+='<div class="muted" style="margin:-4px 0 8px;font-size:11px">回答に銘柄名がないため、この銘柄に取り込みます。別の銘柄に入れる場合は、貼り付け文の先頭に「# 銘柄: 名称 (コード)」を付けてください。</div>';
    if(!known){ h+=`<button class="btn sm" style="margin-bottom:8px" onclick='addStockFromImport(${JSON.stringify(p.stock)})'>${p.stock.isMarket?'新規テーマとして登録':'新規銘柄として登録'}</button>`; }
    if(p.dups&&p.dups.length) h+=`<div class="muted" style="margin:-4px 0 8px;font-size:11px">同一内容の重複 ${p.dups.length}件を除外しました</div>`;
  } else {
    h+='<div class="pill-row" style="margin:4px 0 6px"><span class="chip red">銘柄を特定できません</span></div>';
    h+=`<label class="fld"><span class="t">対象の銘柄を選んでください</span><select id="importStockPick">
      <option value="">— 選択 —</option>
      ${DB.stocks.map(x=>`<option value="${x.id}">${isMkt(x)?'◆ '+esc(x.name):esc(x.name)+' ('+esc(x.code)+')'}</option>`).join('')}</select>
      <div class="hint">次からは、貼り付け文の先頭に「# 銘柄: 名称 (コード)」を付けるようAIに伝えておくと選ばずに済みます。</div></label>`;
  }
  // diff table
  if(p.rows.length){
    // 分析行の行き先を判定し、該当なしを分離
    const orphans=[];
    const target=p.stock?stock(p.stock.code):null;
    p.rows.forEach(r=>{
      if(/分析/.test(r.block||'')){ const res=resolveSection(r.key,r.value); r._res=res; if(!res.sub) orphans.push(r); }
      // 市場カードは指標(水準)を持てるが、業績推移(企業の決算)は持たない
      else if(target&&isMkt(target)&&/業績|推移/.test(r.block||'')){ r._res={sub:null}; orphans.push(r); }
    });
    const okRows=p.rows.filter(r=>!(r._res&&!r._res.sub));
    if(orphans.length){
      h+=`<div class="failbox" style="background:var(--red-bg)"><div class="t" style="color:var(--red-tx)">⚠ 該当セクションが見つからない行 (${orphans.length})</div>
        <div class="muted" style="font-size:11px;color:var(--red-tx);margin:3px 0 6px">下記はどのセクションにも紐づきません。取り込むにはチェックしてください(取り込む場合は「その他」として保存されます)。</div>`;
      orphans.forEach((r,i)=>{ h+=`<div style="display:flex;gap:8px;align-items:flex-start;padding:4px 0"><input type="checkbox" style="width:auto;margin:3px 0 0 0" id="orp${i}"><label for="orp${i}" class="l" style="flex:1;cursor:pointer">${esc(r.key)}: ${esc(r.value.slice(0,60))}…</label></div>`; });
      h+='</div>';
    }
    h+='<div class="lbl">読み込みプレビュー</div>';
    h+='<div class="difflegend"><span>セルをタップで全文表示</span><span class="d-del">削除される部分</span><span class="d-add">新しく追加される部分</span></div>';
    h+='<div style="overflow-x:auto"><table style="min-width:560px"><tr><th style="width:110px">項目</th><th style="width:210px">更新前</th><th style="width:210px">更新後</th></tr>';

  const p=window._parsed; if(!p){toast('読み込む内容がありません');return;}
  if(!p.stock && STATE.askStockId){ const sc0=stock(STATE.askStockId); if(sc0) p.stock={name:sc0.name, code:sc0.code}; }
  if(!p.stock){ const pickEl=$('#importStockPick'); const picked=pickEl?stock(pickEl.value):null; if(picked) p.stock={name:picked.name, code:picked.id}; }

  const s=stock(p.stock.code); if(!s){toast('先に新規銘柄として登録してください');return;}
  const memoTexts=[...document.querySelectorAll('#memoCandList .mc-text')].map(ta=>ta.value.trim()).filter(Boolean);
  if(!p.rows.length && !memoTexts.length){ toast('取り込む内容がありません'); return; }

  (window._orphans||[]).forEach((r,i)=>{ const cb=document.getElementById('orp'+i); if(cb&&cb.checked){ let oc=DB.sectionMaster.find(c=>c.cat==='その他'); if(!oc){ oc={cat:'その他',on:true,subs:[]}; DB.sectionMaster.push(oc);} const nm=String(r.key).split(/[:：]/).pop().replace(/[（(](サマリ|要点のみ|詳細)[）)]/,'').trim()||'メモ'; if(!oc.subs.includes(nm)) oc.subs.push(nm); s.sections[nm]={t:(r._res?r._res.value:r.value),d:normD(r.d),details:[]}; } });

    if(r._res&&!r._res.sub) return;

      if(/指標/.test(r.block||'')&&s.metrics[r.key]) s.metrics[r.key].d=normD(r.d);
      else if(r._res&&r._res.sub&&s.sections[r._res.sub]&&r._res.layer!=='詳細') s.sections[r._res.sub].d=normD(r.d);
      return;
    }
    if(/指標/.test(r.block||'')){
      // 出典も確信度も保存しない。どちらも生成AIの自己申告で、無関係な出典が
      // 混ざったり確信度が実態と合わなかったりするため、信頼の手掛かりにならない。
      // 確からしさの担保は外部AI側に委ね、アプリは「何をいつ時点で受け取ったか」だけを残す
      s.metrics[r.key]={v:r.value,unit:r.unit||'',d:normD(r.d)};
      // マスターに無い指標名は保存しても画面に出ないため、取り込み時に自動登録する。
      // ただしユーザーが自分で非表示にした指標は、取り込みのたびに復活させない。
      // 市場・テーマは銘柄とは別の指標マスターに登録する(PERと騰落レシオを混ぜない)
      const mm=metricsMasterFor(s);
      if(!mm.snap.includes(r.key) && !(mm.hiddenSnap||[]).includes(r.key)) mm.snap.push(r.key);
    }
    else if(/業績|推移/.test(r.block||'')){ /* value like 25年3月期=... */ const o={unit:r.unit||''}; r.value.split('|').forEach(seg=>{const mm=seg.split('=');if(mm.length===2)o[mm[0].trim()]=mm[1].trim();}); s.trend[r.key]=o;
      if(!DB.metricsMaster.trend.some(t=>t.name===r.key) && !(DB.metricsMaster.hiddenTrend||[]).some(t=>t.name===r.key)){
        // グラフは最大4件までの運用のため、超える分は表(グラフなし)で追加
        DB.metricsMaster.trend.push({name:r.key, graph:DB.metricsMaster.trend.filter(t=>t.graph).length<4});
      }
    }
    else if(/分析/.test(r.block||'')){
      const res=resolveSection(r.key, r.value);
      if(!res.sub) return;
      const key=res.sub, isDetail=res.layer==='詳細', val=res.value;
      const prev=s.sections[key];
      if(isDetail){ if(!s.sections[key]) s.sections[key]={t:'(要点のみ未取得)',d:normD(r.d),details:[]}; if(!s.sections[key].details)s.sections[key].details=[]; s.sections[key].details.unshift({ts:normD(r.d),title:'AI深掘り',t:val}); }
      else { s.sections[key]={t:val,d:normD(r.d),details:(prev&&prev.details)||[]}; }
    }
    else if(/注目ポイント/.test(r.block||'')){
      // 取り込まれたイベント日はカードには持たせず、リマインダー登録の候補として保持する
      const ed = r.eventDate ? (/^\d{1,2}\/\d{1,2}$/.test(r.eventDate)?'2026/'+r.eventDate:r.eventDate) : null;
      const hid='h'+Date.now()+Math.random().toString(36).slice(2,8);
      DB.hypotheses.push({id:hid, stockId:s.id, kind:'watch', text:r.value, remindHint:ed?{date:ed, note:null}:null});
      if(ed) newWatchWithEvent.push({id:hid, text:r.value, eventDate:ed});
    }
  });
  // メモ候補: 画面上で編集・追加・削除された内容をそのまま取り込む(memoTextsは冒頭で採取済み)
  memoTexts.forEach(t=>{ DB.hypotheses.push({id:'h'+Date.now()+Math.random().toString(36).slice(2,8), stockId:s.id, kind:'memo', text:t}); });
  save();
  const n=p.rows.length+memoTexts.length;
  toast(n+'件を読み込みました');
  $('#mdIn').value=''; $('#parseOut').innerHTML='';
  openStock(s.id);
  if(newWatchWithEvent.length) sheetReminderTriage(newWatchWithEvent, s.id);
}
// 取り込みの項目名解決は全マスター横断で行う(粒度を跨いだ貼り付けでも取りこぼさない)
function allSectionMasters(){ return [DB.sectionMaster, DB.marketSectionMaster, DB.industrySectionMaster, DB.themeSectionMaster].filter(Boolean); }
function knownSubs(){ const a=[]; allSectionMasters().forEach(M=>M.forEach(c=>c.subs.forEach(su=>a.push(su)))); return a; }
// 「主要競合(サマリ)」「競争環境: 主要競合(サマリ)」「競争環境: 主要競合(詳細): 本文」いずれも解決する
function resolveSection(rawKey, rawValue){
  let key=String(rawKey||'').trim(), value=String(rawValue||'').trim();
  let layer=null;
  const pick=(s)=>{ const m=s.match(/^(.*?)[（(](サマリ|要点のみ|詳細)[）)]\s*$/); if(m) return {base:m[1].trim(), lay:(m[2]==='詳細'?'詳細':'サマリ')}; return null; };
  // ケースA: キー自体にレイヤー表記がある
  let p=pick(key);
  if(p){ key=p.base; layer=p.lay; }
  // ケースB: キーがカテゴリ名で、値の先頭が「サブ項目(レイヤー): 本文」
  const cats=[].concat(...allSectionMasters().map(M=>M.map(c=>c.cat)));
  if(cats.includes(key)){
    const m=value.match(/^([^:：]+)[:：]\s*([\s\S]*)$/);
    if(m){ const p2=pick(m[1].trim()); if(p2){ key=p2.base; layer=p2.lay; value=m[2].trim(); } else { key=m[1].trim(); value=m[2].trim(); } }
  }
  // キー内に「カテゴリ: サブ項目」が同居している場合
  if(key.includes(':')||key.includes('：')){
    const parts=key.split(/[:：]/).map(x=>x.trim()).filter(Boolean);
    const last=parts[parts.length-1]; const p3=pick(last);
    if(p3){ key=p3.base; layer=p3.lay; } else { key=last; }
  }
  const subs=knownSubs();
  if(!subs.includes(key)){
    const hit=subs.find(su=>key.includes(su)||su.includes(key));
    if(hit) key=hit; else return {sub:null, layer:layer||'サマリ', value};
  }
  return {sub:key, layer:layer||'サマリ', value};
}
function shortSrc(s){
  if(!s) return '';
  let x=String(s);
  x=x.replace(/\[([^\]]*)\]\((https?:\/\/[^\)]+)\)/g, (m,label,url)=>{
    try{ const h=url.match(/^https?:\/\/([^\/\?]+)/); return (h?h[1].replace(/^www\./,''):(label||'')); }catch(e){ return label||''; }
  });
  x=x.replace(/https?:\/\/\S+/g,'').replace(/\s{2,}/g,' ').replace(/\s*\/\s*$/,'').trim();
  // 重複ドメインの除去
  const parts=[...new Set(x.split(/[\/、,]\s*/).map(y=>y.trim()).filter(Boolean))];
  x=parts.join(' / ');
  return x.length>40?x.slice(0,40)+'…':x;
}
// 値が「単独の数値(+単位)」に見えるか。文章は false。
function isNumericValue(v){
  const s=String(v).trim();
  if(s.length>24) return false;                       // 長い=文章
  if(/[。、！？]/.test(s)) return false;               // 句読点=文章
  if(/[ぁ-んァ-ヶ]{3,}/.test(s)) return false;         // かな連続=文章
  return /^[\-\d,.,]+\s*(兆|億|万)?\s*[\d,.]*\s*(億円|百万円|百万USD|万円|円|倍|%|USD|ドル|\$[BM]?)?\s*$/.test(s);
}
// 日本語の位取り単位を正規化: 「1兆3425億円」→ {v:13425, unit:'億円'} 等
function normalizeValueUnit(value, unit){
  if(!isNumericValue(value)) return {v:String(value), unit:String(unit||'')};   // 文章は加工しない
  let v=String(value).trim(); let u=String(unit||'').trim();
  const jp=v.match(/^([\d,\.]*)?\s*(兆)?\s*([\d,\.]+)?\s*(億|万)?\s*(円|USD|ドル)?\s*$/);
  if(/兆|億|万/.test(v)){
    let total=0; let m;
    if(m=v.match(/([\d,\.]+)\s*兆/)) total+=parseFloat(m[1].replace(/,/g,''))*10000;   // 兆→億換算
    if(m=v.match(/([\d,\.]+)\s*億/)) total+=parseFloat(m[1].replace(/,/g,''));
    if(total>0){ return {v:String(Math.round(total*100)/100), unit:'億円'}; }
  }
  const um=v.match(/^([\-\d,\.]+)\s*(億円|百万円|百万USD|万円|円|倍|%|USD|\$[BM]?)$/);
  if(um){ return {v:um[1].replace(/,/g,''), unit:um[2]}; }
  return {v:v.replace(/,/g,''), unit:u};
}
function normD(d){ if(!d)return '2026/7/13'; if(/^\d{1,2}\/\d{1,2}$/.test(d))return '2026/'+d; return d; }

const FREQS=['毎時間','毎日','平日','土日','週次(月)','週次(火)','週次(水)','週次(木)','週次(金)','月次(1日)','単発'];

  const ch=r.changes||[];
  let h=`<h3>リマインダーを編集</h3>
    <label class="fld"><span class="t">対象銘柄</span><select id="e_stock">${DB.stocks.map(s=>`<option value="${s.id}" ${s.id===r.stockId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label>

    <label class="fld"><span class="t">コメント</span><textarea id="e_comment" style="min-height:52px">${esc(r.comment||'')}</textarea></label>

    <div class="lbl">頻度変更(最大2)</div>`;
  for(let i=0;i<2;i++){ const c=ch[i]||{};
    h+=`<div class="card" style="padding:10px 11px">
      <div class="muted" style="font-size:11px;margin-bottom:4px">変更${i+1}${c.cond?'':' (未設定)'}</div>
      <label class="fld" style="margin-bottom:7px"><span class="t">条件(日付を含める)</span><input id="e_c${i}_cond" value="${esc(c.cond||'')}" placeholder="決算発表日 2026/8/13 になったら"></label>
      <label class="fld" style="margin-bottom:7px"><span class="t">変更後の頻度</span><input id="e_c${i}_freq" value="${esc(c.freq||'')}" placeholder="毎日 / 平日 / 単発 2026/8/13"></label>
      <label class="fld" style="margin-bottom:7px"><span class="t">変更後の時間</span><input id="e_c${i}_times" value="${esc(c.times||'')}" placeholder="08:30, 12:00"></label>
      <div class="hint" style="margin:-4px 0 7px">終了日は全体の設定(上の終了日)を使います。</div>
      <label class="fld" style="margin-bottom:0"><span class="t">変更後の実行プロンプト(空欄=変更しない)</span><textarea id="e_c${i}_prompt" style="min-height:70px" placeholder="この時期に確認すべきポイントに書き換える">${esc(c.prompt||'')}</textarea></label>
    </div>`; }
  h+=`<label class="fld" style="margin-top:8px"><span class="t">実行プロンプト</span><textarea id="e_prompt" style="min-height:110px">${esc(r.prompt||'')}</textarea></label>
    <button class="btn pri" onclick="saveEditReminder('${r.id}')">保存</button>
    <button class="btn ghost" style="margin-top:8px" onclick="openReminder('${r.id}')">キャンセル</button>`;
  openSheet(h);
}
function saveEditReminder(id){
  const r=DB.reminders.find(x=>x.id===id); if(!r) return;
  const title=$('#e_title').value.trim(); if(!title){ toast('タイトルは必須です'); return; }
  r.stockId=$('#e_stock').value;
  const sd=fromISO($('#e_start').value);
  const ed=fromISO($('#e_end').value);
  if(sd && ed && parseD(ed) < parseD(sd)){ toast('終了日は開始日より後にしてください'); return; }
  r.startDate=sd||null;
  r.endDate=ed||null;
  r.title=title;
  r.comment=$('#e_comment').value.trim();
  r.cat=$('#e_cat').value;
  r.freq=$('#e_freq').value;
  r.times=$('#e_times').value.split(',').map(x=>x.trim()).filter(Boolean);
  const ch=[];
  for(let i=0;i<2;i++){
    const cond=$('#e_c'+i+'_cond').value.trim();
    if(!cond) continue;
    const cp=$('#e_c'+i+'_prompt').value.trim();
    const o={cond, freq:$('#e_c'+i+'_freq').value.trim(), times:$('#e_c'+i+'_times').value.trim()};
    if(cp) o.prompt=cp;
    ch.push(o);
  }
  r.changes=ch;
  r.prompt=$('#e_prompt').value.trim();
  const bad=ch.find(c=>!/\d{4}\/\d{1,2}\/\d{1,2}/.test(c.cond));
  const d=calcNextFire(r); r.nextFire = d?fmtFire(d):null;
  save(); closeSheet(); render();
  toast(bad?'保存しました(日付のない頻度変更は無視されます)':'保存しました');
}
function logRem(id,type){ const r=DB.reminders.find(x=>x.id===id); r.log.unshift({d:fmtToday(),type}); save(); closeSheet(); toast('記録しました'); }
function togglePause(id){ const r=DB.reminders.find(x=>x.id===id); r.paused=!r.paused; save(); closeSheet(); render(); toast(r.paused?'休止しました':'再開しました'); }
function delReminder(id){
  const r=DB.reminders.find(x=>x.id===id); const n=(r&&r.log&&r.log.length)||0;
  askConfirm({title:'リマインダーを削除', body:`「${r?r.title:''}」を削除します。\n\n経過履歴${n}件も削除されます。関連するメモ・注目ポイントは削除されません。`, okLabel:'削除する', danger:true, onOk:()=>{
    DB.reminders=DB.reminders.filter(x=>x.id!==id); save(); render(); toast('削除しました');
  }});
}
function fmtNum(v){ const s=String(v).replace(/,/g,''); if(!/^-?\d+(\.\d+)?$/.test(s)) return v; const p=s.split('.'); return Number(p[0]).toLocaleString('en-US')+(p[1]?'.'+p[1]:''); }
// ===== 次回発火日時の計算 =====
// 頻度変更(条件日付)を考慮し、指定時点で有効な頻度定義を返す
// 現時点で適用される実行プロンプト(頻度変更で切り替わる)
function activePrompt(r, at){
  const now=at||new Date();
  let text=r.prompt||'', label='';
  (r.changes||[]).forEach((c,i)=>{
    const m=String(c.cond||'').match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
    if(!m) return;
    const d=new Date(+m[1], +m[2]-1, +m[3]);
    if(now>=d && c.prompt){ text=c.prompt; label='変更'+(i+1)+'適用中'; }
  });
  return {text, label};
}
function activeSchedule(r, at){
  let freq=r.freq, times=r.times||[];
  (r.changes||[]).forEach(c=>{
    const m=String(c.cond||'').match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
    if(!m) return;
    const d=new Date(+m[1], +m[2]-1, +m[3]);
    if(at>=d){ // 条件日を過ぎていれば適用(後の変更ほど優先)
      if(c.freq) freq=c.freq;
      if(c.times) times=String(c.times).split(',').map(x=>x.trim()).filter(Boolean);
    }
  });
  return {freq, times};
}
function matchFreq(freq, d){
  const w=d.getDay(); // 0=日
  if(/毎時間/.test(freq)) return true;
  if(/毎日/.test(freq)) return true;
  if(/平日/.test(freq)) return w>=1&&w<=5;
  if(/土日/.test(freq)) return w===0||w===6;
  if(/週次/.test(freq)){
    const m=String(freq).match(/[（(]([日月火水木金土])[）)]/);
    if(!m) return w===1; // 曜日指定なしは月曜
    return ['日','月','火','水','木','金','土'].indexOf(m[1])===w;
  }
  if(/月次/.test(freq)){
    const m=String(freq).match(/(\d{1,2})日/);
    return m ? d.getDate()===+m[1] : d.getDate()===1;
  }
  if(/単発/.test(freq)){
    const m=String(freq).match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
    if(!m) return false;
    return d.getFullYear()===+m[1] && d.getMonth()===+m[2]-1 && d.getDate()===+m[3];
  }
  return false;
}
// 現在時刻以降の最初の発火日時を返す(最大400日先まで探索)。開始日(startDate)前は発火しない。
function calcNextFire(r, from){
  const now=from||new Date();
  const st=r.startDate?parseD(r.startDate):null;
  const en=r.endDate?parseD(r.endDate):null;
  if(en && now>new Date(en.getFullYear(),en.getMonth(),en.getDate(),23,59)) return null;
  // 探索の起点は「今」と「開始日」の遅い方
  const base=(st&&st>now)?st:now;
  for(let i=0;i<400;i++){
    const d=new Date(base.getFullYear(), base.getMonth(), base.getDate()+i);
    if(st && d<new Date(st.getFullYear(),st.getMonth(),st.getDate())) continue;
    if(en && d>new Date(en.getFullYear(),en.getMonth(),en.getDate())) return null;
    const sch=activeSchedule(r, d);
    if(!matchFreq(sch.freq, d)) continue;
    let times=(sch.times&&sch.times.length?sch.times:['09:00']).slice().sort();
    if(/毎時間/.test(sch.freq)){
      // 「9:00-15:00」形式ならその時間帯、単一時刻なら以降その日の終わりまで、指定なしは9-15時
      const rg=String(sch.times&&sch.times[0]||'').match(/(\d{1,2}):(\d{2})\s*[-〜~]\s*(\d{1,2}):(\d{2})/);
      const sH=rg?+rg[1]:9, eH=rg?+rg[3]:15, mn=rg?rg[2]:'00';
      times=[]; for(let hh=sH; hh<=eH; hh++) times.push(String(hh).padStart(2,'0')+':'+mn);
    }
    for(const tm of times){
      const mm=String(tm).match(/(\d{1,2}):(\d{2})/); if(!mm) continue;
      const cand=new Date(d.getFullYear(), d.getMonth(), d.getDate(), +mm[1], +mm[2]);
      if(cand>now && (!st || cand>=st)) return cand;
    }
  }
  return null;
}
function fmtFire(d){
  if(!d) return '—';
  const wd=['日','月','火','水','木','金','土'][d.getDay()];
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}(${wd}) ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function refreshFires(){ (DB.reminders||[]).forEach(r=>{ if(r.paused){ r.nextFire=null; return; } const d=calcNextFire(r); r.nextFire = d? fmtFire(d) : null; }); }
function toISO(s){ const d=parseD(s); if(!d) return ''; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fromISO(s){ const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); if(!m) return ''; return `${+m[1]}/${+m[2]}/${+m[3]}`; }
function fmtToday(){ const d=today(); return `2026/${d.getMonth()+1}/${d.getDate()}`; }

//////////////////// HYPO ////////////////////
// 注目ポイントに紐づくリマインダー
function remindersOf(hid){ return (DB.reminders||[]).filter(r=>(r.hypoIds||[]).includes(hid)); }
// 日付候補を持つのにリマインダー未登録の注目ポイント(＝まだ予定になっていないもの)
function pendingHints(){
  return (DB.hypotheses||[]).filter(h=>h.kind==='watch' && h.remindHint && h.remindHint.date && !remindersOf(h.id).length)
    .sort((a,b)=>(parseD(a.remindHint.date)||0)-(parseD(b.remindHint.date)||0));
}
function hypoMiniCard(hh){
  const isMemo=hh.kind==='memo';
  const rms=remindersOf(hh.id);
  const hint=(!isMemo && !rms.length && hh.remindHint && hh.remindHint.date)?hh.remindHint:null;
  // 日付の扱いはリマインダーに一本化しているので、ここでは「登録済みか/未登録か」だけを見せる
  let status='';
  if(rms.length) status=`<span class="meta" style="color:var(--navy);font-weight:600">🔔 次回 ${esc(fmtFire(calcNextFire(rms[0])))}${rms.length>1?` 他${rms.length-1}件`:''}</span>`;
  else if(hint) status=`<span class="chip amber">リマインド未登録</span>`;
  return `<div class="list-row" style="align-items:flex-start" onclick="sheetEditHypo('${hh.id}')">
    <div class="lt">
      <div class="row" style="justify-content:flex-start;gap:8px">
        <span class="chip ${isMemo?'gray':'amber'}">${isMemo?'メモ':'注目'}</span>${status}
      </div>
      <div class="clip2" style="margin-top:4px;font-size:13px;white-space:pre-wrap">${esc(hh.text)}</div>
    </div>
    <span class="rt" style="padding-top:4px"><span class="arrow">›</span></span>
  </div>`;
}
function addRemForHypo(hid){ const hh=DB.hypotheses.find(x=>x.id===hid); if(!hh)return; STATE._triageItems=null; STATE.remHypoIds=[hid]; STATE.remStockId=hh.stockId; STATE._remFromStock=true; closeSheet(); sheetAddReminder(hh.stockId, [hid]); }
// 取り込み直後に「イベント日つき注目ポイント」をまとめて確認する一覧シート。
// 同じイベント日(同じ決算など)のものは1グループにまとめ、1つのリマインダーで確認できるようにする。
function sheetReminderTriage(items, sid){
  STATE._triageItems=items; STATE._triageSid=sid;
  // 全件さばき終えた(またはすべて×で消した)らシートを閉じる。
  // 閉じずにreturnすると、消したはずの項目が残って見える
  if(!items || !items.length){ STATE._triageItems=null; closeSheet(); return; }
  const groups={};
  items.forEach(it=>{ (groups[it.eventDate]=groups[it.eventDate]||[]).push(it); });
  const days=Object.keys(groups).sort((a,b)=>(parseD(a)||0)-(parseD(b)||0));
  let h=`<h3>リマインダーを登録</h3>
    <div class="muted" style="margin-bottom:10px">日付つきの注目ポイントが取り込まれました。日付はリマインダーで管理します。同じ日のものは1つのリマインダーにまとめられます。</div>`;
  days.forEach(d=>{
    const g=groups[d];
    h+=`<div class="card" style="padding:10px 12px;margin-bottom:9px">
      <div class="row"><span class="chip navy">${esc(d)}</span><span class="muted" style="font-size:11px">${g.length}件</span></div>`;
    g.forEach(it=>{
      h+=`<div class="row" style="align-items:flex-start;gap:8px;margin-top:7px">
        <div class="clip3" style="flex:1;font-size:12px">${esc(it.text)}</div>
        <span class="del" onclick="triageRemove('${it.id}')">×</span>
      </div>`;
    });
    h+=`<button class="btn sm" style="margin-top:9px;width:auto" onclick="triageAddReminder('${escArg(d)}')">${g.length>1?`この日の${g.length}件をまとめてリマインダー登録`:'リマインダーを登録'}</button>
    </div>`;
  });
  h+=`<button class="btn ghost" style="margin-top:4px" onclick="STATE._triageItems=null;closeSheet();">あとで登録する</button>`;
  openSheet(h);
}
function triageRemove(id){
  STATE._triageItems=(STATE._triageItems||[]).filter(x=>x.id!==id);
  sheetReminderTriage(STATE._triageItems, STATE._triageSid);
}
// 同じイベント日の注目ポイントをまとめて1つのリマインダーに紐づける
function triageAddReminder(day){
  const g=(STATE._triageItems||[]).filter(x=>x.eventDate===day);
  if(!g.length) return;
  const ids=g.map(x=>x.id);
  STATE.remHypoIds=ids; STATE.remStockId=STATE._triageSid; STATE._remFromStock=true;
  closeSheet(); sheetAddReminder(STATE._triageSid, ids);
}
function sheetEditHypo(hid, sid, forceKind){
  const hh=hid?DB.hypotheses.find(x=>x.id===hid):null;
  const s=stock(hh?hh.stockId:sid);
  const kind=hh?hh.kind:(forceKind||'memo');
  const isMemo=kind==='memo';
  let h=`<h3>${hh?(isMemo?'メモを編集':'注目ポイントを編集'):(isMemo?'メモを作成':'注目ポイントを作成')}</h3>
    <div class="muted" style="margin-bottom:10px">${esc(s.name)}</div>
    <label class="fld"><span class="t">${isMemo?'メモ(気づき・違和感・自分の判断)':'注目ポイント(何がどうなったら良い/悪いか)'}</span><textarea id="hy_text" style="min-height:70px" placeholder="${isMemo?'例: DC向けの需給が本丸。古河電工とペアで見る。':'例: データセンター向け光ケーブル需要が続伸するか。DC事業者のCAPEXが鈍化したら要警戒。'}">${esc(hh?hh.text:'')}</textarea></label>`;
  // 日付欄はここには置かない。日付を持たせる＝リマインダー登録なので、保存後に登録シートへ誘導する
  const rms=hid?remindersOf(hid):[];
  if(!isMemo){
    h+=`<div class="muted" style="font-size:11px;margin:-4px 0 10px">日付で思い出したい場合は、保存後に「リマインダーを登録」してください。</div>`;
    // 登録済みのリマインダーはここから開けるようにする(一覧の行からボタンを外した分の受け皿)
    if(rms.length) h+='<div class="list">'+rms.map(r=>`<div class="list-row" onclick="openReminder('${r.id}')"><div class="lt"><div class="ttl">🔔 ${esc(r.title||'リマインダー')}</div><div class="meta">次回 ${esc(fmtFire(calcNextFire(r)))}</div></div><span class="rt"><span class="arrow">›</span></span></div>`).join('')+'</div>';
  }
  h+=`<button class="btn pri" onclick="saveHypo('${hh?hh.id:''}','${s.id}','${kind}')">保存</button>
    ${isMemo?'':`<button class="btn" style="margin-top:8px" onclick="saveHypo('${hh?hh.id:''}','${s.id}','${kind}',true)">保存して${rms.length?'リマインダーを追加':'リマインダーを登録'}</button>`}
    ${hid?`<button class="btn danger" style="margin-top:8px" onclick="delHypo('${hid}')">削除</button>`:''}
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet();openStock('${s.id}')">キャンセル</button>`;
  openSheet(h);
}
function saveHypo(hid, sid, kind, thenRemind){
  const text=$('#hy_text').value.trim();
  if(!text){ toast('内容を入力してください'); return; }
  let id=hid;
  if(hid){
    const hh=DB.hypotheses.find(x=>x.id===hid);
    hh.text=text;
  } else {
    id='h'+Date.now();
    DB.hypotheses.push({id, stockId:sid, kind:kind||'memo', text});
  }
  if(thenRemind){ save(); closeSheet(); addRemForHypo(id); return; }
  // 保存したらシートを閉じる。閉じないと同じ画面のまま保存を再度押せてしまい、
  // 新規作成の場合は同じ内容が二重に登録されてしまう
  save(); closeSheet(); openStock(sid); toast('保存しました');
}
function delHypo(hid){
  const hh=DB.hypotheses.find(x=>x.id===hid); if(!hh) return;
  askConfirm({title:'削除', body:hh.text.slice(0,80)+(hh.text.length>80?'…':''), okLabel:'削除する', danger:true, onOk:()=>{
    const sid=hh.stockId; DB.hypotheses=DB.hypotheses.filter(x=>x.id!==hid); save(); openStock(sid); toast('削除しました');
  }});
}

//////////////////// SHEETS ////////////////////
// ブラウザのconfirm()はSafariの「今後表示しない」で無効化されるため、アプリ内シートで確認する
function askConfirm(opts){
  const o=Object.assign({title:'確認', body:'', okLabel:'OK', danger:false, onOk:null}, opts||{});
  window._confirmOk=o.onOk;
  openSheet(`<h3>${esc(o.title)}</h3>
    <div class="card" style="white-space:pre-wrap;font-size:13px;line-height:1.6">${esc(o.body)}</div>
    <button class="btn ${o.danger?'danger':'pri'}" style="margin-top:12px" onclick="runConfirm()">${esc(o.okLabel)}</button>
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">キャンセル</button>`);
}
function runConfirm(){ const f=window._confirmOk; window._confirmOk=null; closeSheet(); if(typeof f==='function') setTimeout(f,60); }
// 全シート共通で右上に閉じるボタンを出す。背景タップに気づかない場合の逃げ道として、個々のシート側では実装しない
function openSheet(html){
  $('#sheet').innerHTML='<button class="sheet-close" onclick="requestCloseSheet()" aria-label="閉じる">✕</button>'+html;
  $('#sheet').style.transform='';
  $('#scrim').classList.add('show');
  $('#edgeSwipeZone').classList.add('show');
  STATE._sheetSnap=sheetSnapshot();
}
function closeSheet(){ $('#scrim').classList.remove('show'); $('#edgeSwipeZone').classList.remove('show'); $('#exitConfirm').classList.remove('show'); $('#sheet').style.transform=''; STATE._sheetSnap=undefined; }
// シート内の自由入力(テキスト)だけを対象に、開いた時点からの変更有無を見る。
// セレクト/チェックボックスだけの画面(メニューや確認ダイアログ)は対象にならず、常に即閉じでよい
function sheetSnapshot(){
  return [...document.querySelectorAll('#sheet textarea, #sheet input[type="text"], #sheet input:not([type])')].map(e=>e.value).join('␟');
}
function sheetDirty(){ return STATE._sheetSnap!==undefined && sheetSnapshot()!==STATE._sheetSnap; }
// ✕・背景タップ・エッジスワイプの3つの「閉じる」入口はすべてここを通す。
// save()後などアプリ側から明示的に閉じる場合はcloseSheet()を直接呼ぶので、この確認は挟まらない
function requestCloseSheet(){
  if(sheetDirty()){ $('#exitConfirm').classList.add('show'); }
  else { closeSheet(); }
}
function cancelCloseSheet(){ $('#exitConfirm').classList.remove('show'); $('#sheet').style.transform=''; }
function confirmCloseSheet(){ $('#exitConfirm').classList.remove('show'); closeSheet(); }
// 右エッジからのスワイプでシートを閉じる(ブラウザの戻るジェスチャーに合わせる)。
// 判定域(#edgeSwipeZone、左端30%)は広めなので、単なるタップやシートの縦スクロールを
// 巻き込まないよう、動き出しで「横方向のドラッグか」を見極めてから初めて介入する。
// タップ/縦スクロールと判定した場合は、帯の下にある本来の要素に処理を渡す
(function(){
  const THRESH=70, DECIDE=10;
  let sx=0, sy=0, lastY=0, state='idle'; // idle|pending|swipe|scroll
  let tapTarget=null;
  const zone=$('#edgeSwipeZone'), sheet=$('#sheet');
  function underneath(x,y){
    zone.style.pointerEvents='none';
    const el=document.elementFromPoint(x,y);
    zone.style.pointerEvents='';
    return el;
  }
  zone.addEventListener('touchstart', e=>{
    if($('#exitConfirm').classList.contains('show')) return;
    const t=e.touches[0];
    sx=t.clientX; sy=lastY=t.clientY; state='pending';
    tapTarget=underneath(sx, sy);
  }, {passive:true});
  zone.addEventListener('touchmove', e=>{
    if(state==='idle') return;
    const t=e.touches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
    if(state==='pending'){
      if(Math.abs(dx)<DECIDE && Math.abs(dy)<DECIDE) return; // タップかどうかまだ様子見
      state=(dx>0 && Math.abs(dx)>Math.abs(dy)) ? 'swipe' : 'scroll';
    }
    if(state==='swipe'){ sheet.style.transform=`translateX(${dx}px)`; if(e.cancelable) e.preventDefault(); }
    else if(state==='scroll'){ sheet.scrollTop-=(t.clientY-lastY); if(e.cancelable) e.preventDefault(); }
    lastY=t.clientY;
  }, {passive:false});
  zone.addEventListener('touchend', ()=>{
    if(state==='pending' && tapTarget) tapTarget.dispatchEvent(new MouseEvent('click', {bubbles:true, cancelable:true}));
    if(state==='swipe'){
      const m=sheet.style.transform.match(/translateX\(([\d.]+)px\)/); const dx=m?parseFloat(m[1]):0;
      sheet.style.transition='transform .15s ease-out'; sheet.style.transform='translateX(0)';
      setTimeout(()=>{ sheet.style.transition=''; }, 150);
      if(dx>THRESH) requestCloseSheet();
    }
    state='idle'; tapTarget=null;
  }, {passive:true});
})();
