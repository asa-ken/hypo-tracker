<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>仮説トラッカー プロトタイプ</title>
<style>
  :root{
    --bg:#eef0f2; --app:#f7f8f9; --card:#ffffff; --line:#e2e5e8; --line2:#cbd0d5;
    --ink:#1e2933; --ink2:#5a6672; --ink3:#8b95a1;
    --navy:#123a5e; --navy-bg:#e8eff5; --navy-tx:#123a5e;
    --amber-bg:#fbf0da; --amber-tx:#8a5a12;
    --green-bg:#e5f1df; --green-tx:#356124;
    --red-bg:#fbe6e4; --red-tx:#9c3329;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    /* 余白は 4 / 8 / 12 / 16 の4段階に揃える。中途半端な値を足すとカードごとに詰まり方が変わる */
    --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px;
  }
  /* 文字サイズは次の6段階だけを使う。増やさないこと。
       11px … 日付・単位・補足(最小)
       12px … 補助テキスト
       13px … 本文
       15px … 強調・小見出し
       17px … 画面タイトル・指標の数値
       16px … 入力欄専用(iOSは16px未満の入力にフォーカスすると自動でズームするため下げない)
     通勤中にスマホで読む前提なので、10px以下は使わない。 */
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); font-family:"Hiragino Sans","Yu Gothic",system-ui,sans-serif; color:var(--ink); line-height:1.6;}
  .phone{max-width:430px; margin:0 auto; min-height:100vh; background:var(--app); position:relative; display:flex; flex-direction:column;}
  /* header */
  .top{position:sticky; top:0; z-index:20; background:var(--app); border-bottom:1px solid var(--line); padding:14px 16px 10px; display:flex; align-items:center; justify-content:space-between;}
  .top h1{font-size:17px; font-weight:700; margin:0; letter-spacing:.01em;}
  .top .sub{font-size:11px; color:var(--ink3); font-weight:400;}
  .top .act{font-size:13px; color:var(--navy); font-weight:600; cursor:pointer; border:none; background:none; display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 2px;}
  /* scroll body */
  /* 横方向のドラッグはアプリ側(詳細画面の戻るスワイプ)で使うので、ブラウザに渡さない。
     横スクロールする部品(.pages / .xscroll)だけ touch-action を戻す */
  .body{flex:1; position:relative; z-index:1; background:var(--app); overflow-y:auto; padding:14px 16px calc(90px + env(safe-area-inset-bottom)); touch-action:pan-y pinch-zoom;}
  /* 戻るスワイプの下敷き。#view と同じ位置・大きさに JS で合わせる */
  /* 位置と大きさ(left/width/top/height)はJSでビューポートに合わせる。
     以前は #view(＝中身の高さまで伸びる箱)に合わせていたため、詳細が長い・スクロール
     している状態だと下敷きが画面からずれ、上下に余白が出て全画面に広がらなかった */
  .back-prev{position:fixed; z-index:0; display:none; overflow:hidden; padding:14px 16px calc(90px + env(safe-area-inset-bottom)); background:var(--app); opacity:.5; pointer-events:none;}
  .back-prev.show{display:block;}
  .xscroll{overflow-x:auto; touch-action:manipulation;}
  /* bottom tab */
  /* sticky ではなく fixed で画面(ビューポート)に直接固定する。
     .phone の横幅指定(max-width:430px + margin:0 auto)を、fixed要素側でも再現する必要がある。
     さらに iOS の WebKit は、指でスクロールしている最中に fixed 要素の再描画が追いつかず、
     一瞬コンテンツと一緒にずれて見える古い既知の不具合がある(fixedであること自体では防げない)。
     translate3d/backface-visibility/will-change で強制的にGPUの独立レイヤーに乗せ、
     スクロールの再描画から切り離すのが定番の回避策 */
  .tabbar{position:fixed; left:50%; bottom:0; transform:translate3d(-50%,0,0); -webkit-backface-visibility:hidden; backface-visibility:hidden; will-change:transform; width:100%; max-width:430px; z-index:20; background:var(--card); border-top:1px solid var(--line); display:flex; padding:6px 4px calc(8px + env(safe-area-inset-bottom));}
  /* A1: 選択中のタブは文字色だけでなく薄紺のピルで囲む。
     色の差だけだと「今どこにいるか」が弱く、画面が切り替わった感覚が出なかった */
  .tabbar button{flex:1; margin:0 2px; border:none; background:none; border-radius:10px; display:flex; flex-direction:column; align-items:center; gap:4px; padding:6px 4px; cursor:pointer; color:var(--ink3); font-size:11px; font-weight:600; transition:background .15s, color .15s;}
  .tabbar button.on{color:var(--navy-tx); background:var(--navy-bg);}
  @media (prefers-reduced-motion: reduce){ .tabbar button{transition:none;} }
  .tabbar .ic{width:22px; height:22px; display:block;}
  /* components */
  .card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 14px; margin-bottom:11px;}
  .card.tap{cursor:pointer;} .card.tap:active{background:#fafbfc;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .chip{display:inline-block; font-size:11px; font-weight:600; padding:2px 9px; border-radius:9px; white-space:nowrap;}
  .chip.navy{background:var(--navy-bg); color:var(--navy-tx);}
  .chip.amber{background:var(--amber-bg); color:var(--amber-tx);}
  .chip.green{background:var(--green-bg); color:var(--green-tx);}
  .chip.red{background:var(--red-bg); color:var(--red-tx);}
  .chip.gray{background:var(--bg); color:var(--ink2); border:1px solid var(--line);}
  .chip.tap{display:inline-flex; align-items:center; min-height:36px; padding:2px 12px; cursor:pointer;}
  .muted{color:var(--ink3); font-size:12px;}
  /* 画面の区切り。以前は11pxのグレーで本文より弱く、どこからどこまでが一塊か読み取れなかった */
  .lbl{font-size:12px; color:var(--ink2); font-weight:700; letter-spacing:.02em; margin:20px 0 8px;}
  .lbl:first-child{margin-top:2px;}
  /* 開閉できる区切り。見出し全体がタップ領域になる。
     区分の間に細い線を1本引き、中身は字下げで表す(行ごとの線やアクセントバーは引かない)。
     線が増えるほど画面がうるさくなるので、線は「区分の変わり目」だけに絞る */
  .lbl.grp{display:flex; align-items:center; justify-content:space-between; min-height:52px; margin:0; border-top:1px solid var(--line); font-size:13px; color:var(--ink); cursor:pointer; user-select:none;}
  .lbl.grp:first-child{border-top:none;}
  .lbl.grp:active{color:var(--navy);}
  /* 開閉しない区分見出し(分析・メモ・注目ポイントなど)。畳める見出しと同じ層なので、
     大きさ・色・区切り線は揃え、矢尻が無いことだけが違いになるようにする */
  .lbl.head{display:flex; align-items:center; justify-content:space-between; min-height:52px; margin:0;
            border-top:1px solid var(--line); font-size:13px; color:var(--ink);}
  .lbl.head:first-child{border-top:none;}
  /* 「編集」を添えた開閉見出し。編集リンクは見出しのタップ(開閉)とは別の行き先なので、
     取り違えないように離す:
      ・矢尻は22pxしかないので44pxの枠で包む(右端を狙えば必ず開閉になる)
      ・編集も44pxの枠を持たせ、その間に16px空ける
      ・間の余白は見出し側の判定に入る。押し間違えても、開くだけで済むほうへ倒す */
  .lbl.grp .grp-right{display:inline-flex; align-items:center; gap:16px; flex:none;}
  .lbl.grp .grp-edit{color:var(--navy); font-weight:600; display:inline-flex; align-items:center; justify-content:center; min-width:44px; min-height:44px; padding:0 8px;}
  .lbl.grp .grp-caret{display:inline-flex; align-items:center; justify-content:flex-end; width:44px; min-height:44px;}
  .lbl.grp:active .grp-edit{color:var(--navy);}
  /* タップで下に展開する場所は、どこでも同じ矢尻で示す。
     閉じている＝下向き(これから下に開く) / 開いている＝上向き(たたむと上に閉じる) */
  .caret{width:22px; height:22px; flex:none; color:var(--ink2); transition:transform .15s;}
  .caret.open{transform:rotate(180deg);}
  @media (prefers-reduced-motion: reduce){ .caret{transition:none;} }
  /* 分析の大カテゴリだけは別の記号。閉じているときは＋、開くと45°回って×になる。
     区分見出し(矢尻)の中身であって、開く方向を示す場所ではないので記号を分ける */
  .plusmark{width:22px; height:22px; flex:none; color:var(--ink2); transition:transform .18s, color .18s;}
  .sec.open .h .plusmark{transform:rotate(45deg); color:var(--navy);}
  @media (prefers-reduced-motion: reduce){ .plusmark{transition:none;} }
  h2.blk{font-size:13px; font-weight:700; margin:0 0 3px;}
  /* 「対応が必要」など、いま見てほしいものだけ地色を変える。
     全部が同じ白カードだと重要度の差が出ず、目がどこにも止まらない */
  .card.attn{background:var(--navy-bg); border-color:#cfdde8;}
  /* 一覧は「カードを積む」のではなく「1枚の枠に行を並べる」。
     カード1件ごとに影と余白が付くと、件数が増えたときに全部が同じ強さで主張してしまう */
  .list{background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; margin-bottom:var(--sp3);}
  .list-row{display:flex; align-items:center; justify-content:space-between; gap:var(--sp3); padding:11px 14px; min-height:44px; cursor:pointer; border-top:1px solid var(--line);}
  .list-row:first-child{border-top:none;}
  .list-row:active{background:var(--navy-bg);}
  .list-row .lt{min-width:0; flex:1;}
  /* .list.flat: 区分の中身として並ぶ一覧。白カード・枠線・区切り線を持たず、
     字下げだけで「見出しの下にぶら下がっている」ことを示す。
     まだ中身が無いカードだけ文字を薄く細くして、状態の手がかりを残す */
  .list.flat{background:none; border:none; border-radius:0; overflow:visible;}
  .list.flat .list-row{border-top:none; padding:9px 0 9px 20px;}
  .list.flat .list-row:not(.filled) .ttl{font-weight:400; color:var(--ink3);}
  .list-row .ttl{font-size:13px; font-weight:600; line-height:1.4;}
  .list-row .meta{font-size:11px; color:var(--ink3); margin-top:1px;}
  .list-row .rt{display:flex; align-items:center; gap:var(--sp2); font-size:12px; color:var(--ink2); white-space:nowrap; flex:none;}
  .list-row .arrow{color:var(--ink3); font-size:15px;}
  /* メモ・注目ポイントの行を右→左スワイプで削除できるようにする帯。
     .list-row 自体はそのまま使い、区切り線(border-top)だけをこの帯側に付け替える
     (行を .swipe で包むと .list-row:first-child がすべての行にマッチしてしまうため) */
  .list .swipe{border-top:1px solid var(--line);}
  .list .swipe:first-child{border-top:none;}
  .list .swipe .list-row{border-top:none; position:relative; z-index:1; background:var(--card);}
  /* .list.cards: 1枚ずつ独立した白いカードとして並べる。
     外枠で全体を囲って区切り線で割るより、線を一切引かず地色の隙間で
     切れ目を作るほうが軽く見える。隙間は地色をそのまま透かす */
  .list.cards{background:none; border:none; border-radius:0; overflow:visible;
              display:flex; flex-direction:column; gap:var(--sp1);}
  .list.cards .swipe{border-top:none; border-radius:12px;}
  .list.cards .swipe .list-row{border-radius:12px;}
  /* タップ領域は44px以上を下限にする(iOS/Androidの推奨値)。
     以前は33pxのボタンが並び、親指では隣を押しやすい状態だった。
     例外は文章に紛れるチップ・リンクで、そこは36px以上とする */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--line2); background:var(--card); color:var(--ink); border-radius:9px; padding:10px 14px; min-height:44px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; width:100%;}
  .btn:active{background:#f0f2f4;}
  .btn.pri{background:var(--navy); border-color:var(--navy); color:#fff;}
  .btn.sm{padding:7px 11px; font-size:12px; width:auto;}
  .btn.ghost{border-color:transparent; color:var(--ink3);}
  .btn.danger{color:var(--red-tx); border-color:var(--red-bg);}
  input,textarea,select{width:100%; max-width:100%; min-width:0; box-sizing:border-box; border:1px solid var(--line2); border-radius:9px; padding:10px 12px; font-size:16px; font-family:inherit; color:var(--ink); background:var(--card); margin-top:4px;}
  /* 日付・時刻の入力(特にtime)はブラウザ標準UIの内部幅が広く、通常のpaddingだと外枠をはみ出すことがあるため詰める */
  input[type="date"],input[type="time"]{padding:10px 6px;}
  /* 入力欄を16pxに上げた分、60pxだとplaceholderの末尾が切れるので余裕を持たせる */
  textarea{resize:vertical; min-height:84px;}
  textarea.mono{font-family:var(--mono); font-size:12px; line-height:1.6;}
  label.fld{display:block; margin-bottom:11px;}
  label.fld .t{font-size:12px; color:var(--ink2); font-weight:600;}
  .seg{display:flex; border:1px solid var(--line2); border-radius:9px; overflow:hidden; margin-top:4px;}
  .seg button{flex:1; border:none; background:var(--card); padding:8px; min-height:44px; font-size:13px; color:var(--ink2); cursor:pointer; font-family:inherit; font-weight:600;}
  .seg button.on{background:var(--navy); color:#fff;}
  table{width:100%; border-collapse:collapse; font-size:12px; margin-top:4px;}
  th{text-align:left; font-size:11px; color:var(--ink3); font-weight:600; padding:4px 6px; border-bottom:1px solid var(--line);}
  td{padding:6px; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.5;}
  /* 表示に選んだのに数値がまだ無い指標。枠は出したうえで「データなし」と言葉で書く。
     グラフは一面に、表は年度のセルをまとめて1つに(セル結合のような見せ方) */
  .nodata{display:flex; align-items:center; justify-content:center; border:1px dashed var(--line2); border-radius:9px; background:var(--app); color:var(--ink3); font-size:13px;}
  .nodata-cell{text-align:center; color:var(--ink3); background:var(--app);}
  /* 業績推移の表とグラフの対応づけ。行のどこを押してもその指標のグラフに切り替わる。
     いまグラフに出ている行は地色を変えて、表とグラフのどちらを見ていても対応が分かるようにする */
  /* 行がタップ対象になったので、行の高さを44pxまで広げる。
     押せない行(グラフに出していない指標)だけ低いと表が不揃いになるので、表ごと広げる */
  table.trend td{padding:13px 6px;}
  tr.trend-tap{cursor:pointer;}
  tr.trend-tap:active td{background:var(--navy-bg);}
  tr.trend-tap.on td{background:var(--navy-bg);}
  tr.trend-tap.on td:first-child{color:var(--navy-tx); font-weight:700;}
  /* グラフに出していない指標。押すと理由が出るが、押す前から見分けが付くようにしておく */
  tr.trend-tap.no-chart td:first-child{color:var(--ink2);}
  .empty-row td:first-child{color:var(--ink3); font-weight:400;}
  .val-up{color:var(--green-tx); font-weight:700;}
  .val-dn{color:var(--red-tx); font-weight:700;}
  .val-old{color:var(--ink3); text-decoration:line-through;}
  tr.newrow td{background:var(--green-bg);}
  /* 3列だと1セル約95pxしかなく、指標名がほぼ必ず2〜3行に折り返して読めなかったので2列にする */
  .metric{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp2);}
  .metric .m{background:var(--app); border:1px solid var(--line); border-radius:9px; padding:8px 10px;}
  .metric .m .k{font-size:11px; color:var(--ink3);}
  .metric .m .v{font-size:17px; font-weight:700; margin-top:1px;}
  .metric .m .d{font-size:11px; color:var(--ink3); margin-top:1px;}
  .metric .m.stale{background:var(--amber-bg); border-color:var(--amber-bg);}
  .metric .m.stale .k,.metric .m.stale .v,.metric .m.stale .d{color:var(--amber-tx);}
  /* 分析の大カテゴリ。一覧の区分見出し(.lbl.grp)と同じ表し方に揃える:
     カードの外枠で囲わず、区分の間に細い線を1本引き、開いた中身は字下げだけで表す */
  .sec .h{display:flex; justify-content:space-between; align-items:center; min-height:52px; cursor:pointer; user-select:none; font-size:13px; font-weight:700; color:var(--ink); border-top:1px solid var(--line); transition:color .15s;}
  .sec .h:active{color:var(--navy);}
  /* .sec はDOMのクラス付け替えだけで開閉する(再描画しない)ので、矢尻の向きはCSS側で持つ */
  .sec .h .caret{transform:none;}
  .sec.open .h .caret{transform:rotate(180deg);}
  .sec .b{display:none; padding:0 0 10px; font-size:13px; color:var(--ink2);}
  .sec.open .b{display:block;}
  @media (prefers-reduced-motion: reduce){ .sec .h{transition:none;} }
  .mine{border-left:3px solid var(--navy); background:var(--navy-bg); border-radius:0 8px 8px 0; padding:9px 11px; margin-top:4px;}
  .mine .row2{font-size:12px; color:var(--navy-tx);} .mine .ts{font-size:11px; color:var(--navy); opacity:.7;}
  .empty{text-align:center; padding:40px 20px; color:var(--ink3);}
  .empty .big{font-size:15px; font-weight:600; color:var(--ink2); margin-bottom:6px;}
  /* 分析項目の行(タップで概要/詳細スワイプシートを開く)。
     小項目は「大項目を開いた中身」であって独立したカードではないので、白背景も区切り線も持たせず
     ページ地色に沈める。白いカードとして浮くのは大項目だけになり、
     開いた塊と次の大項目の切れ目がはっきりする */
  .sub-row{display:flex; align-items:center; justify-content:space-between; gap:var(--sp2); padding:9px 0 9px 20px; min-height:44px; font-size:12px; cursor:pointer;}
  .sub-row:active{background:var(--navy-bg);}
  /* 取り込み済みなら濃く、まだ空なら薄く細く。一覧(.list.flat)と同じ表し方 */
  .sub-row .name{color:var(--ink); font-weight:600;}
  .sub-row:not(.filled) .name{font-weight:400; color:var(--ink3);}
  .sub-row .row-right{display:flex; align-items:center; gap:8px;}
  /* 概要/詳細の横スワイプページャー */
  .pager-top{padding:2px 20px 10px; border-bottom:1px solid var(--line); margin-bottom:2px;}
  .pager-top .ti{font-size:15px; font-weight:700;}
  .pager-top .cat{font-size:11px; color:var(--ink3); margin-top:1px;}
  .pages-wrap{position:relative;}
  .pages{display:flex; overflow-x:auto; touch-action:manipulation; scroll-snap-type:x mandatory; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .pages::-webkit-scrollbar{display:none;}
  .page{flex:0 0 100%; scroll-snap-align:start; padding:14px 20px; min-height:140px;}
  .page.tight{padding:2px 0 4px; min-height:0;}
  .page .kicker{font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--navy-tx); background:var(--navy-bg); display:inline-block; padding:3px 9px; border-radius:8px; margin-bottom:10px;}
  .page .kicker.detail{color:var(--ink2); background:var(--bg); border:1px solid var(--line);}
  .page .txt{font-size:13px; line-height:1.75; white-space:pre-wrap;}
  .page .meta{margin-top:12px; font-size:11px; color:var(--ink3); display:flex; align-items:center; gap:12px; flex-wrap:wrap;}
  .edge-hint{position:absolute; top:0; bottom:0; width:26px; display:flex; align-items:center; font-size:17px; color:var(--navy-tx); pointer-events:none; opacity:0; transition:opacity .2s;}
  .edge-hint.show{opacity:1;}
  .edge-hint.left{left:0; justify-content:flex-start; background:linear-gradient(to right, var(--app) 25%, transparent 100%);}
  .edge-hint.right{right:0; justify-content:flex-end; background:linear-gradient(to left, var(--app) 25%, transparent 100%);}
  .swipecap{font-size:11px; color:var(--ink3);}
  /* 「指標 1/2」のような短いキャプションは、単独行にすると28px使うだけなので送りボタンの行に重ねる。
     「左にスワイプして詳細を見る」のような長い文章は重ねると欠けて読めないため、
     ボタン行の上に独立した行として中央揃えで置く(swipecap-line) */
  .pager-nav .swipecap{position:absolute; left:0; top:50%; transform:translateY(-50%);}
  .swipecap-line{text-align:center; padding:0 0 2px;}
  .pager-nav{position:relative; display:flex; align-items:center; justify-content:center; gap:var(--sp3); padding:6px 0 4px;}
  .dots{display:flex; align-items:center; gap:8px;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--line2); transition:background .15s, transform .15s;}
  .dot.on{background:var(--navy); transform:scale(1.4);}
  @media (prefers-reduced-motion: reduce){ .dot{transition:none;} }
  /* modal */
  .scrim{position:fixed; inset:0; background:rgba(20,30,40,.4); z-index:40; display:none; align-items:flex-end; justify-content:center;}
  .scrim.show{display:flex;}
  .sheet{position:relative; background:var(--app); width:100%; max-width:430px; border-radius:18px 18px 0 0; padding:16px 16px 26px; max-height:88vh; overflow-y:auto;}
  /* 画面端スワイプで閉じるための帯。ここだけtouch-action:pan-yにして、
     ブラウザ自身の「画面端スワイプで戻る」機能に横方向の操作を渡さないようにする。
     判定が狭すぎるとの指摘を受け、左端30%まで広げている */
  .edge-swipe-zone{position:fixed; top:0; bottom:0; left:0; width:30%; z-index:41; touch-action:pan-y; pointer-events:none;}
  .edge-swipe-zone.show{pointer-events:auto;}
  .sheet h3{font-size:15px; font-weight:700; margin:2px 0 12px; text-align:center;}
  /* 背景タップで閉じられるが、それに気づかず「戻れない」と感じる人のための明示的な閉じるボタン */
  .sheet-close{position:absolute; top:4px; right:4px; width:44px; height:44px; border-radius:50%; border:none; background:none; color:var(--ink3); font-size:17px; line-height:1; cursor:pointer; z-index:1;}
  .sheet-close:active{background:var(--line);}
  /* シート内で未保存の変更を破棄してよいか確認するミニダイアログ。#sheetの中身は書き換えずシートの上に重ねる */
  .exit-confirm{position:fixed; inset:0; z-index:50; display:none; align-items:center; justify-content:center; background:rgba(20,30,40,.25);}
  .exit-confirm.show{display:flex;}
  .exit-confirm-card{background:var(--app); border-radius:14px; padding:18px; width:82%; max-width:320px; box-shadow:0 8px 30px rgba(0,0,0,.3);}
  .exit-confirm-msg{font-size:13px; line-height:1.6; margin-bottom:14px;}
  .exit-confirm-row{display:flex; flex-direction:column; gap:8px;}
  .toast{position:fixed; bottom:96px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:12px; padding:9px 16px; border-radius:20px; z-index:60; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%; text-align:center;}
  .toast.show{opacity:1;}
  .hint{font-size:11px; color:var(--ink3); margin-top:4px; line-height:1.5;}
  .failbox{background:var(--amber-bg); border-radius:9px; padding:9px 11px; margin-top:8px;}
  .failbox .t{font-size:12px; color:var(--amber-tx); font-weight:700;}
  .failbox .l{font-family:var(--mono); font-size:11px; color:var(--amber-tx); margin-top:3px; word-break:break-all;}
  /* 取り込みで新しく増える指標の告知。表記揺れは別の指標として登録され、
     グラフも履歴も分かれてしまう。プレビューの表より上に置き、下りる前に目に入るようにする */
  .metwarn{background:var(--amber-bg); border-radius:9px; padding:10px 12px; margin-bottom:11px;}
  .metwarn .t{display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; color:var(--amber-tx);}
  .metwarn .r{background:var(--card); border-radius:8px; padding:7px 9px; margin-top:7px;}
  .metwarn .r .n{font-size:13px; font-weight:700;}
  .metwarn .r .s{font-size:11px; color:var(--amber-tx); margin-top:2px;}
  .metwarn .r .s.plain{color:var(--ink3);}
  .metwarn .d{font-size:11px; color:var(--amber-tx); margin-top:9px; line-height:1.5;}
  .pill-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
  .banner{background:var(--navy-bg); border-radius:9px; padding:10px 12px; font-size:12px; color:var(--navy-tx); margin-bottom:11px; line-height:1.5;}
  /* 上限に当たったことを知らせる注意書き。トーストは数秒で消えるうえ画面の下に出るので、
     押した場所のすぐそばに、消えない形で置く */
  .banner.warn{background:var(--amber-bg); color:var(--amber-tx);}
  .del{color:var(--red-tx); font-size:12px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; min-width:44px; min-height:44px;}
  /* 指標マスターの1行。非表示にしても一覧から動かさず、右端のバッジで今の状態を示す */
  .met-row{display:flex; align-items:center; gap:8px; padding:0 2px; border-bottom:1px solid var(--line);}
  /* 指標名を押すと、まとめる・削除の画面が開く。押せることが分かるように名前のうしろへ
     小さな「…」を添える(矢尻は開閉の意味で使っているので、ここには持ち込まない)。
     行の高さは名前ボタンが決める。44pxを確保し、名前の脇を突いても開くようにする */
  .met-row .nm{flex:1; min-width:0; min-height:44px; font-size:13px; display:flex; align-items:center; gap:8px;
               padding:0; border:none; background:none;
               font-family:inherit; color:inherit; text-align:left; cursor:pointer;}
  .met-row .nm .dots{width:15px; height:15px; flex:none; color:var(--ink3);}
  .met-row .nm:active{color:var(--navy);}
  .met-row.off .nm{color:var(--ink3);}
  /* バッジ自体がボタン。「表示」「非表示」だと押した結果か今の状態か読めないので「〜中」と書く */
  /* 「表示中」と「非表示中」で幅が変わると、切り替えるたびに左の↑↓がずれるので幅を固定する */
  /* 見出しの脇に置く小さな説明ボタン。押すと下に説明が開く */
  .helpq{width:44px; min-height:44px; border:none; background:none; color:var(--navy); font-size:15px; font-weight:700; font-family:inherit; cursor:pointer; padding:0;}
  .helpq:active{opacity:.5;}
  .stat{font-size:11px; font-weight:600; padding:0 8px; min-height:36px; min-width:68px; text-align:center; border-radius:9px; white-space:nowrap;
        border:1px solid var(--line); background:var(--bg); color:var(--ink2); cursor:pointer; font-family:inherit; flex:none;}
  .stat.on{background:var(--navy-bg); border-color:var(--navy-bg); color:var(--navy-tx);}
  .stat:active{opacity:.6;}
  .clip2{display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; line-height:1.5;}
  .clip3{display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; line-height:1.45;}
  .clip3.open{-webkit-line-clamp:unset; overflow:visible;}
  .dbody.open2{display:block !important;}
  .d-del{text-decoration:line-through; color:var(--ink3);}
  .d-add{color:#1257a8; font-weight:600;}
  .difflegend{font-size:11px; color:var(--ink3); margin:2px 0 6px;}
  .difflegend span{margin-right:9px;}
  .swipe{position:relative; overflow:hidden;}
  .swipe .del-btn{position:absolute; right:0; top:0; bottom:0; width:64px; background:var(--red-tx); color:#fff; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; border:none;}
</style>

function insertByDefault(arr, item, defNames, nameOf){
  const name=nameOf(item);
  const di=defNames.indexOf(name);
  if(di<0){ arr.push(item); return; }
  let at=0;
  for(let i=0;i<di;i++){ const j=arr.findIndex(x=>nameOf(x)===defNames[i]); if(j>=0) at=Math.max(at, j+1); }
  arr.splice(at, 0, item);
}
function migrate(db){
  if(!db) return null;

  if(!db.sectionMaster) db.sectionMaster=s0.sectionMaster;
  if(!db.marketSectionMaster) db.marketSectionMaster=s0.marketSectionMaster;
  // 市場マスターの旧名称を平易な名称へ読み替え
  {
    const CATMAP={'バリュエーション':'割高・割安の水準','カタリスト・イベント':'注目イベント','銘柄への含意':'自分の銘柄への影響'};

    (db.marketSectionMaster||[]).forEach(c=>{
      if(CATMAP[c.cat]) c.cat=CATMAP[c.cat];
      c.subs=c.subs.map(su=>SUBMAP[su]||su);
    });
    (db.stocks||[]).forEach(st=>{
      if(st.kind!=='市場'||!st.sections) return;
      Object.keys(st.sections).forEach(k=>{
        if(SUBMAP[k]){ const nk=SUBMAP[k]; if(!st.sections[nk]) st.sections[nk]=st.sections[k]; delete st.sections[k]; }
      });
    });
  }
  if(!db.askPrefs) db.askPrefs={mode:'new', level:'標準', picks:{}, themes:{}};
  if(!db.askPrefs.themes) db.askPrefs.themes={};
  if(!db.uiPrefs) db.uiPrefs={anaClosed:[]};
  if(!Array.isArray(db.uiPrefs.anaClosed)) db.uiPrefs.anaClosed=[];
  // 回数(count)→終了日(endDate)へ移行。回数は概念ごと廃止
  (db.reminders||[]).forEach(r=>{
    if(r.endDate===undefined) r.endDate=null;
    if('count' in r) delete r.count;
    (r.changes||[]).forEach(c=>{ if('count' in c) delete c.count; });
    // 紐付けを単一hypoIdから配列hypoIdsへ。
    // 同じイベント日(同じ決算など)の注目ポイントを1つのリマインダーでまとめて見るため
    if(!Array.isArray(r.hypoIds)) r.hypoIds = r.hypoId ? [r.hypoId] : [];
    if('hypoId' in r) delete r.hypoId;
  });
  if(!db.metricsMaster) db.metricsMaster=s0.metricsMaster;
  if(!db.metricsMaster.hiddenSnap) db.metricsMaster.hiddenSnap=[];
  if(!db.metricsMaster.hiddenTrend) db.metricsMaster.hiddenTrend=[];
  // 市場カードの粒度(市場/業界/テーマ)ごとのマスター(旧データには存在しない)
  ['marketMetricsMaster','industryMetricsMaster','themeMetricsMaster'].forEach(k=>{
    if(!db[k]) db[k]=s0[k];
    if(!db[k].snap) db[k].snap=[];
    if(!db[k].hiddenSnap) db[k].hiddenSnap=[];
  });
  // 既定指標を入れ替えた分は、ユーザーが編集していない(過去のいずれかの既定のままの)場合だけ差し替える。
  // 既定から外れた項目は「非表示」に送る。取り込み済みのデータが画面から消えたまま
  // 復元手段が無くなるのを避けるため(非表示一覧から復元できる)
  {
    const RESET=[
      {k:'metricsMaster', olds:[
        ['PER(予想)','PBR','時価総額','配当利回り(予想)','信用倍率','目標株価コンセンサス'],
      ]},
      {k:'marketMetricsMaster', olds:[
        ['予想PER(市場全体)','PBR(市場全体)','配当利回り(市場全体)','騰落レシオ(25日)','信用評価損益率','長期金利(10年)'],
        ['予想PER(市場全体)','PBR(市場全体)','長期金利(10年)','為替(USD/JPY)','騰落レシオ(25日)','VIX指数'],
      ]},
      {k:'industryMetricsMaster', olds:[
        ['市場規模','市場成長率(YoY)','設備投資額'],
        ['PER','PBR','EBITDA','ROE','営業利益率','自己資本比率'],
      ]},
    ];
    RESET.forEach(({k,olds})=>{
      const cur=db[k].snap||[];
      const same=(a,b)=>a.length===b.length&&a.every((x,i)=>x===b[i]);
      if(!olds.some(o=>same(cur,o))) return;
      const next=s0[k].snap.slice();
      db[k].hiddenSnap=db[k].hiddenSnap||[];
      cur.forEach(x=>{ if(!next.includes(x)&&!db[k].hiddenSnap.includes(x)) db[k].hiddenSnap.push(x); });
      db[k].snap=next;
    });
  }
  // 非表示は以前「一覧から取り除いて別リストへ移す」実装だった。そのため非表示にした瞬間に
  // 元がスナップショットだったのか業績推移だったのかも、並び順も失われていた。
  // 一覧には残したまま名前で印を付けるだけに改め、旧データも一覧へ戻す。
  // 戻す位置は末尾ではなく既定の並びでの位置。末尾に足すと、例えばPER(予想)が
  // 指標グリッドの2ページ目に飛び、1ページ目が「データなし」だけになって見つけられなくなる
  {
    const mm=db.metricsMaster;
    const ht=mm.hiddenTrend||[]; mm.hiddenTrend=[];
    ht.forEach(x=>{
      const name=(typeof x==='string')?x:(x&&x.name);
      if(!name) return;
      // 旧データは {name,graph} を丸ごと退避していたので、グラフ表示の指定も一緒に戻す
      if(!mm.trend.some(t=>t.name===name)) insertByDefault(mm.trend, {name, graph:!!(x&&x.graph)}, s0.metricsMaster.trend.map(t=>t.name), t=>t.name);
      if(!mm.hiddenTrend.includes(name)) mm.hiddenTrend.push(name);
    });
    [[mm,s0.metricsMaster],[db.marketMetricsMaster,s0.marketMetricsMaster],
     [db.industryMetricsMaster,s0.industryMetricsMaster],[db.themeMetricsMaster,s0.themeMetricsMaster]].forEach(([m,def])=>{
      if(!m) return;
      m.snap=m.snap||[];
      m.hiddenSnap=(m.hiddenSnap||[]).map(x=>(typeof x==='string')?x:(x&&x.name)).filter(Boolean);
      m.hiddenSnap.forEach(k=>{ if(!m.snap.includes(k)) insertByDefault(m.snap, k, def.snap, x=>x); });
    });
  }
  if(!db.industrySectionMaster) db.industrySectionMaster=s0.industrySectionMaster;
  if(!db.themeSectionMaster) db.themeSectionMaster=s0.themeSectionMaster;
  // 既存の市場カードは粒度が未設定なので「市場」扱いにする(従来の語彙がそのまま使える)
  (db.stocks||[]).forEach(st=>{ if(st.kind==='市場' && !st.scope) st.scope='市場'; });
  // 旧セクション名 → 新体系サブ項目への読み替え
  const MAP={'事業・ビジネスモデル':'事業構造','成長ドライバー':'市場成長率','リスク要因':'事業リスク','競合ポジション':'主要競合','技術':'技術力'};
  (db.stocks||[]).forEach(st=>{
    if(!st.sections) st.sections={};
    Object.keys(st.sections).forEach(k=>{
      const v=st.sections[k];
      if(v===null){ delete st.sections[k]; return; }           // 旧「未取得」プレースホルダは削除
      if(MAP[k]){ const nk=MAP[k]; if(!st.sections[nk]) st.sections[nk]=v; delete st.sections[k]; }
      if(v&&!v.details) v.details=[];
    });
  });
  // 旧「自分の見解(mine)」をメモ型カードに移行
  (db.stocks||[]).forEach(st=>{
    if(st.mine&&st.mine.length){
      db.hypotheses=db.hypotheses||[];
      st.mine.forEach(m=>{ db.hypotheses.push({id:'h'+Math.random().toString(36).slice(2,9), stockId:st.id, kind:'memo', text:m.t, createdAt:m.ts}); });
      delete st.mine;
    }
  });
  // 廃止された 'hypo' 種別(検証ポイント・判定・版管理)を 'watch'(注目ポイント)へ変換。
  // text・eventDate・eventNoteは引き継ぎ、points・judgeLog・ver・verLog・stateは破棄する。
  (db.hypotheses||[]).forEach(h=>{ if(!h.kind) h.kind='hypo'; });
  db.hypotheses=(db.hypotheses||[]).map(h=>{
    if(h.kind!=='hypo') return h;
    return {
      id:h.id, stockId:h.stockId, kind:'watch',
      text:h.text, eventDate:h.eventDate||null, eventNote:h.eventNote||null,
      createdAt:h.createdAt
    };
  });
  // 「注目イベント(eventDate)」という独立した概念を廃止し、日付の管理はリマインダーに一本化する。
  // ホーム画面で「注目イベント」と「リマインダー」が別物として並んでいたのが混乱の元だったため、
  // 日付つきの注目ポイントは「リマインド候補(remindHint)」に移し、登録を促すだけの存在にする。
  // 既にリマインダーが紐づいているものは登録済みなので候補を作らない。
  {
    const linked=new Set();
    (db.reminders||[]).forEach(r=>(r.hypoIds||[]).forEach(id=>linked.add(id)));
    (db.hypotheses||[]).forEach(h=>{
      if(h.kind==='watch' && h.eventDate && !h.remindHint && !linked.has(h.id)){
        h.remindHint={date:h.eventDate, note:h.eventNote||null};
      }
      delete h.eventDate; delete h.eventNote; delete h.eventType;
    });
  }
  // 誤登録カードのクリーニング
  // ①kindが正規値以外なら「ウォッチ」に補正
  (db.stocks||[]).forEach(st=>{ if(!['保有','ウォッチ','市場'].includes(st.kind)) st.kind='ウォッチ'; });
  // ②市場カードと同名の「実質空の非市場カード」(取り込み時の誤登録)を削除
  {
    const mktNames=new Set((db.stocks||[]).filter(s=>s.kind==='市場').map(s=>s.name));
    db.stocks=(db.stocks||[]).filter(st=>{
      if(st.kind==='市場') return true;
      const empty=(!st.metrics||!Object.keys(st.metrics).length)&&(!st.sections||!Object.keys(st.sections).length)&&(!st.mine||!st.mine.length)&&(!st.trend||!Object.keys(st.trend).length);
      if(mktNames.has(st.name)&&empty) return false;   // 市場カードの同名空カードは誤登録として除去
      return true;
    });
  }
  return db;
}

function parseD(s){ if(!s)return null; const m=String(s).match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/); if(!m)return null; return new Date(+m[1],+m[2]-1,+m[3]); }
function daysSince(s){ const d=parseD(s); if(!d)return 999; return Math.floor((today()-d)/86400000); }
// 文字単位の差分(LCS)。長文はチャンク分割して計算量を抑える
function diffChars(a,b){
  a=String(a==null?'':a); b=String(b==null?'':b);
  const LIMIT=1200;
  if(a.length>LIMIT||b.length>LIMIT){ // 長すぎる場合は句読点単位で粗く比較
    const as=a.split(/(?<=[。、\n])/), bs=b.split(/(?<=[。、\n])/);
    return lcsDiff(as,bs);
  }
  return lcsDiff(a.split(''), b.split(''));
}
function lcsDiff(A,B){
  const n=A.length,m=B.length;
  const dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]= A[i]===B[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j], dp[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<n&&j<m){
    if(A[i]===B[j]){ out.push({t:'=',v:A[i]}); i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]){ out.push({t:'-',v:A[i]}); i++; }
    else { out.push({t:'+',v:B[j]}); j++; }
  }
  while(i<n){ out.push({t:'-',v:A[i++]}); }
  while(j<m){ out.push({t:'+',v:B[j++]}); }
  // 連続する同種をまとめる
  const merged=[];
  out.forEach(o=>{ const last=merged[merged.length-1]; if(last&&last.t===o.t) last.v+=o.v; else merged.push({t:o.t,v:o.v}); });
  return merged;
}
// 更新前セル用: 削除された部分に取り消し線
function renderDiffBefore(diff){
  return diff.filter(d=>d.t!=='+').map(d=> d.t==='-' ? `<span class="d-del">${esc(d.v)}</span>` : esc(d.v)).join('');
}
// 更新後セル用: 追加された部分を青字
function renderDiffAfter(diff){
  return diff.filter(d=>d.t!=='-').map(d=> d.t==='+' ? `<span class="d-add">${esc(d.v)}</span>` : esc(d.v)).join('');
}

function showPrevUnder(){
  const bp=$('#backPrev');
  // ヘッダーとタブバーの内側(＝本文が見えている範囲)をちょうど覆う。
  // ビューポート基準なので、詳細ページの高さや現在のスクロール位置に左右されない

  $('#backPrevInner').style.transform=`translateY(${-(STATE._prevScroll||0)}px)`;
  bp.classList.add('show');
}

        <div class="row"><span class="chip navy">今日のリマインダー ${todayRem.length}</span></div>
        <div class="hint" style="margin:4px 0 8px">チャットを対象ごとに分けている場合は、対象ごとにコピーできます。</div>
        <div class="list" style="background:var(--card)">
          ${stockIds.map(sid=>{ const g=groups[sid]; const sn=stock(sid);
            return `<div class="list-row" style="min-height:auto;padding:9px 10px">
              <div class="lt"><div class="ttl" style="font-size:13px">${esc(sn?sn.name:'(削除済み)')}</div><div class="meta">${g.length}件・${esc(g[0].title)}${g.length>1?' ほか':''}</div></div>
              <button class="btn sm" style="width:auto" onclick="copyBriefFor('${sid}')">コピー</button>
            </div>`; }).join('')}
        </div>
        <button class="btn sm ghost" style="margin-top:8px;width:100%" onclick="copyBrief()">全部まとめて一括コピー</button>
      </div>`;
    }
  }
  // 取り込みで日付が入ったのにリマインダー未登録の注目ポイント。
  // 日付はリマインダーでしか管理しないので、ここで登録を促さないと予定として現れない
  if(pend.length) attn+=`<div class="card attn tap" onclick="openStock('${pend[0].stockId}')"><div class="row"><span class="chip amber">リマインド未登録 ${pend.length}件</span><span class="arrow" style="color:var(--ink3);font-size:15px">›</span></div><div class="muted" style="margin-top:4px">日付つきの注目ポイントがあります: ${pend.slice(0,3).map(p=>esc((stock(p.stockId)?.name||'')+' '+p.remindHint.date)).join('、')}</div></div>`;
  if(!todayRem.length&&!pend.length) attn+='<div class="empty"><div class="big">対応が必要なことはありません</div><div>銘柄を分析するか、リマインダーを作りましょう。</div></div>';
  // 予定はリマインダーだけを載せる。
  // 以前は「注目イベント」も並べていたが、リマインダーの日付が「次に通知する日」なのに対し
  // 注目イベントの日付は「その日に事が起きる」で意味が違い、同じ見た目で並ぶと混乱するため廃止した
  const items=[];
  DB.reminders.filter(r=>!r.paused).forEach(r=>{const d=calcNextFire(r); if(d)items.push({d,label:r.title,act:`openReminder('${r.id}')`});});
  items.sort((a,b)=>a.d-b.d);
  let sched='';
  if(!items.length) sched='<div class="muted">予定はありません</div>';
  else sched='<div class="list">'+items.slice(0,6).map(it=>{ const wd=['日','月','火','水','木','金','土'][it.d.getDay()];
    return `<div class="list-row" onclick="${it.act}"><div class="lt"><div class="ttl">${esc(it.label)}</div></div><span class="rt">${it.d.getMonth()+1}/${it.d.getDate()}(${wd})</span></div>`; }).join('')+'</div>';
  // 対象が複数あると「対応が必要」だけで画面が埋まり、下の「今週の予定」が見えなくなる。
  // 市場・銘柄分析の一覧と同じ要領で、区分ごとに畳めるようにする(畳んだ状態は端末に残る)
  const attnCnt=todayRem.length+pend.length;
  let h=groupBlock('home:対応が必要', `対応が必要${attnCnt?` (${attnCnt})`:''}`, attn);
  h+=groupBlock('home:今週の予定', `今週の予定 (${items.length})`, sched);
  v.innerHTML=h;
}

//////////////////// 開閉できる区分見出し(ホーム・市場銘柄分析で共用) ////////////////////
// 畳んでいる区分。リロードしても畳んだままにしたいのでDBに持たせる。
// 保存先の uiPrefs.anaClosed は市場銘柄分析だけで使っていた頃の名残の名前だが、
// 移行済みのデータを壊さないため名前はそのままにし、キーを画面ごとに分けて共用する
function closedGroups(){ const u=DB.uiPrefs||(DB.uiPrefs={anaClosed:[]}); if(!Array.isArray(u.anaClosed)) u.anaClosed=[]; return u.anaClosed; }
function groupClosed(key){ return closedGroups().includes(key); }
// 分析の大カテゴリだけは、区分見出しの矢尻と別の記号にする。
// 閉=＋ / 開=×(＋を45°回す)。区分の「中身」であって、開く方向を示す場所ではないため
function plusSvg(){
  // 線の太さは矢尻(2.5)より細くする。矢尻を太字とすれば＋/×は細字くらいの関係
  return `<svg class="plusmark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`;
}
// 「▾」は環境によって小さく・細く出るので、太さと大きさを指定できるSVGで描く。
// 素の状態が下向き(閉じている)。開いているときだけ .open を付けて上向きにする
function caretSvg(closed){
  return `<svg class="caret${closed?'':' open'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;
}
function toggleGroup(key){
  const a=closedGroups(); const i=a.indexOf(key);
  if(i<0) a.push(key); else a.splice(i,1);
  save(); render();
}
// 見出し+中身を1組にして返す。畳んでいるときは中身を出さない
function groupBlock(key, label, contentHtml){
  const closed=groupClosed(key);
  return `<div class="lbl grp" onclick="toggleGroup('${escArg(key)}')">
      <span>${label}</span>${caretSvg(closed)}
    </div>`+(closed?'':contentHtml);
}
// 設定への「編集」リンクを添えた開閉見出し。指標をあまり見ない銘柄では丸ごと畳めるように、
// 開閉は銘柄ごとに覚える(同じ指標でも銘柄によって見たいかどうかが変わるため)
function groupBlockWithEdit(key, label, editAction, contentHtml){
  const closed=groupClosed(key);
  return `<div class="lbl grp" onclick="toggleGroup('${escArg(key)}')">
      <span>${esc(label)}</span>
      <span class="grp-right"><span class="grp-edit" onclick="event.stopPropagation();${editAction}">編集</span><span class="grp-caret">${caretSvg(closed)}</span></span>
    </div>`+(closed?'':contentHtml);
}
function detailGroupKey(s, label){ return 'detail:'+s.id+':'+label; }

//////////////////// ANALYSIS list ////////////////////
// カードに何か入っているか。一覧で「まだ空のカード」を薄く見せる判定に使う
function hasContent(s){
  return !!(s.summary&&s.summary.t)
    || Object.keys(s.metrics||{}).length>0
    || Object.keys(s.sections||{}).length>0
    || Object.keys(s.trend||{}).length>0
    || hyposOf(s.id).length>0;
}
let anaSort='保有優先';
function renderAnalysis(v){
  $('#topTitle').textContent='市場・銘柄分析';
  const act=$('#topAct'); act.style.display='inline-flex'; act.textContent='＋ 追加'; act.onclick=sheetAddStock;
  const sorts=['保有優先','名前順'];
  let h=`<div class="seg">${sorts.map(k=>`<button class="${anaSort===k?'on':''}" onclick="anaSort='${k}';render()">${k}</button>`).join('')}</div>`;

  if(!DB.stocks.length){ v.innerHTML=h+`<div class="empty"><div class="big">銘柄がありません</div><div>右上の「＋ 追加」から登録できます。</div></div>`; return; }
  // 1件ずつを独立カードにすると全部が同じ強さで並ぶので、区分ごとに1枚の枠へ行として並べる
  // 保有/ウォッチで見出しを分ける並びでは種別を行に出さない(見出しと重複する)。
  // 名前順のときだけ種別を添える
  const row=(s)=>{ const hy=hyposOf(s.id).length;
    const meta=esc(s.code)+(anaSort==='名前順'?' · '+esc(s.kind):'');
    return `<div class="list-row${hasContent(s)?' filled':''}" onclick="openStock('${s.id}')">
      <div class="lt"><div class="ttl">${esc(s.name)}</div><div class="meta">${meta}</div></div>
      ${hy?`<span class="rt"><span class="chip navy">メモ・注目 ${hy}</span></span>`:''}
    </div>`; };
  const mkts=DB.stocks.filter(s=>isMkt(s));
  const mrow=(s)=>{ const th=((DB.askPrefs&&DB.askPrefs.themes)||{})[s.id]||'';
    return `<div class="list-row${hasContent(s)?' filled':''}" onclick="openStock('${s.id}')">
      <div class="lt"><div class="ttl">◆ ${esc(s.name)}</div>${th?`<div class="meta">注目: ${esc(th)}</div>`:''}</div>
      <span class="rt"><span class="chip gray">${esc(scopeOf(s))}</span></span>
    </div>`; };
  // 区分ごとに畳めるようにする。件数が増えると一覧が縦に長くなり、
  // 下の区分にたどり着くまで延々スクロールすることになるため
  const group=(key,label,rows)=>groupBlock(key, label,
    rows.length?`<div class="list flat">${rows.join('')}</div>`:'<div class="muted" style="padding:2px 2px 8px">なし</div>');
  if(mkts.length){
    // 粒度ごとにまとめる(市場→業界→テーマ)。混ざっていると何のカードか分かりにくい
    const rows=[]; SCOPES.forEach(sc=>mkts.filter(s=>scopeOf(s)===sc).forEach(s=>rows.push(mrow(s))));
    h+=group('市場', `市場・業界・テーマ (${mkts.length})`, rows);
  }
  if(anaSort==='保有優先'){
    [['保有','保有'],['ウォッチ','ウォッチ']].forEach(([k,label])=>{
      const list=DB.stocks.filter(s=>s.kind===k);
      h+=group(k, `${label} (${list.length})`, list.map(row));
    });
  } else {
    let list=DB.stocks.filter(s=>!isMkt(s));
    list.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
    h+=group('銘柄', `銘柄 (${list.length})`, list.map(row));
  }
  v.innerHTML=h;
}

//////////////////// DETAIL の共通ブロック ////////////////////
// 銘柄・市場の詳細画面は構成が違うので描画関数を分けている。
// ただしテーマ・分析・メモ・リンクは共通なので、ここに部品として切り出す。
function blkChips(hy){
  const wCnt=hy.filter(x=>x.kind==='watch').length, mCnt=hy.length-wCnt;
  if(!wCnt&&!mCnt) return '';
  return `<div class="pill-row" style="margin-bottom:11px">${wCnt?`<span class="chip amber">注目 ${wCnt}</span>`:''}${mCnt?`<span class="chip gray">メモ ${mCnt}</span>`:''}</div>`;
}
function blkTheme(s){
  const theme=((DB.askPrefs&&DB.askPrefs.themes)||{})[s.id]||'';
  // 市場・業界・テーマは「どの指数・ETFを指しているか」で数値の意味が変わるので、
  // 基準を1つ決められるようにする(例: AIというテーマ → グローバルX AI&ビッグデータETF)
  const bm=isMkt(s)?(s.benchmark||''):null;
  return `<div class="card tap" style="padding:9px 11px;margin-bottom:11px;border-left:3px solid var(--navy)" onclick="sheetTheme('${s.id}')">
    <div class="row"><span class="muted" style="font-size:11px">注目テーマ</span><span class="muted" style="font-size:11px">タップで編集</span></div>
    <div style="font-size:13px;font-weight:600;margin-top:2px;${theme?'':'color:var(--ink3);font-weight:400'}">${theme?esc(theme):'未設定(会話の切り口を決められます)'}</div>
    ${bm!==null?`<div class="row" style="margin-top:6px;padding-top:6px;border-top:1px solid var(--line)"><span class="muted" style="font-size:11px">代表指数・ETF</span></div>
    <div style="font-size:12px;margin-top:1px;${bm?'':'color:var(--ink3)'}">${bm?esc(bm):'未設定(決めるとAIの答える数値がぶれません)'}</div>`:''}</div>`;
}
// 指標グリッド。6件を超える場合は横スワイプページャーで送る
function blkMetrics(s, label, keys, editAction, pagerId, extraHtml){
  let h='';
  const chunks=[]; for(let i=0;i<keys.length;i+=6) chunks.push(keys.slice(i,i+6));
  if(chunks.length<=1) h+='<div class="metric" style="margin-top:2px">'+(chunks[0]||[]).map(k=>metricCellHtml(s,k)).join('')+'</div>';
  else {
    const pages=chunks.map(chunk=>`<div class="metric">${chunk.map(k=>metricCellHtml(s,k)).join('')}</div>`);
    h+=pagerBlock(pagerId, pages, (idx,total)=>`指標 ${idx+1}/${total}`, 'tight');
  }
  // 1つも埋まっていないときだけ、埋め方を1行だけ添える。
  // セルごとに「未取得」と書くと、新規カードを開くたびに何度も未完了を突きつけることになる
  if(keys.length && keys.every(k=>!s.metrics[k])) h+='<div class="hint" style="margin-top:6px">会話を取り込むと、ここに数字が入ります。</div>';
  // 指標の読み方を添える一文も、畳んだら一緒に隠れないと見出しだけ浮いて見える
  return groupBlockWithEdit(detailGroupKey(s,label), label, editAction, h+(extraHtml||'')+'<div style="height:10px"></div>');
}
// 分析の先頭に置く1〜2文の全体像。個々のカテゴリを読む前に「結局どう見ているか」を
// 掴めるようにする。カテゴリ(sectionMaster)の一項目ではなく s.summary として独立に持つ。
// 「エグゼクティブサマリー」は初心者には専門用語に見えるため、平易な言い方にしている
function blkSummary(s){
  const sm=s.summary;
  const who=isMkt(s)?'この'+scopeOf(s):'この会社';
  return `<div class="card tap" style="padding:9px 11px;margin-bottom:11px;border-left:3px solid var(--navy)" onclick="sheetSummary('${s.id}')">
    <div class="row"><span class="muted" style="font-size:11px">ざっくりまとめ</span><span class="muted" style="font-size:11px">タップで編集</span></div>
    <div style="font-size:13px;font-weight:600;margin-top:3px;white-space:pre-wrap;${sm&&sm.t?'':'color:var(--ink3);font-weight:400'}">${sm&&sm.t?esc(sm.t):`まだありません。会話を取り込むと、${esc(who)}を一言でどう見ているかがここに入ります。`}</div>
    ${sm&&sm.t?`<div class="muted" style="font-size:11px;margin-top:4px">${esc(sm.d)}</div>`:''}
  </div>`;
}
function sheetSummary(sid){
  const s=stock(sid); if(!s) return;
  const sm=s.summary||{};
  const who=isMkt(s)?'この'+scopeOf(s):'この会社';
  openSheet(`<h3>ざっくりまとめ</h3>
    <div class="muted" style="margin-bottom:10px">${esc(who)}を一言でどう見ているか。会話を取り込むと自動で入りますが、手で書いても構いません。</div>
    <label class="fld"><span class="t">内容</span><textarea id="sm_t" style="min-height:100px" placeholder="例: 需要は堅調だが、価格転嫁の遅れで利益率が伸び悩んでいる。">${esc(sm.t||'')}</textarea></label>
    <button class="btn pri" onclick="doSaveSummary('${sid}')">保存</button>
    ${sm.t?`<button class="btn danger" style="margin-top:8px" onclick="delSummary('${sid}')">削除</button>`:''}
    <button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">キャンセル</button>`);
}
function doSaveSummary(sid){
  const t=$('#sm_t').value.trim(); const s=stock(sid); if(!s) return;
  if(!t){ toast('内容を入力してください'); return; }
  s.summary={t, d:fmtToday()};
  save(); closeSheet(); render(); toast('保存しました');
}
function delSummary(sid){
  const s=stock(sid); if(!s) return;
  delete s.summary; save(); closeSheet(); render(); toast('削除しました');
}
// カテゴリのアコーディオン。各項目タップで概要/詳細スワイプのシートを開く
function blkSections(s){
  // 大カテゴリの表示/非表示は、以前は「業績推移」の編集シートの奥にしか入口が無く見つけられなかった。
  // 分析の見出しからも直接開けるようにする
  let h=blkSummary(s);
  const master=masterFor(s);
  master.filter(c=>c.on).forEach((c,ci)=>{
    const filled=filledCatCount(s,c.cat,master);
    // 「n/m 項目」は出さない。入力済みの件数はバッジで足りるうえ、
    // 分母まで出すと「埋めきれていない」ことを毎回突きつける表示になる
    h+=`<div class="sec" id="cat${ci}"><div class="h" onclick="this.parentNode.classList.toggle('open')"><span>${esc(c.cat)}${filled?` <span class="chip navy" style="font-size:11px">${filled}</span>`:''}</span>${plusSvg()}</div><div class="b">`;
    c.subs.forEach(su=>{ const val=s.sections[su]; const det=(val&&val.details)||[];
      h+=`<div class="sub-row${val?' filled':''}" onclick="event.stopPropagation();sheetAnalysisItem('${s.id}','${escArg(su)}')">
        <span class="name">${esc(su)}${det.length?` <span class="chip navy" style="font-size:11px">詳細${det.length}</span>`:''}</span>
        <span class="row-right"><span class="m">${val?esc(val.d.replace(/^\d{2}/,'')):''}</span></span>
      </div>`; });
    h+=`</div></div>`;
  });
  return groupBlockWithEdit(detailGroupKey(s,'分析'), '分析', `sheetSectionMaster('${s.id}')`, h);
}
// 件数が増えるほど詳細画面が一方的に伸びていくので、既定は先頭3件だけ出して残りは畳む。
// 1件ずつのボタン(編集/削除/リマインダー)は行から外し、行タップで開く編集シートに集約した
const HYPO_PREVIEW=3;
function blkHypos(s, hy){
  let h='';
  if(!hy.length){
    h+='<div class="hint" style="margin:-4px 0 8px">思ったことはメモに、気にかけたい・検証したいことは注目ポイントに書けます。</div>';
  } else {
    const all=STATE.hypoAll || hy.length<=HYPO_PREVIEW;
    const shown=all?hy:hy.slice(0,HYPO_PREVIEW);
    h+='<div class="list cards">'+shown.map(hypoMiniCard).join('')+'</div>';
    if(!all) h+=`<button class="btn sm" style="width:100%;margin:-4px 0 10px" onclick="STATE.hypoAll=true;render()">残り ${hy.length-HYPO_PREVIEW}件を表示</button>`;
  }
  // メモ/注目ポイントの種別は、以前は追加ボタンを2つ並べて選ばせていたが、
  // 作成画面側にセグメントを置けばボタンは1つで済む(編集時の種別変更にも同じセグメントを使い回せる)
  h+=`<button class="btn sm" style="width:100%;margin-top:2px" onclick="sheetEditHypo(null,'${s.id}')">＋</button>`;
  return groupBlock(detailGroupKey(s,'メモ・注目ポイント'), `メモ・注目ポイント (${hy.length})`, h+'<div style="height:10px"></div>');
}
function blkLinks(s){
  return `<button class="btn" style="margin-top:14px" onclick="openRem('${s.id}')">${isMkt(s)?'この'+scopeOf(s):'この銘柄'}のリマインダー (${remOf(s.id).length})</button>
    <button class="btn pri" style="margin-top:8px" onclick="openAsk('${s.id}')">会話を取り込む</button>`;
}
function detailHeader(s, sub){
  $('#topTitle').textContent=s.name;
  $('#topSub').textContent=sub;
  const act=$('#topAct'); act.style.display='inline-flex'; act.textContent='← 戻る'; act.onclick=backFromDetail;
  const menu=$('#topMenu'); menu.style.display='block'; menu.onclick=()=>sheetStockMenu(s.id);
}

//////////////////// STOCK DETAIL ////////////////////
function renderStockDetail(v){
  const s=stock(STATE.stockId); if(!s){go('analysis');return;}
  detailHeader(s, s.code+' · '+s.kind);
  const hy=hyposOf(s.id);
  let h=blkChips(hy)+blkTheme(s);
  h+=blkMetrics(s,'主要指標',snapKeys(DB.metricsMaster),'sheetMetricsMaster()','metrics');
  h+=groupBlockWithEdit(detailGroupKey(s,'業績推移'),'業績推移','sheetMetricsMaster()',renderTrend(s)+'<div style="height:10px"></div>');
  h+=blkSections(s)+blkHypos(s,hy)+blkLinks(s);
  v.innerHTML=h;
  pagerInit('metrics'); pagerInit('trendchart');
  // グラフが1枚だけのときはページャーが無く pagerInit を通らないので、ここで印を付ける
  syncTrendRows(0);
}

//////////////////// MARKET DETAIL ////////////////////
// 市場・業界・テーマ専用。銘柄と違い業績推移は持たず、指標は粒度ごとのマスターを使う。
// 以前は銘柄画面を流用して指標を丸ごと隠していたため、市場の水準感を数値で残せなかった
function renderMarketDetail(v){
  const s=stock(STATE.stockId); if(!s){go('analysis');return;}
  const sc=scopeOf(s);
  detailHeader(s, sc);
  const hy=hyposOf(s.id);
  let h=blkChips(hy)+blkTheme(s);
  const METLBL={'市場':'市場の水準','業界':'業界の水準','テーマ':'テーマの指標'};
  const keys=snapKeys(metricsMasterFor(s));
  const lvlHint=`<div class="hint" style="margin:2px 0 0">当日の値動きではなく、数か月単位で見直す水準を記録します。${s.benchmark?`基準: ${esc(s.benchmark)}`:''}</div>`;
  if(keys.length) h+=blkMetrics(s,METLBL[sc],keys,'sheetMarketMetricsMaster()','mktmetrics',lvlHint);
  else h+=lblWithEdit(METLBL[sc],'sheetMarketMetricsMaster()','margin-top:2px')+'<div class="muted" style="padding:0 2px 4px">まだありません。会話を取り込むと自動で増えます。</div>'+lvlHint;
  h+=blkSections(s);
  h+=blkHypos(s,hy);
  // 市場の話は最終的に「自分の銘柄がどうなるか」に着地するので、保有・ウォッチへの導線を置く
  const mine=DB.stocks.filter(x=>!isMkt(x));
  if(mine.length){

function renderTrend(s){
  const tr=s.trend;
  // グラフ表示に選んだ指標は、数値をまだ持っていなくても枠ごと出す。
  // 選んだのに何も出てこないと「設定が効いていないのか、データが無いのか」が区別できないため
  const inds=trendInds(DB.metricsMaster).filter(t=>t.graph);
  const years=new Set(); Object.values(tr).forEach(o=>Object.keys(o).forEach(k=>{if(k!=='unit')years.add(k);}));
  const ys=[...years];
  const hasData=t=>{ const o=tr[t.name]; return !!(o&&ys.some(y=>o[y])); };
  let h='<div class="card" style="padding:11px 12px">';
  // 棒グラフ(グラフ対象指標が複数あれば横スワイプページャーで切り替え)
  if(inds.length){
    // 見出しはグラフの上・中央に置く。下に小さく置くと、棒に視線を持っていかれて
    // 「何のグラフか」が読み取れないため
    const chartCap=(name, sub)=>`<div style="text-align:center;margin-bottom:6px;font-size:11px;color:var(--ink3)">`
      +`<span style="font-size:13px;font-weight:700;color:var(--ink)">${esc(name)}</span>${sub?' '+esc(sub):''}</div>`;
    const chartHtml=(ind)=>{
      if(!hasData(ind)) return chartCap(ind.name, '· まだ取り込まれていません')
        +`<div class="nodata" style="height:118px;margin-bottom:2px">データなし</div>`;
      const first=tr[ind.name]; const vals=ys.map(y=>+((first[y]||'0').replace(/,/g,''))); const max=Math.max(...vals,1);
      let ch=chartCap(ind.name, `${first.unit?`(${first.unit})`:''} · 点線=予想`);
      ch+='<div style="display:flex;align-items:flex-end;gap:8px;height:118px;margin-bottom:2px">';
      ys.forEach((y,i)=>{ const pct=Math.round(vals[i]/max*100); const fc=y.includes('予');
        ch+=`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><div style="width:60%;height:${pct}%;border-radius:3px 3px 0 0;${fc?'border:1.5px dashed var(--navy);':'background:var(--navy);'}"></div><div style="font-size:11px;color:var(--ink3);text-align:center">${esc(y.replace('期','').replace(/[（(]予[）)]/,''))}</div></div>`; });
      ch+='</div>';
      return ch;
    };
    if(inds.length<=1){ h+=chartHtml(inds[0]); }
    else { h+=pagerBlock('trendchart', inds.map(chartHtml), (idx)=>`${idx+1} / ${inds.length}`, 'tight'); }
  }
  // 表。1年分も取り込んでいないときは年度の列を作れないので、見出しだけ「年度」にして行は残す
  const cols=ys.length?ys.map(y=>`<th style="text-align:right">${esc(y.replace('期',''))}</th>`).join('')
                     :'<th style="text-align:center">年度</th>';
  h+='<div class="xscroll"><table class="trend" style="white-space:nowrap"><tr><th>指標</th>'+cols+'</tr>';
  trendInds(DB.metricsMaster).forEach(t=>{ const o=tr[t.name];
    // 数値が1つも無い指標は、年度のセルを1つにまとめて「データなし」と書く。
    // 年度ごとに「—」を並べるより、行まるごと空だと分かりやすい
    const cells=hasData(t)
      ? ys.map(y=>`<td style="text-align:right${y.includes('予')?';color:var(--amber-tx)':''}">${o[y]?esc(fmtNum(o[y])):'—'}</td>`).join('')
      : `<td class="nodata-cell" colspan="${Math.max(ys.length,1)}">データなし</td>`;
    // 行のどこを押してもその指標のグラフに送れるようにする。
    // 指標名だけを狙わせると、数値の上を押した人が「反応しない」と受け取ってしまう。
    // グラフに出していない指標も、押したら理由を返す。無反応の行を作ると
    // 「壊れている」としか受け取りようがない
    const gi=inds.findIndex(x=>x.name===t.name);
    const cls=[hasData(t)?'':'empty-row', 'trend-tap', gi<0?'no-chart':''].filter(Boolean).join(' ');
    h+=`<tr class="${cls}"${gi>=0?` data-gi="${gi}"`:''} onclick="${gi>=0?`trendChartTo(${gi})`:`trendNoChart('${escArg(t.name)}')`}">`
      +`<td>${esc(t.name)}${gi<0?' <span class="chip gray" style="font-size:11px">表のみ</span>':''}</td>${cells}</tr>`; });
  h+='</table></div><div id="trendNote"></div>';
  // グラフに出ていない指標があると「なぜ全部グラフにならないのか」が画面から分からないので、
  // 表のすぐ下で理由と、表なら全部見られることを伝える
  const offGraph=trendInds(DB.metricsMaster).length-inds.length;
  const notes=[];
  if(inds.length>1) notes.push('グラフのある指標は、表の行をタップするとそのグラフに切り替わります。');
  if(offGraph>0) notes.push(`グラフに出せるのは${GRAPH_MAX}件までです。残り${offGraph}件は表で見られます(どれをグラフに出すかは「編集」で変えられます)。`);
  if(notes.length) h+=`<div class="muted" style="font-size:11px;margin-top:6px">${notes.map(esc).join('<br>')}</div>`;
  h+='</div>';
  // まだ1年分も無いときだけ、埋め方を1行だけ添える
  if(!ys.length) h+='<div class="hint" style="margin:6px 0 4px">売上高・営業利益などを年度つきで取り込むと、ここにグラフと数字が入ります。</div>';
  return h;
}
// 表の行 → グラフ。横スワイプと同じ動きで送る。
// 同じ要素に「縦に見える位置まで戻す」と「横に送る」を続けて出すと、端末によっては
// あとから出した横送りのほうが取り消される。縦はページ全体(window)を動かし、
// 横送りは次のフレームに回して、2つのスクロールがぶつからないようにする
let _trendLock=null;   // 表の行から送っている最中の行き先
// グラフに出していない指標の行を押したとき。無言で終わらせず、理由と直し方をその場に出す
function trendNoChart(name){
  const el=document.getElementById('trendNote'); if(!el) return;
  el.innerHTML=`<div class="banner warn" style="margin:8px 0 0">`
    +`<div>${esc(`「${name}」はグラフに出していません。グラフは${GRAPH_MAX}件までです。`)}</div>`
    +`<button class="btn sm" style="margin-top:8px" onclick="event.stopPropagation();sheetMetricsMaster()">グラフに出す指標を選ぶ</button></div>`;
}
function trendChartTo(gi){
  const note=document.getElementById('trendNote'); if(note) note.innerHTML='';
  // 送りは滑らかに動くので、途中で通り過ぎるグラフの分だけ onscroll が走る。
  // そのまま印を追わせると、行き先の手前の行が一瞬光ってから目的の行に移る。
  // 送っている間は行き先以外の更新を無視して、印が寄り道しないようにする
  _trendLock=gi;
  setTimeout(()=>{ if(_trendLock===gi) _trendLock=null; }, 700);
  applyTrendRows(gi);
  const el=document.getElementById('trendchart_pages');
  if(!el) return;
  const r=el.getBoundingClientRect();
  const top=($('.top')?$('.top').getBoundingClientRect().bottom:0)+8;
  // グラフがほぼ画面の外にあるときだけ動かす(少しでも見えているなら動かさない)
  if(r.bottom<top+40 || r.top>window.innerHeight-40) window.scrollTo({top:viewScroll()+r.top-top, behavior:'smooth'});
  requestAnimationFrame(()=>pagerGoto('trendchart', gi));
}
// いまグラフに出ている指標を表側にも印す。スワイプで送ったときも追従させる
function syncTrendRows(idx){
  if(_trendLock!==null){ if(idx!==_trendLock) return; _trendLock=null; }
  applyTrendRows(idx);
}
function applyTrendRows(idx){
  document.querySelectorAll('#view tr[data-gi]').forEach(tr=>tr.classList.toggle('on', +tr.dataset.gi===idx));
}

出典・URL・確信度は書かないでください。確からしさの担保はあなたの側でお願いします。

■ 指標(数値のスナップショット)
## 指標
- 指標名: 値 | 単位:◯◯ | 基準日(YYYY/M/D)
  値には単位や記号を含めず数値だけを書き、単位は「単位:」欄に書いてください(例: 単位:USD、単位:百万USD、単位:%、単位:倍)。
  指標名は下記の一覧から、一字一句そのままの表記で選んでください。
  銘柄の話のときの指標名: ${snap}
  市場全体の話のときの指標名: ${mktSnap}
    ※市場の話は数値より「今どういう地合いか」の説明が主役です。指標は水準の裏付けとして添える程度で構いません。
      株価指数の値・移動平均・日々のボラティリティは書かないでください(証券アプリで見ます)。
      CPI・PMIなど発表日が決まっているものは、指標にするより「## 注目ポイント」にイベント日つきで書いてください。
  業界の話のときの指標名: ${indSnap}
    ※業界の指標は、東証の業種別データのように**公表されている業種別の数値**がある場合だけ書いてください。
      構成企業を集計して中央値を自分で算出する必要があるもの(業界のROE・営業利益率など)は、数値としては書かないでください。
      その場合は「## 分析」の「価格動向・採算」などに、「この業界の営業利益率は概ね10〜15%、A社は突出して高い」のように
      文章で書いてください。根拠や範囲を添えられる形のほうが、後から読み返して判断できます。
  一覧に無い指標は、どうしても必要なときだけ追加して構いません。ただし、一覧にある指標と
  同じ意味の別名は使わないでください。同じものが別々の指標として登録され、グラフも履歴も分かれてしまいます。
    ✕「売上高」があるのに「売上」と書く
    ✕「営業利益率」があるのに「営業利益率(%)」と書く
    ✕「PER(予想)」があるのに「予想PER」「PER（予想）」と書く(全角括弧も別名になります)
  現在株価や当日の値動きは不要です(リアルタイム性が要るものは証券アプリで見ます)。
  ここで扱いたいのは、決算や指標の更新に合わせて数か月単位で見直す数字です。

## メモ
- 本文: 私の発言をほぼそのまま(言い回しは整えて構いませんが、内容は足さないでください)

    ・私が置いた前提や判断の理由(例:「自分は配当より成長を優先して見ている」)
    ・後から読み返して「そう考えていたのか」と分かる一言

// 説明書が使う見出し語。「#」が落ちた行をこれと突き合わせて見出しに戻す
const BARE_HEADINGS=/^(指標|業績推移|ざっくりまとめ|分析|注目ポイント|メモ|リマインダー|回答フォーマット)$/;
function parseMd(text){
  // returns {stock:{name,code}, rows:[{block,key,value,d,src,conf,kind}], failed:[], type, memoCandidates:[]}
  const lines=text.split(/\r?\n/); let block=null; let rows=[]; const failed=[]; let stk=null; let type='analysis';
  // 見出しにも箇条書きにも当てはまらない自由文(会話の地の文)は、メモ候補として連続した段落単位にまとめる
  const memoCandidates=[]; let pendingFree=[];
  const flushFree=()=>{ if(pendingFree.length){ memoCandidates.push(pendingFree.join('\n')); pendingFree=[]; } };
  for(let raw of lines){
    let line=raw.replace(/\*\*/g,'').trim();
    if(!line) { flushFree(); continue; }
    if(/^```/.test(line)) continue;                                  // コードブロック境界
    if(/^\[[0-9A-F-]{8,}\]\(https?:\/\//i.test(line)) continue;    // citationリンク行
    if(/^(PR TIMES|\+\d+)\s*`*$/i.test(line)) continue;            // 出典フッタ
    let m;
    // 見出しの「#」は落ちることがある(Markdownとして描画された画面からコピーすると
    // 見出し記号ごと消える)。落ちると銘柄も見出しも判定できず、見出し語がそのまま
    // メモ候補に混ざるので、「#」は無くても見出しとして読む
    if(m=line.match(/^#*\s*銘柄[:：]\s*(.+?)\s*[\(（]([A-Za-z0-9]+)[\)）]/)){ stk={name:m[1].trim(),code:m[2].trim()}; flushFree(); continue; }
    if(m=line.match(/^#+\s*テーマ[:：]\s*(.+)$/)){ const nm=m[1].trim(); const mk=DB.stocks.find(x=>isMkt(x)&&x.name===nm); stk={name:nm, code:mk?mk.id:nm, isMarket:true}; flushFree(); continue; }
    if(m=line.match(/^##\s*(.+)$/)){ const b=m[1].trim(); block=b; if(/リマインダー/.test(b))type='reminder'; flushFree(); continue; }
    // 「#」が落ちた見出し。既知の見出し語と完全に一致する行だけを対象にして、
    // 同じ語で始まる普通の文章(「分析すると…」など)を巻き込まないようにする
    if(BARE_HEADINGS.test(line)){ block=line; if(/リマインダー/.test(line))type='reminder'; flushFree(); continue; }
    if(line.startsWith('#')) { flushFree(); continue; }
    if(/^[-•*・‣▪]\s*/.test(line)){
      flushFree();
      let body=line.replace(/^[-•*・‣▪]\s*/,'');
      // key: value | d | src | conf   (labels like 出典: 確信度: tolerated)
      let km=body.match(/^([^:：]+)[:：]\s*(.*)$/);
      // メモは自由記述なので「キー: 値」の形を強制しない。読めなかった行に落とすと、
      // 本人の発言が「整形しなおしてください」の対象になってしまう
      if(!km && block==='メモ'){ rows.push({block, key:'本文', value:body, d:'', src:'', conf:'', unit:'', raw:raw.trim()}); continue; }
      if(!km){ failed.push(raw.trim()); continue; }
      let key=km[1].trim(); let rest=km[2].trim();
      let parts=rest.split('|').map(x=>x.trim());
      let value=parts[0]||'';
      let d='',src='',conf='',unit='';
      parts.slice(1).forEach(p=>{
        if(/月期/.test(p)&&p.includes('=')){ value+=' | '+p; return; }
        const confM=p.match(/確信度[:：]\s*(高|中|低)/); if(confM){ conf=confM[1]; return; }
        p=p.replace(/^(出典|確信度|基準日|単位)[:：]\s*/,'');
        if(/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(p)||/^\d{1,2}\/\d{1,2}$/.test(p)) d=p;
        else if(/^(高|中|低)$/.test(p)) conf=p;
        else if(/^単位/.test(parts.find(x=>x.includes(p))||'')||/円|USD|ドル|\$|%/.test(p)&&p.length<8) unit=p.replace(/単位[:：]/,'');
        else src=src?src+' / '+p:p;
      });
      src=shortSrc(src);
      // 数値項目(指標・業績推移)のみ単位を正規化する。分析セクションの本文は一切加工しない。
      const isTrendRow = /[年][0-9]{1,2}月期/.test(value) && value.includes('=');
      const isAnalysisRow = /分析/.test(block||'') || /[（(](サマリ|要点のみ|詳細)[）)]/.test(key);
      if(isTrendRow){
        const segs=value.split('|').map(x=>x.trim()).filter(Boolean);
        const outs=[]; let segUnit='';
        segs.forEach(sg=>{ const mm=sg.split('='); if(mm.length!==2){outs.push(sg);return;}
          const nv=normalizeValueUnit(mm[1].trim(), '');
          if(nv.unit&&!segUnit) segUnit=nv.unit;
          outs.push(mm[0].trim()+'='+nv.v); });
        value=outs.join(' | ');
        if(segUnit&&(!unit||unit==='円')) unit=segUnit;
      } else if(!isAnalysisRow && isNumericValue(value)){
        const nv=normalizeValueUnit(value, unit);
        value=nv.v; if(nv.unit) unit=nv.unit;
      }
      // date-ok check
      if(d&&!parseD(d.length<=5?('2026/'+d):d) && !/^\d{1,2}\/\d{1,2}$/.test(d)){ /* keep */ }
      rows.push({block,key,value,d,src,conf,unit, raw:raw.trim()});
    } else { pendingFree.push(line); }
  }
  flushFree();
  // 見出しが無い行の行き先をキーから推定(GPTの分割出力対策)
  rows.forEach(r=>{
    if(r.block) return;
    if(DB.metricsMaster.snap.includes(r.key)) r.block='指標';
    else if(/[年][0-9]{1,2}月期\s*(\(予\))?\s*=/.test(r.value)||/FY\d{2}\s*=/.test(r.value)) r.block='業績推移';
    else if(resolveSection(r.key,r.value).sub) r.block='分析';
  });
  // 「## 注目ポイント」: 本文＋(任意)イベント日を1カード分の行にまとめる。
  // 複数回登場する場合も、本文の出現ごとに新しいまとまりとして分離する。
  let merged=[]; let pending=null;
  const flushPending=()=>{ if(pending){ merged.push(pending); pending=null; } };
  rows.forEach(r=>{
    if(r.block!=='注目ポイント'){ flushPending(); merged.push(r); return; }
    if(r.key==='本文'){ flushPending(); pending={block:'注目ポイント', key:'注目ポイント', value:r.value, eventDate:null, raw:r.raw}; }
    else if(/イベント日/.test(r.key) && pending){ pending.eventDate=r.value; }
    // 本文・イベント日以外(出典/確信度など、本文より前に来たイベント日も含む)は
    // カード化するとゴミが増えるため、メモ候補に回してユーザーの判断に委ねる
    else { memoCandidates.push(r.key+': '+r.value); }
  });
  flushPending();
  rows=merged;
  // 「## メモ」: 会話の中で本人が述べた考えを外部AIに拾ってもらうための欄。
  // 保存先はメモ候補と同じなので、ここで候補に合流させて画面で消せるようにする。
  // 見出しの無い自由文より確度が高いので、候補の先頭に置く
  const explicitMemos=[];
  rows=rows.filter(r=>{
    if(r.block!=='メモ') return true;
    // 「- 本文: ◯◯」でも「- ◯◯」でも受ける(ラベルの有無を外部AIに強制しない)
    const t=(/^(本文|メモ)$/.test(r.key)?r.value:(r.key+': '+r.value)).trim();
    if(t) explicitMemos.push(t);
    return false;
  });
  memoCandidates.unshift(...explicitMemos);
  // 重複除外(同じキーで同じ値が複数回=AIの再出力)
  const seen=new Set(); const dups=[];
  const uniq=rows.filter(r=>{ const sig=r.key+'|'+String(r.value).slice(0,80); if(seen.has(sig)){ dups.push(r); return false; } seen.add(sig); return true; });
  return {stock:stk, rows:uniq, failed, type, dups, memoCandidates};
}

// ===== 指標名の表記揺れ検出 =====
// 「売上高」と「売上」のように同じものを別名で受け取ると、別々の指標として登録され、
// グラフも履歴も分かれてしまう。根本の対策は説明書(briefingText)で外部AIの表記を
// 揃えることだが、それでも漏れる分をここで取り込み前に知らせる。
// 取り込み自体は止めない。止めると取り込みそのものが億劫になるため、
// 「増えること」と「似た既存名」を伝えるところまでにする。
function metNorm(s){
  return String(s)
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/（/g,'(').replace(/）/g,')')
    .replace(/[\s　・()%％,，]/g,'')
    .toLowerCase();
}
function metBigrams(s){ const a=[]; for(let i=0;i<s.length-1;i++) a.push(s.slice(i,i+2)); return a.length?a:[s]; }
// 0〜1。1に近いほど同じ指標を指している可能性が高い
function metSim(a,b){
  const x=metNorm(a), y=metNorm(b);
  if(!x||!y) return 0;
  if(x===y) return 1;               // 括弧や記号の違いだけ (営業利益率 と 営業利益率(%))
  if(x.includes(y)||y.includes(x)) return .9;  // 一方が他方を含む (売上高 と 売上)
  // 語順が入れ替わっただけの別名(PER(予想) と 予想PER)を拾うため、2文字組の一致率で見る
  const A=metBigrams(x), B=metBigrams(y), rest=B.slice();
  let hit=0; A.forEach(g=>{ const i=rest.indexOf(g); if(i>=0){ hit++; rest.splice(i,1); } });
  return 2*hit/(A.length+B.length);
}
const MET_SIM_MIN=.6;   // これ未満は別物とみなす (ROE と ROIC が引っかからない水準)
function nearestMetric(name, list){
  let best=null, bs=0;
  (list||[]).forEach(k=>{ const v=metSim(name,k); if(v>bs){ bs=v; best=k; } });
  return bs>=MET_SIM_MIN ? {name:best, score:bs} : null;
}

function newMetricsIn(rows, target){
  const mm = target ? metricsMasterFor(target) : DB.metricsMaster;
  const trendNames = DB.metricsMaster.trend.map(t=>t.name);
  const out=[];
  (rows||[]).forEach(r=>{
    if(/指標/.test(r.block||'')){
      if(!mm.snap.includes(r.key)) out.push({name:r.key, kind:'snap', near:nearestMetric(r.key, mm.snap)});
    } else if(/業績|推移/.test(r.block||'')){
      if(target && isMkt(target)) return;   // 市場カードは業績推移を持たない
      if(!trendNames.includes(r.key)) out.push({name:r.key, kind:'trend', near:nearestMetric(r.key, trendNames)});
    }
  });
  // 同じ名前が複数行にあっても知らせるのは1回
  return out.filter((x,i)=>out.findIndex(y=>y.name===x.name&&y.kind===x.kind)===i);

      h+=`<tr class="${cls}"><td>${label}${confb}<div class="muted" style="font-size:11px">${esc(r.block||'')}${isSame?' · 変更なし':(isNew?' · 新規':'')}</div></td>

    window._orphans=orphans;

    if(sameCnt) h+=`<div class="muted" style="margin-top:8px;font-size:11px">前回と同じ内容の ${sameCnt}件 は読み込みません(鮮度のみ更新)。</div>`;

function commitImport(){
  const p=window._parsed; if(!p){toast('読み込む内容がありません');return;}
  if(!p.stock && STATE.askStockId){ const sc0=stock(STATE.askStockId); if(sc0) p.stock={name:sc0.name, code:sc0.code}; }
  if(!p.stock){ const pickEl=$('#importStockPick'); const picked=stock((pickEl&&pickEl.value)||STATE._importPick); if(picked) p.stock={name:picked.name, code:picked.id}; }
  if(!p.stock){toast('対象の銘柄を選んでください');return;}
  const s=stock(p.stock.code); if(!s){toast('先に新規銘柄として登録してください');return;}
  const memoTexts=[...document.querySelectorAll('#memoCandList .mc-text')].map(ta=>ta.value.trim()).filter(Boolean);
  if(!p.rows.length && !memoTexts.length){ toast('取り込む内容がありません'); return; }
  const newWatchWithEvent=[];
  // 該当なし行: チェックされたものだけ「その他」カテゴリへ
  (window._orphans||[]).forEach((r,i)=>{ const cb=document.getElementById('orp'+i); if(cb&&cb.checked){ let oc=DB.sectionMaster.find(c=>c.cat==='その他'); if(!oc){ oc={cat:'その他',on:true,subs:[]}; DB.sectionMaster.push(oc);} const nm=String(r.key).split(/[:：]/).pop().replace(/[（(](サマリ|要点のみ|詳細)[）)]/,'').trim()||'メモ'; if(!oc.subs.includes(nm)) oc.subs.push(nm); s.sections[nm]={t:(r._res?r._res.value:r.value),d:normD(r.d),details:[]}; } });
  p.rows.forEach(r=>{
    if(r._res&&!r._res.sub) return;
    if(r._skip){ // 内容が同じ → 鮮度(取得日)のみ更新
      if(/指標/.test(r.block||'')&&s.metrics[r.key]) s.metrics[r.key].d=normD(r.d);
      else if(r._res&&r._res.sub&&s.sections[r._res.sub]&&r._res.layer!=='詳細') s.sections[r._res.sub].d=normD(r.d);
      else if(r.block==='ざっくりまとめ'&&s.summary) s.summary.d=normD(r.d);
      return;
    }
    if(/指標/.test(r.block||'')){
      // 出典も確信度も保存しない。どちらも生成AIの自己申告で、無関係な出典が
      // 混ざったり確信度が実態と合わなかったりするため、信頼の手掛かりにならない。
      // 確からしさの担保は外部AI側に委ね、アプリは「何をいつ時点で受け取ったか」だけを残す
      s.metrics[r.key]={v:r.value,unit:r.unit||'',d:normD(r.d)};
      // マスターに無い指標名は保存しても画面に出ないため、取り込み時に自動登録する。
      // 非表示にした指標も一覧には残っているので、includes だけで「非表示中のものを
      // 取り込みのたびに表示中へ戻してしまう」ことは起きない。
      // 市場・テーマは銘柄とは別の指標マスターに登録する(PERと騰落レシオを混ぜない)
      const mm=metricsMasterFor(s);
      if(!mm.snap.includes(r.key)) mm.snap.push(r.key);
    }
    else if(/業績|推移/.test(r.block||'')){ /* value like 25年3月期=... */ const o={unit:r.unit||''}; r.value.split('|').forEach(seg=>{const mm=seg.split('=');if(mm.length===2)o[mm[0].trim()]=mm[1].trim();}); s.trend[r.key]=o;
      if(!DB.metricsMaster.trend.some(t=>t.name===r.key)){
        // グラフは最大4件までの運用のため、超える分は表(グラフなし)で追加
        DB.metricsMaster.trend.push({name:r.key, graph:trendInds(DB.metricsMaster).filter(t=>t.graph).length<GRAPH_MAX});
      }
    }
    else if(/分析/.test(r.block||'')){
      const res=resolveSection(r.key, r.value);
      if(!res.sub) return;
      const key=res.sub, isDetail=res.layer==='詳細', val=res.value;
      const prev=s.sections[key];
      if(isDetail){
        if(!s.sections[key]) s.sections[key]={t:'(要点のみ未取得)',d:normD(r.d),details:[]};
        if(!s.sections[key].details) s.sections[key].details=[];
        // 既にある内容・過去に削除した内容と完全一致する場合は積み増さない。
        // プレビュー側の判定(_res.dup)が正しく効いていればここには来ないはずだが、
        // 直接呼ばれる経路もあり得るため二重にガードしておく
        const dup=s.sections[key].details.some(d2=>d2.t===val) || (s.sections[key].delSig||[]).includes(val);
        if(!dup) s.sections[key].details.unshift({ts:normD(r.d),title:'AI深掘り',t:val});
      }
      else { s.sections[key]={t:val,d:normD(r.d),details:(prev&&prev.details)||[]}; }
    }
    else if(r.block==='ざっくりまとめ'){
      s.summary={t:r.value,d:normD(r.d)};
    }
    else if(/注目ポイント/.test(r.block||'')){
      // 取り込まれたイベント日はカードには持たせず、リマインダー登録の候補として保持する
      const ed = r.eventDate ? (/^\d{1,2}\/\d{1,2}$/.test(r.eventDate)?'2026/'+r.eventDate:r.eventDate) : null;
      const hid='h'+Date.now()+Math.random().toString(36).slice(2,8);
      DB.hypotheses.push({id:hid, stockId:s.id, kind:'watch', text:r.value, remindHint:ed?{date:ed, note:null}:null});
      if(ed) newWatchWithEvent.push({id:hid, text:r.value, eventDate:ed});
    }
  });
  // メモ候補: 画面上で編集・追加・削除された内容をそのまま取り込む(memoTextsは冒頭で採取済み)
  memoTexts.forEach(t=>{ DB.hypotheses.push({id:'h'+Date.now()+Math.random().toString(36).slice(2,8), stockId:s.id, kind:'memo', text:t}); });
  save();
  const n=p.rows.length+memoTexts.length;
  toast(n+'件を読み込みました');
  $('#mdIn').value=''; $('#parseOut').innerHTML='';
  openStock(s.id);
  if(newWatchWithEvent.length) sheetReminderTriage(newWatchWithEvent, s.id);
}
// 取り込みの項目名解決は全マスター横断で行う(粒度を跨いだ貼り付けでも取りこぼさない)
function allSectionMasters(){ return [DB.sectionMaster, DB.marketSectionMaster, DB.industrySectionMaster, DB.themeSectionMaster].filter(Boolean); }
function knownSubs(){ const a=[]; allSectionMasters().forEach(M=>M.forEach(c=>c.subs.forEach(su=>a.push(su)))); return a; }
// 「主要競合(サマリ)」「競争環境: 主要競合(サマリ)」「競争環境: 主要競合(詳細): 本文」いずれも解決する
function resolveSection(rawKey, rawValue){
  let key=String(rawKey||'').trim(), value=String(rawValue||'').trim();
  let layer=null;
  const pick=(s)=>{ const m=s.match(/^(.*?)[（(](サマリ|要点のみ|詳細)[）)]\s*$/); if(m) return {base:m[1].trim(), lay:(m[2]==='詳細'?'詳細':'サマリ')}; return null; };
  // ケースA: キー自体にレイヤー表記がある
  let p=pick(key);
  if(p){ key=p.base; layer=p.lay; }
  // ケースB: キーがカテゴリ名で、値の先頭が「サブ項目(レイヤー): 本文」
  const cats=[].concat(...allSectionMasters().map(M=>M.map(c=>c.cat)));
  if(cats.includes(key)){
    const m=value.match(/^([^:：]+)[:：]\s*([\s\S]*)$/);
    if(m){ const p2=pick(m[1].trim()); if(p2){ key=p2.base; layer=p2.lay; value=m[2].trim(); } else { key=m[1].trim(); value=m[2].trim(); } }
  }
  // キー内に「カテゴリ: サブ項目」が同居している場合
  if(key.includes(':')||key.includes('：')){
    const parts=key.split(/[:：]/).map(x=>x.trim()).filter(Boolean);
    const last=parts[parts.length-1]; const p3=pick(last);
    if(p3){ key=p3.base; layer=p3.lay; } else { key=last; }
  }
  const subs=knownSubs();
  if(!subs.includes(key)){
    const hit=subs.find(su=>key.includes(su)||su.includes(key));
    if(hit) key=hit; else return {sub:null, layer:layer||'サマリ', value};
  }
  return {sub:key, layer:layer||'サマリ', value};
}
function shortSrc(s){
  if(!s) return '';
  let x=String(s);
  x=x.replace(/\[([^\]]*)\]\((https?:\/\/[^\)]+)\)/g, (m,label,url)=>{
    try{ const h=url.match(/^https?:\/\/([^\/\?]+)/); return (h?h[1].replace(/^www\./,''):(label||'')); }catch(e){ return label||''; }
  });
  x=x.replace(/https?:\/\/\S+/g,'').replace(/\s{2,}/g,' ').replace(/\s*\/\s*$/,'').trim();
  // 重複ドメインの除去
  const parts=[...new Set(x.split(/[\/、,]\s*/).map(y=>y.trim()).filter(Boolean))];
  x=parts.join(' / ');
  return x.length>40?x.slice(0,40)+'…':x;
}
// 値が「単独の数値(+単位)」に見えるか。文章は false。
function isNumericValue(v){
  const s=String(v).trim();
  if(s.length>24) return false;                       // 長い=文章
  if(/[。、！？]/.test(s)) return false;               // 句読点=文章
  if(/[ぁ-んァ-ヶ]{3,}/.test(s)) return false;         // かな連続=文章
  return /^[\-\d,.,]+\s*(兆|億|万)?\s*[\d,.]*\s*(億円|百万円|百万USD|万円|円|倍|%|USD|ドル|\$[BM]?)?\s*$/.test(s);
}
// 日本語の位取り単位を正規化: 「1兆3425億円」→ {v:13425, unit:'億円'} 等
function normalizeValueUnit(value, unit){
  if(!isNumericValue(value)) return {v:String(value), unit:String(unit||'')};   // 文章は加工しない
  let v=String(value).trim(); let u=String(unit||'').trim();
  const jp=v.match(/^([\d,\.]*)?\s*(兆)?\s*([\d,\.]+)?\s*(億|万)?\s*(円|USD|ドル)?\s*$/);
  if(/兆|億|万/.test(v)){
    let total=0; let m;
    if(m=v.match(/([\d,\.]+)\s*兆/)) total+=parseFloat(m[1].replace(/,/g,''))*10000;   // 兆→億換算
    if(m=v.match(/([\d,\.]+)\s*億/)) total+=parseFloat(m[1].replace(/,/g,''));
    if(total>0){ return {v:String(Math.round(total*100)/100), unit:'億円'}; }
  }
  const um=v.match(/^([\-\d,\.]+)\s*(億円|百万円|百万USD|万円|円|倍|%|USD|\$[BM]?)$/);
  if(um){ return {v:um[1].replace(/,/g,''), unit:um[2]}; }
  return {v:v.replace(/,/g,''), unit:u};
}
function normD(d){ if(!d)return '2026/7/13'; if(/^\d{1,2}\/\d{1,2}$/.test(d))return '2026/'+d; return d; }
function copyReformat(){ const txt='次のテキストを指定書式に直してください。書式: - キー: 値 | 基準日(YYYY/M/D)。数値は単位付き確定値のみ。単位は「単位:◯◯」欄に。出典・確信度は書かない。\n--- 対象 ---\n'+(window._failed||[]).join('\n'); copy(txt,'整形プロンプトをコピーしました'); }

  if(st.isMarket){ const id='mkt'+Date.now(); DB.stocks.push({id, name:st.name, code:'', kind:'市場', scope:'市場', metrics:{}, trend:{}, sections:{}, mine:[]}); st.code=id; }
  else DB.stocks.push({id:st.code,name:st.name,code:st.code,kind:'ウォッチ',metrics:{},trend:{},sections:{},mine:[]});

}

function renderReminder(v){
  $('#topTitle').textContent='リマインダー';
  const act=$('#topAct'); act.style.display='inline-flex'; act.textContent='＋ 登録'; act.onclick=()=>sheetAddReminder(STATE.remStockId);
  const filt=STATE.remFilter; STATE.remFilter=null;
  let list=DB.reminders; if(filt) list=list.filter(r=>r.stockId===filt);
  let h='';
  if(filt) h+=`<div class="banner">${esc(stock(filt)?.name||'')} のリマインダーを表示中 · <span style="text-decoration:underline;cursor:pointer" onclick="go('reminder')">すべて表示</span></div>`;
  const active=list.filter(r=>!r.paused), paused=list.filter(r=>r.paused);
  if(active.length) h+='<div class="lbl">有効</div><div class="list">'+active.map(remCard).join('')+'</div>';
  if(!list.length) h+='<div class="empty"><div class="big">リマインダーはありません</div><div>右上の「＋ 登録」から作成できます。</div></div>';
  if(paused.length) h+='<div class="lbl">休止中</div><div class="list">'+paused.map(remCard).join('')+'</div>';
  v.innerHTML=h;
}

      <div class="row" style="justify-content:flex-start;gap:8px"><span class="chip ${cat}">${esc(r.cat)}</span><span class="meta">${esc(r.freq)} ${esc((r.times||[]).join(','))}</span></div>
