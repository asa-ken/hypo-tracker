// 分析項目: 概要ページ→詳細ページを横スワイプで移動するシート
// 汎用の横スワイプページャー(ボトムシート内・ページ内インラインの両方で使う)
const _pagerState={}; const _pagerCap={};
function pagerBlock(id, pageHtmls, capFn, pageClass){
  const total=pageHtmls.length;
  _pagerCap[id]=capFn||null;
  const cls='page'+(pageClass?' '+pageClass:'');
  const pagesHtml=pageHtmls.map(ph=>`<div class="${cls}">${ph}</div>`).join('');
  const dotsHtml=total>1?Array.from({length:total},(_,i)=>`<span class="dot${i===0?' on':''}"></span>`).join(''):'';
  // tight(指標グリッド・グラフ)は左右に余白が無く端のシェブロンが中身に重なるため出さない。
  // 下の矢印ボタンとドットで送れることは伝わる
  const edges=/\btight\b/.test(pageClass||'')?'':`<div class="edge-hint left" id="${id}_el">‹</div><div class="edge-hint right" id="${id}_er">›</div>`;
  return `<div class="pages-wrap"><div class="pages" id="${id}_pages">${pagesHtml}</div>
      ${edges}</div>
    ${total>1?`<div class="pager-nav">
      <span class="swipecap" id="${id}_cap"></span>
      <button class="navbtn" id="${id}_prev" onclick="pagerGoto('${id}',_pagerState['${id}'].activeIdx-1)">‹</button>
      <div class="dots" id="${id}_dots">${dotsHtml}</div>
      <button class="navbtn" id="${id}_next" onclick="pagerGoto('${id}',_pagerState['${id}'].activeIdx+1)">›</button>
    </div>`:''}`;
}
function pagerInit(id){
  const pagesEl=document.getElementById(id+'_pages'); if(!pagesEl) return;
  const total=pagesEl.children.length;
  _pagerState[id]={activeIdx:0, total};
  pagesEl.scrollLeft=0;
  pagerUpdateNav(id);
  pagesEl.onscroll=()=>{ const w=pagesEl.clientWidth; if(!w) return; const idx=Math.round(pagesEl.scrollLeft/w); if(idx!==_pagerState[id].activeIdx){ _pagerState[id].activeIdx=idx; pagerUpdateNav(id); } };
}
function pagerGoto(id, idx){
  const st=_pagerState[id]; if(!st||idx<0||idx>=st.total) return;
  document.getElementById(id+'_pages').scrollTo({left:idx*document.getElementById(id+'_pages').clientWidth, behavior:'smooth'});
}
function pagerUpdateNav(id){
  const st=_pagerState[id]; if(!st) return;
  const prev=document.getElementById(id+'_prev'), next=document.getElementById(id+'_next');
  if(prev) prev.disabled=st.activeIdx===0;
  if(next) next.disabled=st.activeIdx>=st.total-1;
  const dots=document.getElementById(id+'_dots');
  if(dots) [...dots.children].forEach((el,i)=>el.classList.toggle('on', i===st.activeIdx));
  const el=document.getElementById(id+'_el'), er=document.getElementById(id+'_er');
  if(el) el.classList.toggle('show', st.activeIdx>0);
  if(er) er.classList.toggle('show', st.activeIdx<st.total-1);
  const cap=document.getElementById(id+'_cap');
  if(cap && _pagerCap[id]) cap.textContent=_pagerCap[id](st.activeIdx, st.total);
}

function genOrderNew(sid){
  const s=sid?stock(sid):null; const pk=DB.askPrefs.picks||{};
  const sums=Object.keys(pk).filter(k=>pk[k]==='sum'), deeps=Object.keys(pk).filter(k=>pk[k]==='deep');
  // 市場・テーマも指標(水準)を聞ける。銘柄用とは別のマスターを使う
  const need=[]; if(s) metricsMasterFor(s).snap.forEach(k=>{const m=s.metrics[k]; if(!m||daysSince(m.d)>30)need.push(k);});
  if(!sums.length&&!deeps.length&&!need.length){ toast('項目を選んでください'); return; }
  const theme=((DB.askPrefs.themes||{})[sid]||'').trim();
  const head=s?(isMkt(s)?`# テーマ: ${s.name}`:`# 銘柄: ${s.name} (${s.code})`):'# 銘柄またはテーマ: (会話の中で対象を明記してください)';
  let p=`以下の項目を調査し、指定フォーマットで回答してください。\n`;
  if(theme) p+=`\n■注目テーマ: ${theme}\n各項目は、このテーマとの関連を軸に調べてください。テーマに関係が薄い項目は一般的な内容で構いません。\n`;

function parseReminder(){
  const md=$('#rm_md').value; const sid=$('#rm_stock').value;
  const hidEl=$('#rm_hypo');
  if(!md.trim()){toast('mdを貼り付けてください');return;}
  const lines=md.split(/\r?\n/); let block=null; const r={id:'r'+Date.now(),stockId:sid,hypoIds:(hidEl&&hidEl.value?hidEl.value.split(',').filter(Boolean):[]),times:[],changes:[],log:[],paused:false,src:'外部AI',srcDate:fmtToday()}; let cur=null; let promptLines=[]; let inPrompt=false; let promptTarget=0; const chPrompts={};
  for(let raw of lines){ let line=raw.replace(/\*\*/g,'').trim(); if(!line)continue;
    let m;
    if(m=line.match(/^##\s*(.+)$/)){
      block=m[1].trim();
      const pm=block.match(/^変更後の実行プロンプト\s*(\d)?/);
      if(pm){ inPrompt=true; promptTarget=+(pm[1]||1); continue; }
      if(/実行プロンプト/.test(block)){ inPrompt=true; promptTarget=0; continue; }
      if(/頻度変更/.test(block)){cur={};r.changes.push(cur);}
      inPrompt=false; continue;
    }
    if(inPrompt){ if(promptTarget===0) promptLines.push(raw.trim()); else { chPrompts[promptTarget]=(chPrompts[promptTarget]||'')+(chPrompts[promptTarget]?'\n':'')+raw.trim(); } continue; }
    if(line.startsWith('-')){ let b=line.replace(/^-\s*/,''); let km=b.match(/^([^:：]+)[:：]\s*(.*)$/); if(!km)continue; let k=km[1].trim(),val=km[2].trim();
      if(/頻度変更/.test(block||'')&&cur){ if(/条件/.test(k))cur.cond=val; else if(/頻度/.test(k))cur.freq=val; else if(/時間/.test(k))cur.times=val; }
      else {
        if(/タイトル/.test(k))r.title=val;
        else if(/コメント/.test(k))r.comment=val;
        else if(/カテゴリ/.test(k))r.cat=val;
        else if(/開始日/.test(k)){ const dd=String(val).match(/\d{4}\/\d{1,2}\/\d{1,2}/); r.startDate=dd?dd[0]:null; }
        else if(/終了日/.test(k)){ const dd=String(val).match(/\d{4}\/\d{1,2}\/\d{1,2}/); r.endDate=dd?dd[0]:null; }
        else if(/頻度/.test(k))r.freq=val;
        else if(/時間/.test(k))r.times=val.split(',').map(x=>x.trim());
      }
    }
  }
  r.prompt=promptLines.join('\n').trim();
  // 変更後の実行プロンプトを頻度変更に紐付け
  Object.keys(chPrompts).forEach(k=>{ const i=+k-1; const txt=String(chPrompts[k]||'').trim();
    if(r.changes[i] && txt && !/^同じ$/.test(txt)) r.changes[i].prompt=txt; });
  // validate freq changes date
  let bad=r.changes.find(c=>c.cond&&!/\d{4}\/\d{1,2}\/\d{1,2}/.test(c.cond));
  if(!r.title){toast('タイトルが解析できません');return;}
  { const d=calcNextFire(r); r.nextFire = d ? fmtFire(d) : null; }
  DB.reminders.push(r); clearHints(r.hypoIds); save();
  toast(bad?'登録しました(日付なし頻度変更は要確認)':'登録しました');
  afterReminderSaved(r.hypoIds, sid);
}

  const graphOn=mm.trend.filter(x=>x.graph).length;
  let h=`<h3>収容指標・業績分析項目の設定</h3>
    <div class="muted" style="margin-bottom:12px">全銘柄に共通の設定です。ここで選んだ指標が質問文作成(「聞くことが思いつかない時は」)と、銘柄詳細の表示に使われます。</div>`;
  // スナップショット指標
  h+=`<div class="lbl" style="margin-top:0">スナップショット指標 (${mm.snap.length})</div>`;
  mm.snap.forEach((k,i)=>{
    h+=`<div class="row" style="display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line)">
      <span style="flex:1;font-size:13px">${esc(k)}</span>
      <button class="btn sm" style="width:auto;padding:3px 7px;font-size:11px" onclick="moveMetric('snap',${i},-1)" ${i===0?'disabled style="opacity:.3;width:auto;padding:3px 7px;font-size:11px"':''}>↑</button>
      <button class="btn sm" style="width:auto;padding:3px 7px;font-size:11px" onclick="moveMetric('snap',${i},1)" ${i===mm.snap.length-1?'disabled style="opacity:.3;width:auto;padding:3px 7px;font-size:11px"':''}>↓</button>
      <button class="del" style="border:none;background:none;padding:3px 5px" onclick="hideMetric('snap','${esc(k)}')">非表示</button>
    </div>`; });
  h+=`<button class="btn sm" style="margin-top:8px" onclick="sheetAddMetric('snap')">＋ 指標を追加</button>`;
  // 業績推移指標
  h+=`<div class="lbl">業績推移の指標 (${mm.trend.length}) · ☑=グラフ表示 (${graphOn}/4)</div>`;
  mm.trend.forEach((o,i)=>{
    h+=`<div class="row" style="display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line)">
      <button class="btn sm" style="width:auto;padding:3px 8px;font-size:11px;${o.graph?'background:var(--navy);color:#fff;border-color:var(--navy)':''}" onclick="toggleGraph(${i})">${o.graph?'☑ グラフ':'☐ グラフ'}</button>
      <span style="flex:1;font-size:13px">${esc(o.name)}</span>
      <button class="btn sm" style="width:auto;padding:3px 7px;font-size:11px" onclick="moveMetric('trend',${i},-1)" ${i===0?'disabled':''}>↑</button>
      <button class="btn sm" style="width:auto;padding:3px 7px;font-size:11px" onclick="moveMetric('trend',${i},1)" ${i===mm.trend.length-1?'disabled':''}>↓</button>
      <button class="del" style="border:none;background:none;padding:3px 5px" onclick="hideMetric('trend','${esc(o.name)}')">非表示</button>
    </div>`; });
  h+=`<button class="btn sm" style="margin-top:8px" onclick="sheetAddMetric('trend')">＋ 指標を追加</button>`;
  // 非表示の指標
  const hs=mm.hiddenSnap||[], ht=mm.hiddenTrend||[];
  if(hs.length||ht.length){
    h+=`<div class="lbl">非表示の指標 (${hs.length+ht.length})</div>`;
    h+='<div class="muted" style="font-size:11px;margin-bottom:6px">取り込み済みのデータは保持されています。</div>';
    hs.forEach(k=>{ h+=`<div class="row" style="display:flex;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line)"><span style="flex:1;font-size:12px;color:var(--ink3)">${esc(k)} <span class="chip gray" style="font-size:11px">スナップ</span></span><button class="btn sm" style="width:auto;padding:3px 9px;font-size:11px" onclick="restoreMetric('snap','${esc(k)}')">復元</button></div>`; });
    ht.forEach(o=>{ h+=`<div class="row" style="display:flex;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line)"><span style="flex:1;font-size:12px;color:var(--ink3)">${esc(o.name)} <span class="chip gray" style="font-size:11px">推移</span></span><button class="btn sm" style="width:auto;padding:3px 9px;font-size:11px" onclick="restoreMetric('trend','${esc(o.name)}')">復元</button></div>`; });
  }
  // 分析セクション
  h+=`<div class="lbl">分析セクション</div>`;
  h+=`<button class="btn" onclick="sheetSectionMaster(null)">大カテゴリの表示/非表示を設定</button>`;
  h+=`<button class="btn ghost" style="margin-top:14px" onclick="closeSheet()">← 閉じる</button>`;
  openSheet(h);
}
// 市場・テーマ用の指標設定。銘柄用と違い業績推移(trend)は無く、スナップショットだけを持つ
// 粒度(市場/業界/テーマ)ごとに別々のマスターを編集する。開いているカードの粒度が対象
function curScopeMet(){ const s=STATE.stockId?stock(STATE.stockId):null; return DB[(s&&isMkt(s)?scopeKeys(s):SCOPE_KEYS['市場']).met]; }
function curScopeName(){ const s=STATE.stockId?stock(STATE.stockId):null; return (s&&isMkt(s)?scopeOf(s):'市場'); }
function sheetMarketMetricsMaster(){
  const mm=curScopeMet(); const sc=curScopeName();
  let h=`<h3>${esc(sc)}の指標の設定</h3>
    <div class="muted" style="margin-bottom:12px">「${esc(sc)}」のカードすべてに共通の設定です。当日の値動きではなく、数か月単位で見直す水準を想定しています。項目は後からいつでも追加・削除できます。</div>`;
  h+=`<div class="lbl" style="margin-top:0">指標 (${mm.snap.length})</div>`;
  if(!mm.snap.length) h+='<div class="muted" style="padding:0 2px 6px">まだありません。会話を取り込むと自動で増えます。</div>';
  mm.snap.forEach((k,i)=>{
    h+=`<div class="row" style="display:flex;align-items:center;gap:8px;padding:7px 2px;border-bottom:1px solid var(--line)">
      <span style="flex:1;font-size:13px">${esc(k)}</span>
      <button class="btn sm" style="width:auto;padding:3px 7px;font-size:11px" onclick="moveMarketMetric(${i},-1)" ${i===0?'disabled':''}>↑</button>
      <button class="btn sm" style="width:auto;padding:3px 7px;font-size:11px" onclick="moveMarketMetric(${i},1)" ${i===mm.snap.length-1?'disabled':''}>↓</button>
      <button class="del" style="border:none;background:none;padding:3px 5px" onclick="hideMarketMetric('${escArg(k)}')">非表示</button>
    </div>`; });
  h+=`<button class="btn sm" style="margin-top:8px" onclick="sheetAddMarketMetric()">＋ 指標を追加</button>`;
  const hs=mm.hiddenSnap||[];
  if(hs.length){
    h+=`<div class="lbl">非表示の指標 (${hs.length})</div>`;
    h+='<div class="muted" style="font-size:11px;margin-bottom:6px">取り込み済みのデータは保持されています。</div>';
    hs.forEach(k=>{ h+=`<div class="row" style="display:flex;align-items:center;padding:6px 2px;border-bottom:1px solid var(--line)"><span style="flex:1;font-size:12px;color:var(--ink3)">${esc(k)}</span><button class="btn sm" style="width:auto;padding:3px 9px;font-size:11px" onclick="restoreMarketMetric('${escArg(k)}')">復元</button></div>`; });
  }
  h+=`<div class="lbl">分析セクション</div>`;
  h+=`<button class="btn" onclick="sheetSectionMaster(STATE.stockId)">大カテゴリの表示/非表示を設定</button>`;
  h+=`<button class="btn ghost" style="margin-top:14px" onclick="closeSheet()">← 閉じる</button>`;
  openSheet(h);
}
function moveMarketMetric(i,dir){
  const arr=curScopeMet().snap; const j=i+dir;
  if(j<0||j>=arr.length) return;
  const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  save(); sheetMarketMetricsMaster();
}
function hideMarketMetric(name){
  const mm=curScopeMet();
  mm.snap=mm.snap.filter(x=>x!==name);
  if(!mm.hiddenSnap) mm.hiddenSnap=[];
  if(!mm.hiddenSnap.includes(name)) mm.hiddenSnap.push(name);
  save(); sheetMarketMetricsMaster(); toast('非表示にしました(データは保持されます)');
}
function restoreMarketMetric(name){
  const mm=curScopeMet();
  mm.hiddenSnap=(mm.hiddenSnap||[]).filter(x=>x!==name);
  if(!mm.snap.includes(name)) mm.snap.push(name);
  save(); sheetMarketMetricsMaster(); toast('復元しました');
}
function sheetAddMarketMetric(){
  const sc=curScopeName();
  const PH={'市場':'例: VIX指数 / 騰落レシオ / 信用評価損益率','業界':'例: EV/EBITDA / 配当利回り(業種別)','テーマ':'例: 関連予算規模 / 導入社数'};
  openSheet(`<h3>${esc(sc)}の指標を追加</h3>
    <div class="muted" style="margin-bottom:10px">「${esc(sc)}」全体の水準を表す指標</div>
    <label class="fld"><span class="t">指標名</span><input id="amm_name" placeholder="${esc(PH[sc]||PH['市場'])}"></label>
    <button class="btn pri" onclick="doAddMarketMetric()">追加</button>
    <button class="btn ghost" style="margin-top:8px" onclick="sheetMarketMetricsMaster()">キャンセル</button>`);
}
function doAddMarketMetric(){
  const name=$('#amm_name').value.trim();
  if(!name){ toast('指標名を入力してください'); return; }
  const mm=curScopeMet();
  if(mm.snap.includes(name)){ toast('同じ指標が既にあります'); return; }
  mm.hiddenSnap=(mm.hiddenSnap||[]).filter(x=>x!==name);
  mm.snap.push(name); save(); sheetMarketMetricsMaster(); toast('追加しました');
}
function moveMetric(type,i,dir){
  const arr=DB.metricsMaster[type]; const j=i+dir;
  if(j<0||j>=arr.length) return;
  const tmp=arr[i]; arr[i]=arr[j]; arr[j]=tmp;
  save(); sheetMetricsMaster();
}
function toggleGraph(i){
  const o=DB.metricsMaster.trend[i];
  if(!o.graph && DB.metricsMaster.trend.filter(x=>x.graph).length>=4){ toast('グラフは4件までです'); return; }
  o.graph=!o.graph; save(); sheetMetricsMaster();
}
function hideMetric(type,name){
  const mm=DB.metricsMaster;
  if(type==='snap'){
    mm.snap=mm.snap.filter(x=>x!==name);
    if(!mm.hiddenSnap) mm.hiddenSnap=[];
    if(!mm.hiddenSnap.includes(name)) mm.hiddenSnap.push(name);
  } else {
    const o=mm.trend.find(x=>x.name===name);
    mm.trend=mm.trend.filter(x=>x.name!==name);
    if(!mm.hiddenTrend) mm.hiddenTrend=[];
    if(o&&!mm.hiddenTrend.some(x=>x.name===name)) mm.hiddenTrend.push(o);
  }
  save(); sheetMetricsMaster(); toast('非表示にしました(データは保持されます)');
}
function restoreMetric(type,name){
  const mm=DB.metricsMaster;
  if(type==='snap'){ mm.hiddenSnap=(mm.hiddenSnap||[]).filter(x=>x!==name); if(!mm.snap.includes(name)) mm.snap.push(name); }
  else { const o=(mm.hiddenTrend||[]).find(x=>x.name===name); mm.hiddenTrend=(mm.hiddenTrend||[]).filter(x=>x.name!==name); if(o&&!mm.trend.some(x=>x.name===name)) mm.trend.push(o); }
  save(); sheetMetricsMaster(); toast('復元しました');
}
function sheetAddMetric(type){
  const isSnap=(type==='snap');
  openSheet(`<h3>指標を追加</h3>
    <div class="muted" style="margin-bottom:10px">${isSnap?'現在値として取得する指標(PER・PBRなど)':'年度ごとの推移として取得する指標(売上高・営業利益など)'}</div>
    <label class="fld"><span class="t">指標名</span><input id="am_name" placeholder="${isSnap?'例: ROE / EV/EBITDA / 自己資本比率':'例: 純利益 / フリーCF / 営業利益率'}"></label>
    ${isSnap?'':'<label class="fld"><span class="t">グラフに表示する</span><div class="seg"><button id="am_g_on" class="on" onclick="this.classList.add(\'on\');this.nextElementSibling.classList.remove(\'on\')">表示する</button><button id="am_g_off" onclick="this.classList.add(\'on\');this.previousElementSibling.classList.remove(\'on\')">表示しない</button></div></label>'}
    <button class="btn pri" onclick="doAddMetric('${type}')">追加</button>
    <button class="btn ghost" style="margin-top:8px" onclick="sheetMetricsMaster()">キャンセル</button>`);
}
function doAddMetric(type){
  const name=$('#am_name').value.trim();
  if(!name){ toast('指標名を入力してください'); return; }
  const mm=DB.metricsMaster;
  const dup = mm.snap.includes(name)||mm.trend.some(x=>x.name===name)||(mm.hiddenSnap||[]).includes(name)||(mm.hiddenTrend||[]).some(x=>x.name===name);
  if(dup){ toast('同名の指標が既にあります(非表示かもしれません)'); return; }
  if(type==='snap'){ mm.snap.push(name); }
  else {
    let g=$('#am_g_on')&&$('#am_g_on').classList.contains('on');
    if(g && mm.trend.filter(x=>x.graph).length>=4){ g=false; toast('グラフは4件までのため、グラフ表示なしで追加します'); }
    mm.trend.push({name, graph:!!g});
  }
  save(); sheetMetricsMaster(); toast('追加しました。会話を取り込む画面で取得できます');
}
function sheetBackup(){
  openSheet(`<h3>バックアップ</h3>
    <div class="muted" style="margin-bottom:12px">端末内のデータを書き出し・読み込みします。機種変更やデータ消失に備えて、ときどき書き出しておくと安心です。</div>
    <button class="btn pri" onclick="exportData()">データを書き出す(バックアップ)</button>
    <label class="btn" style="margin-top:10px;cursor:pointer">データを読み込む(復元)
      <input type="file" accept="application/json,.json" style="display:none" onchange="importData(this)">
    </label>
    <button class="btn danger" style="margin-top:16px" onclick="resetDB()">全データを初期化</button>
    <div class="hint" style="margin-top:10px">書き出したファイルはダウンロードフォルダに保存されます。復元すると現在のデータは上書きされます。</div>`);
}

render();
</script>
</body>
</html>
